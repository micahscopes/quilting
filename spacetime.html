<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spacetime Slicer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    overflow: hidden;
    height: 100vh;
}
#ui {
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 10;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 320px;
}
.panel {
    background: rgba(22, 27, 34, 0.92);
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 12px 14px;
    backdrop-filter: blur(8px);
}
.panel h3 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: #8b949e;
    margin-bottom: 8px;
}
.btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
}
.btn {
    background: #21262d;
    border: 1px solid #30363d;
    color: #c9d1d9;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    transition: all 0.15s;
}
.btn:hover { background: #30363d; border-color: #58a6ff; }
.btn.active { background: #1f6feb; border-color: #58a6ff; color: #fff; }
.slider-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
}
.slider-group label {
    font-size: 11px;
    color: #8b949e;
    display: flex;
    justify-content: space-between;
}
.slider-group label span { color: #58a6ff; }
input[type="range"] {
    width: 100%;
    height: 4px;
    -webkit-appearance: none;
    background: #30363d;
    border-radius: 2px;
    outline: none;
}
input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #58a6ff;
    cursor: pointer;
}
input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #58a6ff;
    cursor: pointer;
    border: none;
}
#stats {
    font-size: 11px;
    color: #8b949e;
    line-height: 1.6;
}
#stats .val { color: #58a6ff; }
canvas {
    display: block;
    width: 100%;
    height: 100%;
}
.toggle-row {
    display: flex;
    align-items: center;
    gap: 8px;
}
.toggle {
    position: relative;
    width: 36px;
    height: 20px;
    background: #30363d;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
}
.toggle.on { background: #1f6feb; }
.toggle::after {
    content: '';
    position: absolute;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #c9d1d9;
    top: 2px;
    left: 2px;
    transition: left 0.2s;
}
.toggle.on::after { left: 18px; }
.toggle-label { font-size: 12px; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="ui">
    <div class="panel">
        <h3>Shape</h3>
        <div class="btn-row" id="shape-btns">
            <button class="btn active" data-shape="rotating_cube">Rotating Cube</button>
            <button class="btn" data-shape="breathing_sphere">Breathing Sphere</button>
            <button class="btn" data-shape="colliding_spheres">Colliding Spheres</button>
            <button class="btn" data-shape="twisting_torus">Twisting Torus</button>
        </div>
    </div>
    <div class="panel">
        <h3>Slice Controls</h3>
        <div class="slider-group">
            <label>Time Offset <span id="time-val">0.00</span></label>
            <input type="range" id="time-slider" min="0" max="2" step="0.01" value="0">
        </div>
        <div class="slider-group" style="margin-top: 8px;">
            <label>Tilt Angle <span id="tilt-val">0.00</span></label>
            <input type="range" id="tilt-slider" min="0" max="0.5" step="0.01" value="0">
        </div>
        <div style="margin-top: 8px;">
            <label style="font-size: 11px; color: #8b949e; display: block; margin-bottom: 4px;">Tilt Direction</label>
            <div class="btn-row" id="dir-btns">
                <button class="btn active" data-dir="x">X</button>
                <button class="btn" data-dir="y">Y</button>
                <button class="btn" data-dir="z">Z</button>
            </div>
        </div>
    </div>
    <div class="panel">
        <div class="toggle-row">
            <div class="toggle" id="animate-toggle"></div>
            <span class="toggle-label">Auto-animate</span>
        </div>
    </div>
    <div class="panel">
        <h3>Stats</h3>
        <div id="stats">
            <div>Layers: <span class="val" id="stat-layers">0</span></div>
            <div>Vertices: <span class="val" id="stat-verts">0</span></div>
            <div>Triangles: <span class="val" id="stat-tris">0</span></div>
            <div>Slice: <span class="val" id="stat-time">0.0</span> ms</div>
        </div>
    </div>
</div>

<script type="module">
import init, { create_hypermesh, slice_hypermesh } from '/pkg/quilting_wasm.js';

const LAYER_COLORS = [
    [0.34, 0.84, 0.78],  // teal
    [1.00, 0.47, 0.42],  // coral
    [1.00, 0.80, 0.30],  // gold
    [0.70, 0.58, 0.92],  // lavender
    [0.40, 0.76, 0.45],  // green
    [0.95, 0.55, 0.80],  // pink
    [0.50, 0.70, 1.00],  // sky
    [1.00, 0.65, 0.35],  // orange
];

// --- State ---
let meshInfo = null;
let animating = false;
let animDir = 1;
let camTheta = 0.5;
let camPhi = 0.4;
let camDist = 6.0;
let dragging = false;
let lastMouse = [0, 0];

// --- WebGL setup ---
const canvas = document.getElementById('canvas');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false });
if (!gl) { document.body.innerHTML = '<h1 style="color:#f85;padding:40px">WebGL2 not supported</h1>'; throw 'no webgl2'; }

function resize() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resize);
resize();

// --- Shaders ---
const VERT_SRC = `#version 300 es
layout(location=0) in vec3 a_position;
layout(location=1) in vec3 a_normal;
uniform mat4 u_mvp;
uniform mat4 u_mv;
out vec3 v_normal;
void main() {
    v_normal = normalize(mat3(u_mv) * a_normal);
    gl_Position = u_mvp * vec4(a_position, 1.0);
}
`;

const FRAG_SRC = `#version 300 es
precision mediump float;
in vec3 v_normal;
uniform vec3 u_color;
out vec4 fragColor;
void main() {
    vec3 n = normalize(v_normal);
    float light = 0.3 + 0.7 * max(dot(n, vec3(0.3, 0.6, 0.7)), 0.0);
    fragColor = vec4(u_color * light, 1.0);
}
`;

function compileShader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        console.error(gl.getShaderInfoLog(s));
        return null;
    }
    return s;
}

const vs = compileShader(gl.VERTEX_SHADER, VERT_SRC);
const fs = compileShader(gl.FRAGMENT_SHADER, FRAG_SRC);
const prog = gl.createProgram();
gl.attachShader(prog, vs);
gl.attachShader(prog, fs);
gl.bindAttribLocation(prog, 0, 'a_position');
gl.bindAttribLocation(prog, 1, 'a_normal');
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error(gl.getProgramInfoLog(prog));
}
gl.useProgram(prog);

const loc_mvp = gl.getUniformLocation(prog, 'u_mvp');
const loc_mv = gl.getUniformLocation(prog, 'u_mv');
const loc_color = gl.getUniformLocation(prog, 'u_color');

// --- GPU buffers per layer ---
let layerBuffers = [];  // [{vao, vbo, count}]

function uploadLayer(positions, faces) {
    // Expand to flat-shaded: 3 verts per triangle, each with the face normal
    const nTris = faces.length / 3;
    const data = new Float32Array(nTris * 3 * 6);  // 3 verts * (3 pos + 3 norm)

    for (let t = 0; t < nTris; t++) {
        const i0 = faces[t * 3 + 0];
        const i1 = faces[t * 3 + 1];
        const i2 = faces[t * 3 + 2];

        const ax = positions[i0 * 3], ay = positions[i0 * 3 + 1], az = positions[i0 * 3 + 2];
        const bx = positions[i1 * 3], by = positions[i1 * 3 + 1], bz = positions[i1 * 3 + 2];
        const cx = positions[i2 * 3], cy = positions[i2 * 3 + 1], cz = positions[i2 * 3 + 2];

        // Edge vectors
        const e1x = bx - ax, e1y = by - ay, e1z = bz - az;
        const e2x = cx - ax, e2y = cy - ay, e2z = cz - az;

        // Cross product
        let nx = e1y * e2z - e1z * e2y;
        let ny = e1z * e2x - e1x * e2z;
        let nz = e1x * e2y - e1y * e2x;
        const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
        if (len > 1e-12) { nx /= len; ny /= len; nz /= len; }

        const base = t * 18;
        // Vertex 0
        data[base +  0] = ax; data[base +  1] = ay; data[base +  2] = az;
        data[base +  3] = nx; data[base +  4] = ny; data[base +  5] = nz;
        // Vertex 1
        data[base +  6] = bx; data[base +  7] = by; data[base +  8] = bz;
        data[base +  9] = nx; data[base + 10] = ny; data[base + 11] = nz;
        // Vertex 2
        data[base + 12] = cx; data[base + 13] = cy; data[base + 14] = cz;
        data[base + 15] = nx; data[base + 16] = ny; data[base + 17] = nz;
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, data, gl.DYNAMIC_DRAW);
    // position
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 24, 0);
    // normal
    gl.enableVertexAttribArray(1);
    gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 12);
    gl.bindVertexArray(null);

    return { vao, vbo, count: nTris * 3 };
}

function clearLayers() {
    for (const lb of layerBuffers) {
        gl.deleteVertexArray(lb.vao);
        gl.deleteBuffer(lb.vbo);
    }
    layerBuffers = [];
}

// --- Matrix math ---
function mat4_perspective(fovy, aspect, near, far) {
    const f = 1.0 / Math.tan(fovy / 2);
    const nf = 1 / (near - far);
    return new Float32Array([
        f / aspect, 0, 0, 0,
        0, f, 0, 0,
        0, 0, (far + near) * nf, -1,
        0, 0, 2 * far * near * nf, 0,
    ]);
}

function mat4_lookAt(eye, center, up) {
    const zx = eye[0] - center[0], zy = eye[1] - center[1], zz = eye[2] - center[2];
    let len = Math.sqrt(zx * zx + zy * zy + zz * zz);
    const iz = 1 / len;
    const fzx = zx * iz, fzy = zy * iz, fzz = zz * iz;
    let xx = up[1] * fzz - up[2] * fzy;
    let xy = up[2] * fzx - up[0] * fzz;
    let xz = up[0] * fzy - up[1] * fzx;
    len = Math.sqrt(xx * xx + xy * xy + xz * xz);
    const ix = 1 / len;
    xx *= ix; xy *= ix; xz *= ix;
    const yx = fzy * xz - fzz * xy;
    const yy = fzz * xx - fzx * xz;
    const yz = fzx * xy - fzy * xx;
    return new Float32Array([
        xx, yx, fzx, 0,
        xy, yy, fzy, 0,
        xz, yz, fzz, 0,
        -(xx * eye[0] + xy * eye[1] + xz * eye[2]),
        -(yx * eye[0] + yy * eye[1] + yz * eye[2]),
        -(fzx * eye[0] + fzy * eye[1] + fzz * eye[2]),
        1,
    ]);
}

function mat4_mul(a, b) {
    const o = new Float32Array(16);
    for (let i = 0; i < 4; i++) {
        for (let j = 0; j < 4; j++) {
            let s = 0;
            for (let k = 0; k < 4; k++) s += a[k * 4 + i] * b[j * 4 + k];
            o[j * 4 + i] = s;
        }
    }
    return o;
}

// --- Slicing logic ---
function getSliceNormal() {
    const tilt = parseFloat(document.getElementById('tilt-slider').value);
    const dirBtns = document.querySelectorAll('#dir-btns .btn');
    let dir = 'x';
    dirBtns.forEach(b => { if (b.classList.contains('active')) dir = b.dataset.dir; });

    const sinT = Math.sin(tilt);
    const cosT = Math.cos(tilt);

    let normal;
    if (dir === 'x') normal = [sinT, 0, 0, cosT];
    else if (dir === 'y') normal = [0, sinT, 0, cosT];
    else normal = [0, 0, sinT, cosT];

    return normal;
}

function doSlice() {
    if (!meshInfo) return;

    const timeOffset = parseFloat(document.getElementById('time-slider').value);
    const normal = getSliceNormal();
    const cosT = normal[3];
    const offset = timeOffset * cosT;

    const t0 = performance.now();
    const result = slice_hypermesh(new Float64Array(normal), offset);
    const elapsed = performance.now() - t0;

    clearLayers();

    let totalVerts = 0;
    let totalTris = 0;

    if (result.layers) {
        for (const layer of result.layers) {
            const nFaces = layer.faces.length / 3;
            if (nFaces === 0) continue;
            const lb = uploadLayer(layer.positions, layer.faces);
            layerBuffers.push(lb);
            totalVerts += layer.positions.length / 3;
            totalTris += nFaces;
        }
    }

    document.getElementById('stat-layers').textContent = layerBuffers.length;
    document.getElementById('stat-verts').textContent = totalVerts;
    document.getElementById('stat-tris').textContent = totalTris;
    document.getElementById('stat-time').textContent = elapsed.toFixed(1);
}

// --- Render ---
function render() {
    const aspect = canvas.width / canvas.height;
    const proj = mat4_perspective(Math.PI / 4, aspect, 0.1, 100);

    const eyeX = camDist * Math.cos(camPhi) * Math.sin(camTheta);
    const eyeY = camDist * Math.sin(camPhi);
    const eyeZ = camDist * Math.cos(camPhi) * Math.cos(camTheta);
    const view = mat4_lookAt([eyeX, eyeY, eyeZ], [0, 0, 0], [0, 1, 0]);
    const mvp = mat4_mul(proj, view);

    gl.clearColor(0.051, 0.067, 0.090, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.DEPTH_TEST);
    gl.enable(gl.CULL_FACE);
    gl.cullFace(gl.BACK);

    gl.useProgram(prog);
    gl.uniformMatrix4fv(loc_mvp, false, mvp);
    gl.uniformMatrix4fv(loc_mv, false, view);

    for (let i = 0; i < layerBuffers.length; i++) {
        const color = LAYER_COLORS[i % LAYER_COLORS.length];
        gl.uniform3f(loc_color, color[0], color[1], color[2]);
        gl.bindVertexArray(layerBuffers[i].vao);
        gl.drawArrays(gl.TRIANGLES, 0, layerBuffers[i].count);
    }

    gl.bindVertexArray(null);
}

// --- Animation loop ---
function frame() {
    if (animating && meshInfo) {
        const slider = document.getElementById('time-slider');
        let val = parseFloat(slider.value);
        const speed = 0.008 * (meshInfo.time_max - meshInfo.time_min);
        val += speed * animDir;
        if (val >= meshInfo.time_max) { val = meshInfo.time_max; animDir = -1; }
        if (val <= meshInfo.time_min) { val = meshInfo.time_min; animDir = 1; }
        slider.value = val;
        document.getElementById('time-val').textContent = val.toFixed(2);
        doSlice();
    }
    render();
    requestAnimationFrame(frame);
}

// --- Mouse/touch orbit ---
canvas.addEventListener('mousedown', e => {
    dragging = true;
    lastMouse = [e.clientX, e.clientY];
});
window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastMouse[0];
    const dy = e.clientY - lastMouse[1];
    lastMouse = [e.clientX, e.clientY];
    camTheta += dx * 0.005;
    camPhi += dy * 0.005;
    camPhi = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camPhi));
});
window.addEventListener('mouseup', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    camDist *= 1 + e.deltaY * 0.001;
    camDist = Math.max(1.5, Math.min(30, camDist));
}, { passive: false });

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => {
    if (e.touches.length === 1) {
        lastTouch = [e.touches[0].clientX, e.touches[0].clientY];
    }
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1 && lastTouch) {
        const dx = e.touches[0].clientX - lastTouch[0];
        const dy = e.touches[0].clientY - lastTouch[1];
        lastTouch = [e.touches[0].clientX, e.touches[0].clientY];
        camTheta += dx * 0.005;
        camPhi += dy * 0.005;
        camPhi = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, camPhi));
    }
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouch = null; });

// --- UI wiring ---
function setupShapeButtons() {
    const btns = document.querySelectorAll('#shape-btns .btn');
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            loadShape(btn.dataset.shape);
        });
    });
}

function setupDirButtons() {
    const btns = document.querySelectorAll('#dir-btns .btn');
    btns.forEach(btn => {
        btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            doSlice();
        });
    });
}

function setupSliders() {
    const timeSlider = document.getElementById('time-slider');
    const tiltSlider = document.getElementById('tilt-slider');

    timeSlider.addEventListener('input', () => {
        document.getElementById('time-val').textContent = parseFloat(timeSlider.value).toFixed(2);
        doSlice();
    });
    tiltSlider.addEventListener('input', () => {
        document.getElementById('tilt-val').textContent = parseFloat(tiltSlider.value).toFixed(2);
        doSlice();
    });
}

function setupAnimateToggle() {
    const toggle = document.getElementById('animate-toggle');
    toggle.addEventListener('click', () => {
        animating = !animating;
        toggle.classList.toggle('on', animating);
    });
}

function loadShape(name) {
    meshInfo = create_hypermesh(name);

    const timeSlider = document.getElementById('time-slider');
    timeSlider.min = meshInfo.time_min;
    timeSlider.max = meshInfo.time_max;
    timeSlider.step = (meshInfo.time_max - meshInfo.time_min) / 200;
    timeSlider.value = (meshInfo.time_min + meshInfo.time_max) / 2;
    document.getElementById('time-val').textContent = parseFloat(timeSlider.value).toFixed(2);

    animDir = 1;
    doSlice();
}

// --- Init ---
async function main() {
    await init('/pkg/quilting_wasm_bg.wasm');

    setupShapeButtons();
    setupDirButtons();
    setupSliders();
    setupAnimateToggle();

    loadShape('rotating_cube');
    requestAnimationFrame(frame);
}

main().catch(e => console.error('Init error:', e));
</script>
</body>
</html>
