[package]
name = "hyperscope-hhhs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AppStore and durable HHHS session integration for Hyperscope"

[dependencies]
hhhs.workspace = true
hhhs-replica.workspace = true
hyperscape-hhhs = { version = "0.1.0", path = "../hyperscape-hhhs" }
hyperscape-protocol = { version = "0.1.0", path = "../hyperscape-protocol" }
hyperscope-app = { version = "0.1.0", path = "../hyperscope-app" }
thiserror = "2"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
hhhs-store.workspace = true
serde_json = "1"
