[package]
name = "quilting-wasm"
version = "0.1.0"
edition = "2021"
description = "WASM bindings for quilting tessellation"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
quilting-core = { path = "../quilting-core" }
quilting-mesh = { path = "../quilting-mesh" }
quilting-shaders = { path = "../quilting-shaders" }

quilting-gltf = { path = "../quilting-gltf" }
wasm-bindgen = "=0.2.106"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1.7", optional = true }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
rustc-hash = "2"
web-sys = { version = "0.3", features = [
    "console", "Performance", "OffscreenCanvas", "WebGl2RenderingContext",
    "Window", "Document", "Element", "HtmlCanvasElement",
] }
glow = "0.16"
quilting-renderer = { path = "../quilting-renderer" }
fuzzy-vision = { path = "../fuzzy-vision" }
tracing = "0.1"
wasm-tracing = "2.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
