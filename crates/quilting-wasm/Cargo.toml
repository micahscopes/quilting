[package]
name = "quilting-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "WASM bindings for quilting tessellation"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]
leptos-ui = ["dep:hyperscope-web", "hyperscope-web/csr"]

[dependencies]
quilting-core = { version = "0.1.0", path = "../quilting-core" }
quilting-mesh = { version = "0.1.0", path = "../quilting-mesh" }
quilting-shaders = { version = "0.1.0", path = "../quilting-shaders" }

quilting-gltf = { version = "0.1.0", path = "../quilting-gltf" }
hyperscape = { version = "0.1.0", path = "../hyperscape" }
hyperscape-protocol = { version = "0.1.0", path = "../hyperscape-protocol" }
hyperscope-app = { version = "0.1.0", path = "../hyperscope-app" }
hyperscope-web = { version = "0.1.0", path = "../hyperscope-web", optional = true }
quilting-remesh = { version = "0.1.0", path = "../quilting-remesh" }
quilting-round-index = { version = "0.1.0", path = "../quilting-round-index" }
wasm-bindgen = "=0.2.108"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
uuid = "1"
console_error_panic_hook = { version = "0.1.7", optional = true }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"
rustc-hash = "2"
web-sys = { version = "0.3", features = [
    "console", "Performance", "OffscreenCanvas", "WebGl2RenderingContext",
    "Window", "Document", "Element", "HtmlCanvasElement", "HtmlElement", "ImageBitmap",
] }
glow = "0.16"
quilting-renderer = { version = "0.1.0", path = "../quilting-renderer" }
fuzzy-vision = { version = "0.1.0", path = "../fuzzy-vision" }
tracing = "0.1"
wasm-tracing = "2.1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
