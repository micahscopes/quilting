[package]
name = "quilting-remesh"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "VSA clustering and QB patch fitting — turns a dense triangle mesh into curved patches"

[features]
# Experimental only. The core conformal/QB scorer and deterministic connected
# clusterer do not require C++; this feature adds meshoptimizer's meshlet order
# as an optional seed order for comparison.
meshopt-prototype = ["dep:meshopt"]

[dependencies]
quilting-core = { version = "0.1.0", path = "../quilting-core" }
quilting-mesh = { version = "0.1.0", path = "../quilting-mesh" }
meshopt = { version = "0.6.2", optional = true }

# Only the `remesh_glb` / `experiments` example harnesses need these. Keeping them
# out of [dependencies] keeps quilting-gltf off the wasm build graph.
[dev-dependencies]
quilting-gltf = { version = "0.1.0", path = "../quilting-gltf" }
rand = "0.8"
rand_pcg = "0.3"
