[package]
name = "quilting-remesh"
version = "0.1.0"
edition = "2021"

[dependencies]
quilting-core = { path = "../quilting-core" }
quilting-mesh = { path = "../quilting-mesh" }

# Only the `remesh_glb` / `experiments` example harnesses need these. Keeping them
# out of [dependencies] keeps quilting-gltf off the wasm build graph.
[dev-dependencies]
quilting-gltf = { path = "../quilting-gltf" }
rand = "0.8"
rand_pcg = "0.3"
