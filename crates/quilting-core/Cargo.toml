[package]
name = "quilting-core"
version = "0.1.0"
edition = "2021"
description = "Conformal mesh tessellation core library"

[features]
default = []
parallel = ["rayon", "distressed-blue-noise/parallel"]

[dependencies]
quilting-mesh = { path = "../quilting-mesh" }
distressed-blue-noise = { path = "../distressed-blue-noise" }
delaunator = "1.0"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.8"
rand_pcg = "0.3"

[dependencies.rayon]
version = "1"
optional = true
