[package]
name = "quilting-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Conformal mesh tessellation core library"

[features]
default = []
parallel = ["rayon", "distressed-blue-noise/parallel"]

[dependencies]
quilting-mesh = { path = "../quilting-mesh" }
distressed-blue-noise = { path = "../distressed-blue-noise" }
cdt = "0.1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
rand = "0.8"
rand_pcg = "0.3"

[dependencies.rayon]
version = "1"
optional = true

[dev-dependencies]
# Dev-only cycle (quilting-gltf depends on quilting-core); cargo permits this.
# Used by tests/mobius_finiteness.rs to sweep the tracked demo meshes.
quilting-gltf = { path = "../quilting-gltf" }
