<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quilting — Conformal Mesh</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Consolas',monospace;background:#1a1a2e;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
#sidebar{width:240px;padding:16px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;gap:12px;flex-shrink:0;overflow-y:auto}
h1{font-size:16px;color:#e94560;letter-spacing:2px}
label{font-size:11px;color:#8899aa;text-transform:uppercase;letter-spacing:1px}
.sr{display:flex;align-items:center;gap:6px}
input[type=range]{flex:1;accent-color:#e94560}
.v{font-size:13px;min-width:36px;text-align:right;color:#e94560;font-weight:bold}
.btns{display:flex;gap:3px}
.btns button{flex:1;padding:5px;font-size:10px;font-family:inherit;border:1px solid #0f3460;background:transparent;color:#8899aa;cursor:pointer;border-radius:3px}
.btns button.a{background:#e94560;color:#fff;border-color:#e94560}
.stats{font-size:10px;color:#556677;line-height:1.5;margin-top:auto;padding-top:12px;border-top:1px solid #0f3460}
#wrap{flex:1;position:relative}
#cv{position:absolute;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="sidebar">
  <h1>QUILTING 3D</h1>
  <div><label>Shape</label>
    <div class="btns" id="shape-btns">
      <button class="a" data-v="cube">Cube</button>
      <button data-v="tetrahedron">Tet</button>
      <button data-v="octahedron">Oct</button>
      <button data-v="icosahedron">Ico</button>
    </div>
  </div>
  <div><label>Resolution (0=auto)</label>
    <div class="sr"><input type="range" id="res" min="0" max="6" value="0"><span class="v" id="res-v">auto</span></div>
  </div>
  <div><label>Sphere X</label>
    <div class="sr"><input type="range" id="sx" min="-30" max="30" value="5"><span class="v" id="sx-v">0.5</span></div>
  </div>
  <div><label>Sphere Y</label>
    <div class="sr"><input type="range" id="sy" min="-30" max="30" value="0"><span class="v" id="sy-v">0.0</span></div>
  </div>
  <div><label>Sphere Z</label>
    <div class="sr"><input type="range" id="sz" min="-30" max="30" value="0"><span class="v" id="sz-v">0.0</span></div>
  </div>
  <div><label>Sphere radius</label>
    <div class="sr"><input type="range" id="sr" min="0" max="50" value="20"><span class="v" id="sr-v">2.0</span></div>
  </div>
  <div class="stats" id="stats">Loading...</div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script>
const $=s=>document.getElementById(s);
const canvas=$('cv');
const gl=canvas.getContext('webgl2',{antialias:true});

let shape='cube', rotX=0.3, rotY=0.5, zoom=5, fetching=false;

const VS=`#version 300 es
layout(location=0) in vec3 a_bary;
layout(location=1) in vec4 a_p0;
layout(location=2) in vec4 a_p1;
layout(location=3) in vec4 a_p2;
layout(location=4) in vec4 a_w0;
layout(location=5) in vec4 a_w1;
layout(location=6) in vec4 a_w2;
uniform mat4 u_mvp;
uniform int u_useQB;

vec4 qm(vec4 a, vec4 b) {
  return vec4(
    a.x*b.x - a.y*b.y - a.z*b.z - a.w*b.w,
    a.x*b.y + a.y*b.x + a.z*b.w - a.w*b.z,
    a.x*b.z - a.y*b.w + a.z*b.x + a.w*b.y,
    a.x*b.w + a.y*b.z - a.z*b.y + a.w*b.x);
}
vec4 qinv(vec4 q) { return vec4(q.x, -q.yzw) / dot(q,q); }

void main(){
  vec3 p;
  if (u_useQB == 1) {
    vec4 top = a_bary.x * qm(a_p0, a_w0) + a_bary.y * qm(a_p1, a_w1) + a_bary.z * qm(a_p2, a_w2);
    vec4 bot = a_bary.x * a_w0 + a_bary.y * a_w1 + a_bary.z * a_w2;
    p = qm(top, qinv(bot)).yzw;
  } else {
    p = a_bary.x * a_p0.yzw + a_bary.y * a_p1.yzw + a_bary.z * a_p2.yzw;
  }
  gl_Position = u_mvp * vec4(p, 1.0);
}`;

const FS=`#version 300 es
precision mediump float;
uniform vec3 u_color;
out vec4 o;
void main(){ o = vec4(u_color, 1.0); }`;

function mkS(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error('SHADER:',gl.getShaderInfoLog(s));return s;}
const prog=gl.createProgram();
gl.attachShader(prog,mkS(VS,gl.VERTEX_SHADER));
gl.attachShader(prog,mkS(FS,gl.FRAGMENT_SHADER));
gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))console.error('LINK:',gl.getProgramInfoLog(prog));
const uMVP=gl.getUniformLocation(prog,'u_mvp');
const uColor=gl.getUniformLocation(prog,'u_color');
const uUseQB=gl.getUniformLocation(prog,'u_useQB');

// Each batch = {vaoOrig, vaoXform, numIdx, numInst}
let drawBatches = [];

function makeVAO(baryData, lineData, instanceData, numFaces) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);

  const bb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bb);
  gl.bufferData(gl.ARRAY_BUFFER, baryData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);

  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);
  for (let i = 0; i < 6; i++) {
    gl.enableVertexAttribArray(1+i);
    gl.vertexAttribPointer(1+i, 4, gl.FLOAT, false, 96, i*16);
    gl.vertexAttribDivisor(1+i, 1);
  }

  const eb = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, lineData, gl.STATIC_DRAW);

  gl.bindVertexArray(null);
  return vao;
}

function upload(data) {
  // Clean up old batches
  for (const b of drawBatches) {
    gl.deleteVertexArray(b.vaoOrig);
    gl.deleteVertexArray(b.vaoXform);
  }
  drawBatches = [];

  for (const batch of data.batches) {
    const baryData = new Float32Array(batch.tess_bary);

    // Build wireframe line indices from triangles
    const tris = batch.tess_triangles;
    const lines = [];
    for (let i = 0; i < tris.length; i += 3) {
      lines.push(tris[i],tris[i+1], tris[i+1],tris[i+2], tris[i+2],tris[i]);
    }
    const lineData = new Uint32Array(lines);

    const origData = new Float32Array(batch.instances_orig);
    const xformData = new Float32Array(batch.instances_xform);

    drawBatches.push({
      vaoOrig: makeVAO(baryData, lineData, origData, batch.num_faces),
      vaoXform: makeVAO(baryData, lineData, xformData, batch.num_faces),
      numIdx: lines.length,
      numInst: batch.num_faces,
      lod: batch.lod,
    });
  }
}

function perspective(fov, aspect, near, far) {
  const f = 1.0 / Math.tan(fov * 0.5);
  const ri = 1.0 / (near - far);
  return new Float32Array([f/aspect,0,0,0, 0,f,0,0, 0,0,(near+far)*ri,-1, 0,0,near*far*ri*2,0]);
}

function lookAt(ex,ey,ez, tx,ty,tz, ux,uy,uz) {
  let fx=tx-ex, fy=ty-ey, fz=tz-ez;
  let fl=Math.hypot(fx,fy,fz); fx/=fl; fy/=fl; fz/=fl;
  let sx=fy*uz-fz*uy, sy=fz*ux-fx*uz, sz=fx*uy-fy*ux;
  let sl=Math.hypot(sx,sy,sz); sx/=sl; sy/=sl; sz/=sl;
  let ux2=sy*fz-sz*fy, uy2=sz*fx-sx*fz, uz2=sx*fy-sy*fx;
  return new Float32Array([
    sx,ux2,-fx,0, sy,uy2,-fy,0, sz,uz2,-fz,0,
    -(sx*ex+sy*ey+sz*ez), -(ux2*ex+uy2*ey+uz2*ez), fx*ex+fy*ey+fz*ez, 1]);
}

function mulMat4(a, b) {
  const o = new Float32Array(16);
  for (let c=0;c<4;c++) for (let r=0;r<4;r++)
    o[c*4+r] = a[r]*b[c*4] + a[4+r]*b[c*4+1] + a[8+r]*b[c*4+2] + a[12+r]*b[c*4+3];
  return o;
}

function render() {
  const w = $('wrap');
  canvas.width = w.clientWidth;
  canvas.height = w.clientHeight;
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(0.06, 0.06, 0.14, 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  if (!drawBatches.length) return;

  const aspect = canvas.width / canvas.height;
  const eyeX = zoom * Math.sin(rotY) * Math.cos(rotX);
  const eyeY = zoom * Math.sin(rotX);
  const eyeZ = zoom * Math.cos(rotY) * Math.cos(rotX);
  const mvp = mulMat4(perspective(Math.PI/3, aspect, 0.1, 100.0), lookAt(eyeX,eyeY,eyeZ, 0,0,0, 0,1,0));

  gl.useProgram(prog);
  gl.uniformMatrix4fv(uMVP, false, mvp);

  // Draw original (dim) — all batches
  gl.uniform3f(uColor, 0.3, 0.3, 0.4);
  gl.uniform1i(uUseQB, 0);
  for (const b of drawBatches) {
    gl.bindVertexArray(b.vaoOrig);
    gl.drawElementsInstanced(gl.LINES, b.numIdx, gl.UNSIGNED_INT, 0, b.numInst);
  }

  // Draw transformed (bright) — all batches with QB
  gl.uniform3f(uColor, 0.91, 0.27, 0.37);
  gl.uniform1i(uUseQB, 1);
  for (const b of drawBatches) {
    gl.bindVertexArray(b.vaoXform);
    gl.drawElementsInstanced(gl.LINES, b.numIdx, gl.UNSIGNED_INT, 0, b.numInst);
  }

  gl.bindVertexArray(null);
}

async function fetchMesh() {
  if (fetching) return; fetching = true;
  const resVal = parseInt($('res').value);
  const res = resVal === 0 ? 0 : (1 << resVal);
  const sx = parseInt($('sx').value)/10;
  const sy = parseInt($('sy').value)/10;
  const sz = parseInt($('sz').value)/10;
  const sr = parseInt($('sr').value)/10;
  $('res-v').textContent = res === 0 ? 'auto' : res;
  $('sx-v').textContent = sx.toFixed(1);
  $('sy-v').textContent = sy.toFixed(1);
  $('sz-v').textContent = sz.toFixed(1);
  $('sr-v').textContent = sr.toFixed(1);
  try {
    const t0 = performance.now();
    const r = await fetch(`/mesh?shape=${shape}&res=${res}&sx=${sx}&sy=${sy}&sz=${sz}&sr=${sr}`);
    const d = await r.json();
    upload(d); render();
    const lods = d.batches.map(b => `[${b.lod}]`).join(' ');
    $('stats').innerHTML = `Faces: ${d.total_faces}<br>Batches: ${d.num_batches}<br>LODs: ${lods}<br>${(performance.now()-t0).toFixed(0)}ms`;
  } catch(e) { console.error(e); }
  fetching = false;
}

for (const b of document.querySelectorAll('#shape-btns button'))
  b.onclick = () => { shape=b.dataset.v; document.querySelectorAll('#shape-btns button').forEach(x=>x.classList.remove('a')); b.classList.add('a'); fetchMesh(); };
for (const id of ['res','sx','sy','sz','sr'])
  $(id).addEventListener('input', fetchMesh);

let drag=false, lx=0, ly=0;
canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
onmouseup = () => drag=false;
onmousemove = e => { if(!drag)return; rotY+=(e.clientX-lx)*0.01; rotX+=(e.clientY-ly)*0.01; lx=e.clientX; ly=e.clientY; render(); };
canvas.onwheel = e => { zoom *= e.deltaY>0 ? 1.1 : 0.9; zoom=Math.max(1,Math.min(100,zoom)); render(); e.preventDefault(); };
onresize = render;
fetchMesh();
</script>
</body>
</html>
