[package]
name = "hyperscope-web"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Optional browser-host adapters for Hyperscope"

[features]
default = []
durable-history = [
    "dep:hhhs",
    "dep:hhhs-replica",
    "dep:hhhs-store",
    "dep:hyperscape-hhhs",
    "dep:futures",
    "dep:indexed_db_futures",
    "dep:js-sys",
    "dep:thiserror",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
]
local-peer-relay = [
    "dep:serde",
    "dep:serde_json",
    "dep:tiny_http",
    "dep:uuid",
]

[dependencies]
hhhs = { workspace = true, optional = true }
hhhs-replica = { workspace = true, optional = true }
hhhs-store = { workspace = true, optional = true }
hyperscape-hhhs = { version = "0.1.0", path = "../hyperscape-hhhs", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", features = ["raw_value"], optional = true }
thiserror = { version = "2", optional = true }
tiny_http = { version = "0.12", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[[bin]]
name = "hyperscope-local-peer-relay"
path = "src/bin/local_peer_relay.rs"
required-features = ["local-peer-relay"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures = { version = "0.3", optional = true }
indexed_db_futures = { version = "=0.6.4", features = ["typed-arrays", "version-change"], optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "=0.2.106", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
hyperscape-protocol = { version = "0.1.0", path = "../hyperscape-protocol" }
wasm-bindgen-test = "0.3"
