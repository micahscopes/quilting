[package]
name = "quilting-gltf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "glTF 2.0 loader for quilting — extracts meshes, materials, animations, and scene graphs"

[dependencies]
quilting-core = { version = "0.1.0", path = "../quilting-core" }
quilting-mesh = { version = "0.1.0", path = "../quilting-mesh" }

gltf = { version = "1.4", features = ["KHR_materials_unlit", "extensions", "extras", "KHR_texture_transform"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
