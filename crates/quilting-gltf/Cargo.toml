[package]
name = "quilting-gltf"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "glTF 2.0 loader for quilting — extracts meshes, materials, animations, and scene graphs"

[dependencies]
quilting-core = { path = "../quilting-core" }
quilting-mesh = { path = "../quilting-mesh" }

gltf = { version = "1.4", features = ["KHR_materials_unlit", "extensions", "KHR_texture_transform"] }

[dev-dependencies]
serde_json = "1"
