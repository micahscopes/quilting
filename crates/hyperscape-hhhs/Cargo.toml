[package]
name = "hyperscape-hhhs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Versioned durable HHHS authored-operation adapter for Hyperscape"

[dependencies]
base64 = "0.22"
bincode = "=1.3.3"
futures = "0.3"
futures-signals = "0.3"
hhhs.workspace = true
hhhs-reactive.workspace = true
hhhs-replica.workspace = true
hhhs-store.workspace = true
hhhs-sync.workspace = true
hyperscape-protocol = { version = "0.1.0", path = "../hyperscape-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = "1"

[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
