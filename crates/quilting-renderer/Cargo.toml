[package]
name = "quilting-renderer"
version = "0.1.0"
edition = "2021"
description = "glow-based WebGL2/OpenGL renderer for quilting QB surfaces"

[dependencies]
glow = "0.16"
quilting-shaders = { path = "../quilting-shaders" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3", features = ["console"] }
