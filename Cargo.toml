[workspace]
members = [
    "crates/distressed-blue-noise",
    "crates/fuzzy-vision",
    "crates/hyperscape",
    "crates/hyperscape-hhhs",
    "crates/hyperscape-protocol",
    "crates/hyperscope-app",
    "crates/hyperscope-hhhs-shadow",
    "crates/hyperscope-web",
    "crates/quilting-core",
    "crates/quilting-gltf",
    "crates/quilting-mesh",
    "crates/quilting-remesh",
    "crates/quilting-renderer",
    "crates/quilting-round-index",
    "crates/quilting-shaders",
    "crates/quilting-wasm",
    "crates/trunk-stub",
]

# `quilting-wasm` only compiles for wasm32 (it calls
# `glow::Context::from_webgl2_context`), and `trunk-stub` is a placeholder
# cdylib that exists solely to give Trunk something to build. Excluding both
# from the default set lets a bare `cargo build` / `cargo test` succeed on a
# fresh clone. Build them explicitly:
#
#     cargo check --target wasm32-unknown-unknown -p quilting-wasm
default-members = [
    "crates/distressed-blue-noise",
    "crates/fuzzy-vision",
    "crates/hyperscape",
    "crates/hyperscape-protocol",
    "crates/hyperscope-app",
    "crates/quilting-core",
    "crates/quilting-gltf",
    "crates/quilting-mesh",
    "crates/quilting-remesh",
    "crates/quilting-renderer",
    "crates/quilting-round-index",
    "crates/quilting-shaders",
]
resolver = "2"

# Shared metadata. Crates opt in with `license.workspace = true`, etc.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Micah <micahscopes@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/micahscopes/quilting"

[workspace.dependencies]
hhhs = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs", rev = "476a4c6a800fed215dade5089ac2c241ca79fcf8" }
hhhs-reactive = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs", rev = "476a4c6a800fed215dade5089ac2c241ca79fcf8" }
hhhs-replica = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs", rev = "476a4c6a800fed215dade5089ac2c241ca79fcf8" }
hhhs-store = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs", rev = "476a4c6a800fed215dade5089ac2c241ca79fcf8" }
hhhs-sync = { version = "0.4.2", git = "https://gitlab.com/micahscopes/hhhs-rs", rev = "476a4c6a800fed215dade5089ac2c241ca79fcf8", features = ["driver"] }

[profile.release]
opt-level = 2

# Keep fast debug builds for the WASM boundary while optimizing the numeric
# libraries used by tessellation-atlas generation.
[profile.dev.package.quilting-core]
opt-level = 3

[profile.dev.package.distressed-blue-noise]
opt-level = 3

[profile.dev.package.cdt]
opt-level = 3

# Fast release builds for iteration — use `cargo build --profile release-fast`
[profile.release-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
