function uploadPbrUBO(mat) {
  pbrUboF32.fill(0);
  // base_color: vec4 at offset 0
  pbrUboF32[0] = mat.baseColor[0]; pbrUboF32[1] = mat.baseColor[1];
  pbrUboF32[2] = mat.baseColor[2]; pbrUboF32[3] = mat.baseColor[3] || 1.0;
  // metallic, roughness at offset 16, 20
  pbrUboF32[4] = mat.metallic;
  pbrUboF32[5] = mat.roughness;
  // has_base_color_tex, has_mr_tex at offset 24, 28
  pbrUboF32[6] = mat.hasBaseColorTex ? 1.0 : 0.0;
  pbrUboF32[7] = mat.hasMetallicRoughnessTex ? 1.0 : 0.0;
  // emissive_factor: vec4 at offset 32 (rgb, w=0)
  const ef = mat.emissiveFactor || [0, 0, 0];
  pbrUboF32[8] = ef[0]; pbrUboF32[9] = ef[1]; pbrUboF32[10] = ef[2]; pbrUboF32[11] = 0;
  // normal_scale at offset 48
  pbrUboF32[12] = mat.normalScale ?? 1.0;
  // has_normal_tex, has_emissive_tex, has_occlusion_tex at offset 52, 56, 60
  pbrUboF32[13] = mat.hasNormalTex ? 1.0 : 0.0;
  pbrUboF32[14] = mat.hasEmissiveTex ? 1.0 : 0.0;
  pbrUboF32[15] = mat.hasOcclusionTex ? 1.0 : 0.0;
  // occlusion_strength, alpha_cutoff, alpha_mode at offset 64, 68, 72
  pbrUboF32[16] = mat.occlusionStrength ?? 1.0;
  pbrUboF32[17] = mat.alphaCutoff ?? 0.5;
  pbrUboF32[18] = mat.alphaMode ?? 0;
  // unlit at offset 76
  pbrUboF32[19] = mat.unlit ? 1.0 : 0.0;
  // has_env_map at offset 80, env_mip_count at offset 84
  pbrUboF32[20] = envCubemap ? 1.0 : 0.0;
  pbrUboF32[21] = envMipCount;
  // sheen_color: vec4 at offset 96 (f32 index 24), w = has_sheen flag
  const sc = mat.sheenColor || [0,0,0];
  const hasSheen = (sc[0] + sc[1] + sc[2]) > 0.001;
  pbrUboF32[24] = sc[0]; pbrUboF32[25] = sc[1]; pbrUboF32[26] = sc[2];
  pbrUboF32[27] = hasSheen ? 1.0 : 0.0;
  // sheen_roughness at offset 112 (f32 index 28)
  pbrUboF32[28] = mat.sheenRoughness ?? 0.0;
  // specular_color: vec4 at offset 128 (f32 index 32), w = has_specular flag
  const spc = mat.specularColor || [1,1,1];
  const hasSpec = Math.abs(spc[0]-1) + Math.abs(spc[1]-1) + Math.abs(spc[2]-1) > 0.01;
  pbrUboF32[32] = spc[0]; pbrUboF32[33] = spc[1]; pbrUboF32[34] = spc[2];
  pbrUboF32[35] = hasSpec ? 1.0 : 0.0;
  // normal_uv_transform: vec4 at offset 144 (f32 index 36)
  const nuvs = mat.normalUvScale || [1, 1];
  const nuvo = mat.normalUvOffset || [0, 0];
  pbrUboF32[36] = nuvs[0]; pbrUboF32[37] = nuvs[1];
  pbrUboF32[38] = nuvo[0]; pbrUboF32[39] = nuvo[1];
  // normal_uv_rotation: f32 at offset 160 (f32 index 40)
  pbrUboF32[40] = mat.normalUvRotation ?? 0;
  // base color UV transform at offset 164 (f32 index 41)
  pbrUboF32[41] = (mat.baseUvScale || [1,1])[0];
  pbrUboF32[42] = (mat.baseUvScale || [1,1])[1];
  pbrUboF32[43] = mat.baseUvRotation ?? 0;
  gl.bindBuffer(gl.UNIFORM_BUFFER, pbrUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(pbrUboData));
}

// Current Möbius quaternions — updated from sliders, written into UBO.
// Identity: a=1, b=0, c=0, d=1
let mob = { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };

// Compute Möbius a,b,c,d from transform type and parameters.
function computeMobius(type, cx, cy, cz, r) {
  if (type === 'sphere_reflection' && r > 0.01) {
    const csq = cx*cx + cy*cy + cz*cz;
    return { a: [0,cx,cy,cz], b: [csq-r*r,0,0,0], c: [1,0,0,0], d: [0,-cx,-cy,-cz] };
  }
  return { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };
}

function uploadVertexUBO(mvp, mv, permParity, permIndex, useQB, camPosWS) {
  camPosWS = camPosWS || [0, 0, 5];
  vtxUboF32.set(mvp, 0);        // offset 0
  vtxUboF32.set(mv, 16);        // offset 64
  vtxUboF32[32] = permParity;   // offset 128
  vtxUboI32[33] = permIndex;    // offset 132
  vtxUboI32[34] = useQB;        // offset 136
  // _pad at offset 140 — used as batch offset for pick pass, 0 normally
  // Möbius quaternions at offset 144 (f32 index 36)
  vtxUboF32.set(mob.a, 36);     // offset 144
  vtxUboF32.set(mob.b, 40);     // offset 160
  vtxUboF32.set(mob.c, 44);     // offset 176
  vtxUboF32.set(mob.d, 48);     // offset 192
  // camera_pos: vec4 at offset 208 (f32 index 52)
  vtxUboF32[52] = camPosWS[0];
  vtxUboF32[53] = camPosWS[1];
  vtxUboF32[54] = camPosWS[2];

  gl.bindBuffer(gl.UNIFORM_BUFFER, vtxUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(vtxUboData));
}

function uploadWireUBO(color, showDensity) {
  wireUboF32[0] = color[0];
  wireUboF32[1] = color[1];
  wireUboF32[2] = color[2];
  wireUboI32[3] = showDensity ? 1 : 0;

  gl.bindBuffer(gl.UNIFORM_BUFFER, wireUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(wireUboData));
}

function bindUBOs() {
  gl.bindBufferBase(gl.UNIFORM_BUFFER, VTX_UBO_BINDING, vtxUbo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, WIRE_UBO_BINDING, wireUbo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, PBR_UBO_BINDING, pbrUbo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, JOINT_UBO_BINDING, jointUbo);
}

function bindUniformBlocks(program) {
  const vtxIdx = gl.getUniformBlockIndex(program, 'Uniforms_block_0Vertex');
  if (vtxIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(program, vtxIdx, VTX_UBO_BINDING);
  const wireIdx = gl.getUniformBlockIndex(program, 'WireUniforms_block_0Fragment');
  if (wireIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(program, wireIdx, WIRE_UBO_BINDING);
  const jointIdx = gl.getUniformBlockIndex(program, 'JointMatrices_block_1Vertex');
  if (jointIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(program, jointIdx, JOINT_UBO_BINDING);
  // Vertex shader texture samplers (avoid conflicts with PBR fragment textures on 0-10)
  gl.useProgram(program);
  const skinTexLoc = gl.getUniformLocation(program, '_group_0_binding_2_vs');
  if (skinTexLoc) gl.uniform1i(skinTexLoc, 15);  // skinning data
  const morphTexLoc = gl.getUniformLocation(program, '_group_0_binding_3_vs');
  if (morphTexLoc) gl.uniform1i(morphTexLoc, 14); // morph deltas
  gl.useProgram(null);
}

function initShaderPrograms(vs, fsMatcap, fsWire, fsNormals, fsPbr, fsPick) {
  progMatcap = mkProg(vs, fsMatcap);
  progLod = progMatcap; // LOD uses matcap (heatmap + procedural lighting)
  progWire = mkProg(vs, fsWire);
  progNormals = mkProg(vs, fsNormals);
  if (fsPbr) {
    console.log('PBR fragment GLSL length:', fsPbr.length);
    console.log('PBR fragment first 200 chars:', fsPbr.substring(0, 200));
    progPbr = mkProg(vs, fsPbr);
    if (!gl.getProgramParameter(progPbr, gl.LINK_STATUS)) {
      console.error('PBR program link failed:', gl.getProgramInfoLog(progPbr));
      progPbr = null;
    } else {
      console.log('PBR program linked OK');
    }
    if (progPbr) bindUniformBlocks(progPbr);
    // Bind PBR UBO block
    const numBlocks = progPbr ? gl.getProgramParameter(progPbr, gl.ACTIVE_UNIFORM_BLOCKS) : 0;
    console.log(`PBR UBO blocks: ${numBlocks}`);
    for (let i = 0; i < numBlocks; i++) {
      const name = gl.getActiveUniformBlockName(progPbr, i);
      if (name && name.includes('Pbr')) {
        gl.uniformBlockBinding(progPbr, i, PBR_UBO_BINDING);
      }
    }
    // Bind all sampler uniforms to texture units.
    // naga generates combined sampler names like "_group_0_binding_N_fs"
    // where N is the WGSL @binding index. Map binding → texture unit:
    //   binding 2 → unit 0 (base_color, 2D)
    //   binding 4 → unit 1 (metallic_roughness, 2D)
    //   binding 6 → unit 2 (normal, 2D)
    //   binding 8 → unit 3 (emissive, 2D)
    //   binding 10 → unit 4 (occlusion, 2D)
    //   binding 12 → unit 5 (env_prefiltered, cubemap)
    //   binding 14 → unit 6 (env_irradiance, cubemap)
    //   binding 16 → unit 7 (sheen_e_lut, 2D)
    const bindingToUnit = { 2: 0, 4: 1, 6: 2, 8: 3, 10: 4, 12: 5, 14: 6, 16: 7 };
    gl.useProgram(progPbr);
    const numUniforms = gl.getProgramParameter(progPbr, gl.ACTIVE_UNIFORMS);
    console.log(`PBR active uniforms: ${numUniforms}`);
    let samplersBound = 0;
    for (let i = 0; i < numUniforms; i++) {
      const info = gl.getActiveUniform(progPbr, i);
      if (info && (info.type === gl.SAMPLER_2D || info.type === gl.SAMPLER_CUBE) && !info.name.includes('_vs')) {
        const loc = gl.getUniformLocation(progPbr, info.name);
        const m = info.name.match(/binding_(\d+)/);
        if (m) {
          const binding = parseInt(m[1]);
          const unit = bindingToUnit[binding];
          if (unit !== undefined) {
            gl.uniform1i(loc, unit);
            samplersBound++;
            if (info.type === gl.SAMPLER_CUBE) {
              console.log(`Bound cubemap sampler: ${info.name} → unit ${unit}`);
            }
          }
        }
      }
    }
    console.log(`PBR: ${samplersBound} samplers bound, ${numUniforms} total uniforms`);
  }

  bindUniformBlocks(progMatcap);
  bindUniformBlocks(progWire);
  bindUniformBlocks(progNormals);

  // Bind matcap UBO + sampler
  if (progMatcap) {
    const numBlocks = gl.getProgramParameter(progMatcap, gl.ACTIVE_UNIFORM_BLOCKS);
    for (let i = 0; i < numBlocks; i++) {
      const name = gl.getActiveUniformBlockName(progMatcap, i);
      if (name && name.includes('Matcap')) {
        gl.uniformBlockBinding(progMatcap, i, MATCAP_UBO_BINDING);
      }
    }
    // Bind matcap sampler to texture unit 0
    gl.useProgram(progMatcap);
    const numU = gl.getProgramParameter(progMatcap, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < numU; i++) {
      const info = gl.getActiveUniform(progMatcap, i);
      if (info && info.type === gl.SAMPLER_2D && !info.name.includes('_vs')) {
        const loc = gl.getUniformLocation(progMatcap, info.name);
        gl.uniform1i(loc, 0);
      }
    }
  }

  // Pick shader
  if (fsPick) {
    progPick = mkProg(vs, fsPick);
    if (gl.getProgramParameter(progPick, gl.LINK_STATUS)) {
      bindUniformBlocks(progPick);
    } else {
      console.error('Pick program link failed:', gl.getProgramInfoLog(progPick));
      progPick = null;
    }
  }

  shadersLoaded = true;
  console.log('Shader programs compiled from WGSL pipeline (matcap + wire + normals + pbr + pick)');
}
// --- Pick buffer for face inspection ---
let pickFBO = null, pickTex = null, pickDepth = null, pickW = 0, pickH = 0;
function ensurePickFBO() {
  const w = gl.drawingBufferWidth, h = gl.drawingBufferHeight;
  if (pickFBO && pickW === w && pickH === h) return;
  if (pickFBO) { gl.deleteFramebuffer(pickFBO); gl.deleteTexture(pickTex); gl.deleteRenderbuffer(pickDepth); }
  pickW = w; pickH = h;
  pickFBO = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFBO);
  pickTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, pickTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, pickTex, 0);
  pickDepth = gl.createRenderbuffer();
  gl.bindRenderbuffer(gl.RENDERBUFFER, pickDepth);
  gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, w, h);
  gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, pickDepth);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}

function renderPickPass(mvp, view, camPos) {
  if (!progPick || !drawBatches.length) return;
  ensurePickFBO();
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFBO);
  gl.viewport(0, 0, pickW, pickH);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(progPick);
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.BLEND);
  let offset = 0;
  for (const b of drawBatches) {
    vtxUboF32[35] = offset; // _pad = batch offset for pick
    uploadVertexUBO(mvp, view, b.parity, b.permIndex, gpuSkinned ? 0 : 1, camPos);
    gl.bindVertexArray(b.vaoXformTri);
    gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    offset += b.numInst;
  }
  vtxUboF32[35] = 0; // reset _pad
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
}

// Build a flat lookup: globalFaceIndex → {batchIdx, localIdx, lod, parity, permIndex, material}
function buildFaceLookup() {
  const lookup = [];
  for (let bi = 0; bi < drawBatches.length; bi++) {
    const b = drawBatches[bi];
    for (let li = 0; li < b.numInst; li++) {
      lookup.push({ batchIdx: bi, localIdx: li, lod: b.lod, parity: b.parity, permIndex: b.permIndex, materialIndex: b.materialIndex });
    }
  }
  return lookup;
}

let pickInfoEl = null;
let isolatedFace = null; // {batchIdx, localIdx, vao, numTriIdx, numLineIdx} when isolating a face
let isolateVAO = null, isolateLinVAO = null;

function isolateFace(batchIdx, localIdx) {
  const b = drawBatches[batchIdx];
  const faceData = b.instanceData.slice(localIdx * 40, (localIdx + 1) * 40);

  // Get the tess buffers for this batch (keyed by used LOD — matches tessCache keys)
  const tessKey = (b.usedLod || b.lod).join(',') + '/' + (b.permIndex || 0);
  const tess = tessCache.get(tessKey);
  if (!tess) return;

  // Create a single-instance VAO for triangles
  if (isolateVAO) gl.deleteVertexArray(isolateVAO);
  isolateVAO = gl.createVertexArray();
  gl.bindVertexArray(isolateVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, tess.baryBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ibuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ibuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(faceData), gl.STATIC_DRAW);
  {
    const S = 160;
    const cMap = [[1,0],[2,16],[3,32],[7,48],[8,64],[9,80],[10,96],[11,112],[12,128],[13,144]];
    for (const [loc, off] of cMap) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, S, off);
      gl.vertexAttribDivisor(loc, 1);
    }
    gl.vertexAttrib4f(4, 1, 0, 0, 0);
    gl.vertexAttrib4f(5, 1, 0, 0, 0);
    gl.vertexAttrib4f(6, 1, 0, 0, 0);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tess.triIdxBuf);
  gl.bindVertexArray(null);

  // Create a single-instance VAO for wireframe
  if (isolateLinVAO) gl.deleteVertexArray(isolateLinVAO);
  isolateLinVAO = gl.createVertexArray();
  gl.bindVertexArray(isolateLinVAO);
  gl.bindBuffer(gl.ARRAY_BUFFER, tess.baryBuf);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, ibuf); // reuse same instance buffer
  {
    const S = 160;
    const cMap = [[1,0],[2,16],[3,32],[7,48],[8,64],[9,80],[10,96],[11,112],[12,128],[13,144]];
    for (const [loc, off] of cMap) {
      gl.enableVertexAttribArray(loc);
      gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, S, off);
      gl.vertexAttribDivisor(loc, 1);
    }
    gl.vertexAttrib4f(4, 1, 0, 0, 0);
    gl.vertexAttrib4f(5, 1, 0, 0, 0);
    gl.vertexAttrib4f(6, 1, 0, 0, 0);
  }
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, tess.lineIdxBuf);
  gl.bindVertexArray(null);

  isolatedFace = {
    batchIdx, localIdx,
    numTriIdx: tess.numTriIdx,
    numLineIdx: tess.numLineIdx,
    parity: b.parity,
    permIndex: b.permIndex,
  };
  render();
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && isolatedFace) {
    isolatedFace = null;
    if (pickInfoEl) pickInfoEl.style.display = 'none';
    const overlay = document.getElementById('tess-overlay');
    if (overlay) overlay.style.display = 'none';
    render();
  }
});
function showPickInfo(x, y) {
  if (!pickFBO) return;
  gl.bindFramebuffer(gl.FRAMEBUFFER, pickFBO);
  const px = new Uint8Array(4);
  // WebGL Y is flipped
  gl.readPixels(x, pickH - y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  const id = px[0] + (px[1] << 8);
  const baryX = px[2] / 255.0;
  const baryY = px[3] / 255.0;
  const baryZ = Math.max(0, 1.0 - baryX - baryY);

  if (px[0] === 0 && px[1] === 0 && px[2] === 0 && px[3] === 0) {
    if (pickInfoEl) pickInfoEl.style.display = 'none';
    return;
  }

  const lookup = buildFaceLookup();
  const face = lookup[id];
  if (!face) {
    console.warn('Pick: face ID', id, 'out of range (max', lookup.length, ')');
    if (pickInfoEl) pickInfoEl.style.display = 'none';
    return;
  }

  // Extract per-face instance data (40 floats per face, compact layout)
  const b = drawBatches[face.batchIdx];
  const off = face.localIdx * 40;
  const orig = b.instanceData;

  // Control points (quaternions: w,x,y,z) — positions at offset 0-11
  const p0 = [orig[off+1], orig[off+2], orig[off+3]];
  const p1 = [orig[off+5], orig[off+6], orig[off+7]];
  const p2 = [orig[off+9], orig[off+10], orig[off+11]];

  // Edge LODs at offset 12-14 in compact layout
  const edgeLods = [orig[off+12], orig[off+13], orig[off+14]];

  // World-space edge lengths (pre-Möbius)
  const edgeLen = (a, b) => Math.sqrt((a[0]-b[0])**2 + (a[1]-b[1])**2 + (a[2]-b[2])**2);
  const lenA = edgeLen(p1, p2);  // edge_a: opposite v0
  const lenB = edgeLen(p0, p2);  // edge_b: opposite v1
  const lenC = edgeLen(p0, p1);  // edge_c: opposite v2

  // Approximate screen-space edge lengths using current camera MVP
  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const view = lookAt(ex,ey,ez,0,0,0,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.01,10000);
  const mvp = mulM4(proj, view);
  function projectPt(p) {
    const x = mvp[0]*p[0]+mvp[4]*p[1]+mvp[8]*p[2]+mvp[12];
    const y = mvp[1]*p[0]+mvp[5]*p[1]+mvp[9]*p[2]+mvp[13];
    const w = mvp[3]*p[0]+mvp[7]*p[1]+mvp[11]*p[2]+mvp[15];
    if (Math.abs(w) < 1e-6) return null;
    return [(x/w*0.5+0.5)*canvas.width, (y/w*0.5+0.5)*canvas.height];
  }

  // For Möbius-transformed screen lengths, use same positions (Möbius in shader)
  const xp0 = p0;
  const xp1 = p1;
  const xp2 = p2;
  function screenLen(a, b) {
    const sa = projectPt(a), sb = projectPt(b);
    if (!sa || !sb) return '∞';
    return Math.sqrt((sa[0]-sb[0])**2 + (sa[1]-sb[1])**2).toFixed(1);
  }
  const sLenA = screenLen(xp1, xp2);
  const sLenB = screenLen(xp0, xp2);
  const sLenC = screenLen(xp0, xp1);

  if (!b._logged) { console.log('Batch keys:', Object.keys(b), 'faceIndices:', b.faceIndices, 'length:', b.faceIndices?.length); b._logged = true; }
  const origFaceIdx = b.faceIndices && b.faceIndices[face.localIdx];
  const isFallback = b.wantedLod && [...b.lod].sort((a,b)=>a-b).join(',') !== [...b.wantedLod].sort((a,b)=>a-b).join(',');
  const info = [
    `Instance #${id} → mesh face ${origFaceIdx ?? '?'} (batch ${face.batchIdx}, local ${face.localIdx})`,
    `Batch LOD: [${face.lod.join(', ')}]` + (isFallback ? ` ⚠ FALLBACK (wanted [${b.wantedLod.join(', ')}])` : ''),
    `Edge LODs: [${edgeLods.map(l=>l.toFixed(0)).join(', ')}]`,
    `Perm: idx=${face.permIndex} parity=${face.parity}`,
    `Material: ${face.materialIndex}`,
    ``,
    `--- Edge details ---`,
    `edge_a (v1→v2): LOD=${edgeLods[0].toFixed(0)} world=${lenA.toFixed(4)} screen=${sLenA}px`,
    `edge_b (v0→v2): LOD=${edgeLods[1].toFixed(0)} world=${lenB.toFixed(4)} screen=${sLenB}px`,
    `edge_c (v0→v1): LOD=${edgeLods[2].toFixed(0)} world=${lenC.toFixed(4)} screen=${sLenC}px`,
    ``,
    `--- Control points (pre-Möbius) ---`,
    `p0: (${p0.map(v=>v.toFixed(4)).join(', ')})`,
    `p1: (${p1.map(v=>v.toFixed(4)).join(', ')})`,
    `p2: (${p2.map(v=>v.toFixed(4)).join(', ')})`,
    `--- Control points (post-Möbius) ---`,
    `p0': (${xp0.map(v=>v.toFixed(4)).join(', ')})`,
    `p1': (${xp1.map(v=>v.toFixed(4)).join(', ')})`,
    `p2': (${xp2.map(v=>v.toFixed(4)).join(', ')})`,
    `--- Screen positions (px) ---`,
    `s0: (${(projectPt(xp0)||['?','?']).map(v=>typeof v==='number'?v.toFixed(1):v).join(', ')})`,
    `s1: (${(projectPt(xp1)||['?','?']).map(v=>typeof v==='number'?v.toFixed(1):v).join(', ')})`,
    `s2: (${(projectPt(xp2)||['?','?']).map(v=>typeof v==='number'?v.toFixed(1):v).join(', ')})`,
    ``,
    `Tess bary: (${baryX.toFixed(3)}, ${baryY.toFixed(3)}, ${baryZ.toFixed(3)})`,
  ].join('\n');

  if (!pickInfoEl) {
    pickInfoEl = document.createElement('pre');
    pickInfoEl.style.cssText = 'position:fixed;top:10px;left:10px;background:rgba(0,0,0,0.85);color:#0f0;padding:10px;font:12px monospace;z-index:9999;pointer-events:none;border:1px solid #0f0;border-radius:4px;';
    document.body.appendChild(pickInfoEl);
  }
  pickInfoEl.style.display = 'block';
  pickInfoEl.textContent = info;
  console.log('Pick:', info.replace(/\n/g, ' | '));

  // Isolate this face
  isolateFace(face.batchIdx, face.localIdx);

  // Dump full tessellation for this batch
  const tessKey2 = (b.usedLod || b.lod).join(',') + '/' + (b.permIndex || 0);
  const tess = tessCache.get(tessKey2);
  if (tess) {
    // Draw tessellation overlay on a temporary canvas
    let overlay = document.getElementById('tess-overlay');
    if (!overlay) {
      overlay = document.createElement('canvas');
      overlay.id = 'tess-overlay';
      overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9998;';
      document.body.appendChild(overlay);
    }
    overlay.width = canvas.width;
    overlay.height = canvas.height;
    overlay.style.display = 'block';
    const ctx = overlay.getContext('2d');
    ctx.clearRect(0, 0, overlay.width, overlay.height);

    const sp0 = projectPt(xp0), sp1 = projectPt(xp1), sp2 = projectPt(xp2);
    if (sp0 && sp1 && sp2) {
      // Quaternion math for QB Möbius evaluation (matches vertex shader)
      const qm = (a,b) => [
        a[0]*b[0]-a[1]*b[1]-a[2]*b[2]-a[3]*b[3],
        a[0]*b[1]+a[1]*b[0]+a[2]*b[3]-a[3]*b[2],
        a[0]*b[2]-a[1]*b[3]+a[2]*b[0]+a[3]*b[1],
        a[0]*b[3]+a[1]*b[2]-a[2]*b[1]+a[3]*b[0]];
      const qa = (a,b) => [a[0]+b[0],a[1]+b[1],a[2]+b[2],a[3]+b[3]];
      const qs = (a,s) => [a[0]*s,a[1]*s,a[2]*s,a[3]*s];
      const qi = (q) => { const d=q[0]*q[0]+q[1]*q[1]+q[2]*q[2]+q[3]*q[3]; return [q[0]/d,-q[1]/d,-q[2]/d,-q[3]/d]; };

      // Read original control points + weights as quaternions [w,x,y,z]
      const q0 = [orig[off+0], orig[off+1], orig[off+2], orig[off+3]];
      const q1 = [orig[off+4], orig[off+5], orig[off+6], orig[off+7]];
      const q2 = [orig[off+8], orig[off+9], orig[off+10], orig[off+11]];
      const wt0 = [orig[off+12], orig[off+13], orig[off+14], orig[off+15]];
      const wt1 = [orig[off+16], orig[off+17], orig[off+18], orig[off+19]];
      const wt2 = [orig[off+20], orig[off+21], orig[off+22], orig[off+23]];

      // Möbius-fused QB evaluation (same as vertex shader eval_mobius_qb)
      const ma = mob.a, mb = mob.b, mc = mob.c, md = mob.d;
      const pw0 = qm(qa(qm(ma,q0),mb), wt0);
      const pw1 = qm(qa(qm(ma,q1),mb), wt1);
      const pw2 = qm(qa(qm(ma,q2),mb), wt2);
      const bw0 = qm(qa(qm(mc,q0),md), wt0);
      const bw1 = qm(qa(qm(mc,q1),md), wt1);
      const bw2 = qm(qa(qm(mc,q2),md), wt2);

      const evalQB = (bu, bv, bw) => {
        const top = qa(qa(qs(pw0,bu), qs(pw1,bv)), qs(pw2,bw));
        const bot = qa(qa(qs(bw0,bu), qs(bw1,bv)), qs(bw2,bw));
        const X = qm(top, qi(bot));
        return [X[1], X[2], X[3]];
      };

      const baryToScreen = (bu, bv, bw) => projectPt(evalQB(bu, bv, bw));

      // Draw full tessellation mesh if we have the raw data
      if (tess.rawBary && tess.rawTris) {
        const nv = tess.rawBary.length / 3;
        const screenVerts = [];
        for (let i = 0; i < nv; i++) {
          const bu = tess.rawBary[i*3], bv = tess.rawBary[i*3+1], bw = tess.rawBary[i*3+2];
          screenVerts.push(baryToScreen(bu, bv, bw));
        }
        // Draw tess triangles
        ctx.strokeStyle = 'rgba(0,255,255,0.4)';
        ctx.lineWidth = 0.5;
        for (let i = 0; i < tess.rawTris.length; i += 3) {
          const a = screenVerts[tess.rawTris[i]];
          const b = screenVerts[tess.rawTris[i+1]];
          const c = screenVerts[tess.rawTris[i+2]];
          if (!a || !b || !c) continue;
          ctx.beginPath();
          ctx.moveTo(a[0], a[1]);
          ctx.lineTo(b[0], b[1]);
          ctx.lineTo(c[0], c[1]);
          ctx.closePath();
          ctx.stroke();
        }
        // Highlight corner-spanning triangles (two verts with any bary > 0.98)
        for (let i = 0; i < tess.rawTris.length; i += 3) {
          const idxs = [tess.rawTris[i], tess.rawTris[i+1], tess.rawTris[i+2]];
          let corners = 0;
          for (const vi of idxs) {
            const bu = tess.rawBary[vi*3], bv = tess.rawBary[vi*3+1], bw = tess.rawBary[vi*3+2];
            if (bu > 0.98 || bv > 0.98 || bw > 0.98) corners++;
          }
          if (corners >= 2) {
            const a = screenVerts[idxs[0]], b = screenVerts[idxs[1]], c = screenVerts[idxs[2]];
            if (!a || !b || !c) continue;
            ctx.strokeStyle = '#f00';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(a[0], a[1]);
            ctx.lineTo(b[0], b[1]);
            ctx.lineTo(c[0], c[1]);
            ctx.closePath();
            ctx.stroke();
            ctx.fillStyle = 'rgba(255,0,0,0.15)';
            ctx.fill();
          }
        }
        console.log(`Tess: ${nv} verts, ${tess.rawTris.length/3} tris`);
      }

      // QB-evaluated vertex positions (should match GPU exactly)
      const qv0 = baryToScreen(1,0,0), qv1 = baryToScreen(0,1,0), qv2 = baryToScreen(0,0,1);

      // Draw face outline with LOD colors using QB positions
      const drawEdge = (a, b, lod, label) => {
        if (!a || !b) return;
        ctx.strokeStyle = lod <= 2 ? '#f00' : lod <= 8 ? '#fa0' : '#0f0';
        ctx.lineWidth = lod <= 2 ? 3 : 1;
        ctx.beginPath();
        ctx.moveTo(a[0], a[1]);
        ctx.lineTo(b[0], b[1]);
        ctx.stroke();
        const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
        ctx.fillStyle = ctx.strokeStyle;
        ctx.font = '12px monospace';
        ctx.fillText(`${label} LOD=${lod.toFixed(0)}`, mx+5, my);
      };
      drawEdge(qv1, qv2, edgeLods[0], 'e_a');
      drawEdge(qv0, qv2, edgeLods[1], 'e_b');
      drawEdge(qv0, qv1, edgeLods[2], 'e_c');

      // Label vertices with QB positions
      ctx.fillStyle = '#ff0';
      ctx.font = '13px monospace';
      if (qv0) ctx.fillText(`v0`, qv0[0]+5, qv0[1]-5);
      if (qv1) ctx.fillText(`v1`, qv1[0]+5, qv1[1]-5);
      if (qv2) ctx.fillText(`v2`, qv2[0]+5, qv2[1]-5);

      // Mark clicked point
      const clickScreen = baryToScreen(baryX, baryY, baryZ);
      ctx.beginPath();
      ctx.arc(clickScreen[0], clickScreen[1], 6, 0, Math.PI*2);
      ctx.fillStyle = '#f0f';
      ctx.fill();

      // Log Möbius transform
      console.log('Möbius:', JSON.stringify(mob));
      console.log('Control points (pre):', {p0, p1, p2});
      console.log('Control points (post):', {xp0, xp1, xp2});
      console.log('Screen positions:', {sp0, sp1, sp2});
    }

    // Auto-hide after 10 seconds
    setTimeout(() => { overlay.style.display = 'none'; }, 10000);
  }
}

let matcapTex = null;
const MATCAP_UBO_BINDING = 3;
const matcapUbo = gl.createBuffer();
gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
gl.bufferData(gl.UNIFORM_BUFFER, 16, gl.DYNAMIC_DRAW);
const matcapUboData = new Float32Array(4); // has_matcap_tex + 3 pads

function loadMatcap(name) {
  const img = new Image();
  img.onload = () => {
    if (matcapTex) gl.deleteTexture(matcapTex);
    matcapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    console.log('Matcap loaded:', name, img.width + 'x' + img.height);
    render();
  };
  img.src = '/matcaps/' + name + '.png';
}

// --- LOD color ---
function lodColor(lod) {
  const maxLod = Math.max(...lod);
  const logLod = Math.log2(Math.max(maxLod, 1));
  const t = Math.min(logLod / 8.0, 1.0);
  const h = (1.0 - t) * 270;
  const s = 0.85, l = 0.55;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60)%2 - 1));
  const m = l - c/2;
  let r,g,b;
  if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else{r=c;g=0;b=x;}
  return [r+m, g+m, b+m];
}

// --- GPU LOD Compute (main context, with skinning) ---
// Transform feedback compute pipeline for per-frame LOD computation.
// Skins rest-pose vertices on GPU, applies Möbius, computes LODs.
const LOD_COMPUTE_GLSL = `#version 300 es
precision highp float;
layout(location = 0) in vec3 face_indices;

uniform highp sampler2D u_rest_pos;     // rest-pose positions (4096-wide RGBA32F)
uniform highp sampler2D u_skinning;     // joint indices + weights (tiled)
uniform highp sampler2D u_atlas_lut;    // exponent triple → atlas index
uniform int u_num_verts;
uniform int u_num_joints;
uniform int u_skin_tex_w;
uniform vec4 mob_a, mob_b, mob_c, mob_d;
uniform float density, mesh_radius, min_px;
uniform mat4 vp_matrix;
uniform float vp_width, vp_height;

// Joint matrices — same binding as render shader
layout(std140) uniform JointMatricesBlock {
    int num_joints;
    int skin_tex_width;
    int _pad1, _pad2;
    mat4 matrices[128];
};

out float out_atlas_index;
out float out_perm_index;

vec4 qmul(vec4 a, vec4 b) {
    return vec4(a.x*b.x-a.y*b.y-a.z*b.z-a.w*b.w, a.x*b.y+a.y*b.x+a.z*b.w-a.w*b.z,
                a.x*b.z-a.y*b.w+a.z*b.x+a.w*b.y, a.x*b.w+a.y*b.z-a.z*b.y+a.w*b.x);
}
vec4 qinv(vec4 q) { float n=dot(q,q); return vec4(q.x,-q.yzw)/max(n,1e-20); }
vec3 mobius(vec3 p) {
    vec4 q=vec4(0,p); return qmul(qmul(mob_a,q)+mob_b, qinv(qmul(mob_c,q)+mob_d)).yzw;
}
float snap_pow2(float v) { return exp2(round(log2(max(v,1.0)))); }

vec3 fetch_pos(int vi) {
    int tx = vi % 4096, ty = vi / 4096;
    return texelFetch(u_rest_pos, ivec2(tx, ty), 0).xyz;
}

vec3 skin_pos(vec3 pos, int vi) {
    if (u_num_joints <= 0) return pos;
    int w = u_skin_tex_w;
    int chunk = vi / w, col = vi % w;
    vec4 ji = texelFetch(u_skinning, ivec2(col, chunk*2), 0);
    vec4 jw = texelFetch(u_skinning, ivec2(col, chunk*2+1), 0);
    vec3 skinned = vec3(0);
    vec4 p4 = vec4(pos, 1);
    for (int k=0; k<4; k++) {
        float wt = jw[k]; if (wt < 1e-6) continue;
        int idx = int(ji[k]); if (idx >= u_num_joints) continue;
        skinned += wt * (matrices[idx] * p4).xyz;
    }
    return skinned;
}

void main() {
    int i0=int(face_indices.x), i1=int(face_indices.y), i2=int(face_indices.z);
    vec3 sp0=skin_pos(fetch_pos(i0),i0), sp1=skin_pos(fetch_pos(i1),i1), sp2=skin_pos(fetch_pos(i2),i2);
    vec3 d0=mobius(sp0), d1=mobius(sp1), d2=mobius(sp2);
    vec3 dm_a=mobius((sp1+sp2)*.5), dm_b=mobius((sp0+sp2)*.5), dm_c=mobius((sp0+sp1)*.5);
    float ma=distance(d0,dm_a), mb=distance(d1,dm_b), mc=distance(d2,dm_c);
    float ts = mesh_radius/density;
    float la=clamp(snap_pow2((mb+mc)*.5/ts),2.,512.), lb=clamp(snap_pow2((ma+mc)*.5/ts),2.,512.), lc=clamp(snap_pow2((ma+mb)*.5/ts),2.,512.);
    if (min_px > 0.) {
        vec4 c0=vp_matrix*vec4(d0,1), c1=vp_matrix*vec4(d1,1), c2=vp_matrix*vec4(d2,1);
        vec2 s0=(c0.xy/max(abs(c0.w),.001))*vec2(vp_width,vp_height)*.5;
        vec2 s1=(c1.xy/max(abs(c1.w),.001))*vec2(vp_width,vp_height)*.5;
        vec2 s2=(c2.xy/max(abs(c2.w),.001))*vec2(vp_width,vp_height)*.5;
        float pa=distance(s1,s2), pb=distance(s0,s2), pc=distance(s0,s1);
        if(pa/la<min_px) la=clamp(snap_pow2(pa/min_px),2.,512.);
        if(pb/lb<min_px) lb=clamp(snap_pow2(pb/min_px),2.,512.);
        if(pc/lc<min_px) lc=clamp(snap_pow2(pc/min_px),2.,512.);
    }
    int ea=int(log2(la)), eb=int(log2(lb)), ec=int(log2(lc));
    int sa,sb,sc,perm;
    if(ea<=eb&&eb<=ec){sa=ea;sb=eb;sc=ec;perm=0;}
    else if(ea<=ec&&ec<=eb){sa=ea;sb=ec;sc=eb;perm=1;}
    else if(eb<=ea&&ea<=ec){sa=eb;sb=ea;sc=ec;perm=2;}
    else if(eb<=ec&&ec<=ea){sa=eb;sb=ec;sc=ea;perm=4;}
    else if(ec<=ea&&ea<=eb){sa=ec;sb=ea;sc=eb;perm=3;}
    else{sa=ec;sb=eb;sc=ea;perm=5;}
    int key=sa+sb*10+sc*100; int lx=key%40, ly=key/40;
    out_atlas_index = texelFetch(u_atlas_lut, ivec2(lx,ly), 0).r * 255.0;
    out_perm_index = float(perm);
    gl_Position = vec4(0);
}`;

let gpuLodCompute = null; // initialized in setupGpuSkinning

function initGpuLodCompute(numFaces, faceIndicesF32, restPositions, numVerts) {
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, LOD_COMPUTE_GLSL);
  gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) {
    console.error('LOD compute shader error:', gl.getShaderInfoLog(vs));
    return null;
  }
  // Dummy fragment shader (transform feedback doesn't need it, but WebGL2 requires one)
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, '#version 300 es\nprecision lowp float;\nvoid main(){}\n');
  gl.compileShader(fs);

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs);
  gl.transformFeedbackVaryings(prog, ['out_atlas_index', 'out_perm_index'], gl.INTERLEAVED_ATTRIBS);
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
    console.error('LOD compute link error:', gl.getProgramInfoLog(prog));
    return null;
  }
  gl.deleteShader(vs); gl.deleteShader(fs);

  // Bind joint matrices UBO block
  const jbIdx = gl.getUniformBlockIndex(prog, 'JointMatricesBlock');
  if (jbIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(prog, jbIdx, JOINT_UBO_BINDING);

  // Upload face indices buffer (static)
  const faceVao = gl.createVertexArray();
  const faceBuf = gl.createBuffer();
  gl.bindVertexArray(faceVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, faceBuf);
  gl.bufferData(gl.ARRAY_BUFFER, faceIndicesF32, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  gl.bindVertexArray(null);

  // Upload rest-pose positions as RGBA32F texture (4096-wide)
  const restTex = gl.createTexture();
  const texW = 4096;
  const texH = Math.ceil(numVerts / texW);
  const texBuf = new Float32Array(texW * texH * 4);
  for (let i = 0; i < numVerts; i++) {
    texBuf[i*4] = restPositions[i*3]; texBuf[i*4+1] = restPositions[i*3+1]; texBuf[i*4+2] = restPositions[i*3+2];
  }
  gl.bindTexture(gl.TEXTURE_2D, restTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, texW, texH, 0, gl.RGBA, gl.FLOAT, texBuf);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);

  // Atlas LUT texture — copy from worker's atlas data
  // We'll upload this separately when atlas is ready

  // Transform feedback output buffer
  const outBuf = gl.createBuffer();
  gl.bindBuffer(gl.TRANSFORM_FEEDBACK_BUFFER, outBuf);
  gl.bufferData(gl.TRANSFORM_FEEDBACK_BUFFER, numFaces * 2 * 4, gl.STREAM_READ);

  // Separate readback buffer — avoids "bound to both indexed TF and another target"
  const readBuf = gl.createBuffer();
  gl.bindBuffer(gl.COPY_READ_BUFFER, readBuf);
  gl.bufferData(gl.COPY_READ_BUFFER, numFaces * 2 * 4, gl.STREAM_READ);

  const tf = gl.createTransformFeedback();

  // Get uniform locations
  gl.useProgram(prog);
  const locs = {
    restPos: gl.getUniformLocation(prog, 'u_rest_pos'),
    skinning: gl.getUniformLocation(prog, 'u_skinning'),
    atlasLut: gl.getUniformLocation(prog, 'u_atlas_lut'),
    numVerts: gl.getUniformLocation(prog, 'u_num_verts'),
    numJoints: gl.getUniformLocation(prog, 'u_num_joints'),
    skinTexW: gl.getUniformLocation(prog, 'u_skin_tex_w'),
    mobA: gl.getUniformLocation(prog, 'mob_a'),
    mobB: gl.getUniformLocation(prog, 'mob_b'),
    mobC: gl.getUniformLocation(prog, 'mob_c'),
    mobD: gl.getUniformLocation(prog, 'mob_d'),
    density: gl.getUniformLocation(prog, 'density'),
    meshRadius: gl.getUniformLocation(prog, 'mesh_radius'),
    minPx: gl.getUniformLocation(prog, 'min_px'),
    vpMatrix: gl.getUniformLocation(prog, 'vp_matrix'),
    vpWidth: gl.getUniformLocation(prog, 'vp_width'),
    vpHeight: gl.getUniformLocation(prog, 'vp_height'),
  };
  // Bind samplers to texture units
  if (locs.restPos) gl.uniform1i(locs.restPos, 13);   // unit 13
  if (locs.skinning) gl.uniform1i(locs.skinning, 15);  // unit 15 (same as render)
  if (locs.atlasLut) gl.uniform1i(locs.atlasLut, 14); // unit 14
  gl.useProgram(null);

  console.log(`GPU LOD compute initialized: ${numFaces} faces, ${numVerts} verts`);
  return { prog, faceVao, outBuf, readBuf, tf, restTex, locs, numFaces, numVerts, atlasLutTex: null, numJoints: 0, atlasKeys: null };
}

// Upload atlas LUT to the GPU LOD compute (called once after atlas is built)
function uploadLodAtlasLut(lodCompute, atlasKeys) {
  const LUT_SIZE = 1200;
  const lut = new Uint8Array(LUT_SIZE);
  lut.fill(255);
  const sortedKeys = [...atlasKeys].sort((a,b) => a[0]-b[0] || a[1]-b[1] || a[2]-b[2]);
  for (let i = 0; i < sortedKeys.length && i < 255; i++) {
    const [a,b,c] = sortedKeys[i];
    const ea = Math.round(Math.log2(a)), eb = Math.round(Math.log2(b)), ec = Math.round(Math.log2(c));
    const key = ea + eb*10 + ec*100;
    if (key < LUT_SIZE) lut[key] = i;
  }
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, 40, 30, 0, gl.RED, gl.UNSIGNED_BYTE, lut);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
  lodCompute.atlasLutTex = tex;
  lodCompute.atlasKeys = sortedKeys;
}

// Run GPU LOD compute for current frame. Returns Float32Array of [atlas_idx, perm_idx] per face.
function runGpuLodCompute(lodCompute, mobius, vpMatrix, vpW, vpH, density, meshRadius, minPx, numJoints, skinTexW) {
  const lc = lodCompute;
  gl.useProgram(lc.prog);

  // Bind textures
  gl.activeTexture(gl.TEXTURE13); gl.bindTexture(gl.TEXTURE_2D, lc.restTex);
  gl.activeTexture(gl.TEXTURE15); gl.bindTexture(gl.TEXTURE_2D, skinningTexture);
  if (lc.atlasLutTex) { gl.activeTexture(gl.TEXTURE14); gl.bindTexture(gl.TEXTURE_2D, lc.atlasLutTex); }

  // Bind joint UBO (already at binding 4)
  gl.bindBufferBase(gl.UNIFORM_BUFFER, JOINT_UBO_BINDING, jointUbo);

  // Set uniforms
  gl.uniform1i(lc.locs.numVerts, lc.numVerts);
  gl.uniform1i(lc.locs.numJoints, numJoints);
  gl.uniform1i(lc.locs.skinTexW, skinTexW);
  gl.uniform4fv(lc.locs.mobA, mobius.a);
  gl.uniform4fv(lc.locs.mobB, mobius.b);
  gl.uniform4fv(lc.locs.mobC, mobius.c);
  gl.uniform4fv(lc.locs.mobD, mobius.d);
  gl.uniform1f(lc.locs.density, density);
  gl.uniform1f(lc.locs.meshRadius, meshRadius);
  gl.uniform1f(lc.locs.minPx, minPx);
  gl.uniformMatrix4fv(lc.locs.vpMatrix, false, vpMatrix);
  gl.uniform1f(lc.locs.vpWidth, vpW);
  gl.uniform1f(lc.locs.vpHeight, vpH);

  // Run transform feedback
  gl.bindVertexArray(lc.faceVao);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, lc.tf);
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, lc.outBuf);
  gl.enable(gl.RASTERIZER_DISCARD);
  gl.beginTransformFeedback(gl.POINTS);
  gl.drawArrays(gl.POINTS, 0, lc.numFaces);
  gl.endTransformFeedback();
  gl.disable(gl.RASTERIZER_DISCARD);

  // Unbind TF state
  gl.bindBufferBase(gl.TRANSFORM_FEEDBACK_BUFFER, 0, null);
  gl.bindTransformFeedback(gl.TRANSFORM_FEEDBACK, null);
  gl.bindVertexArray(null);

  // Copy TF output → readback buffer, then read from there.
  const bytes = lc.numFaces * 2 * 4;
  gl.bindBuffer(gl.COPY_READ_BUFFER, lc.outBuf);
  gl.bindBuffer(gl.COPY_WRITE_BUFFER, lc.readBuf);
  gl.copyBufferSubData(gl.COPY_READ_BUFFER, gl.COPY_WRITE_BUFFER, 0, 0, bytes);
  gl.bindBuffer(gl.COPY_READ_BUFFER, null);

  // Insert fence so Chrome doesn't warn about reading without waiting
  const sync = gl.fenceSync(gl.SYNC_GPU_COMMANDS_COMPLETE, 0);
  gl.flush();
  if (sync) { gl.clientWaitSync(sync, gl.SYNC_FLUSH_COMMANDS_BIT, 0); gl.deleteSync(sync); }

  const result = new Float32Array(lc.numFaces * 2);
  gl.getBufferSubData(gl.COPY_WRITE_BUFFER, 0, result);
  gl.bindBuffer(gl.COPY_WRITE_BUFFER, null);
  gl.useProgram(null);

  return result;
}

// --- GPU Skinning ---
// Set up GPU skinning for a skinned glTF model.
// Uploads skinning texture, builds static rest-pose instance data, creates batch.
async function setupGpuSkinning() {
  // 1. Get skinning data from worker (null for static models — that's fine)
  const skinResp = await workerCall('get_skinning_data', {});
  const sd = skinResp.skinData || { num_vertices: 0, num_joints: 0, num_morph_targets: 0 };
  const hasJoints = sd.joint_indices && sd.num_joints > 0;
  const hasMorph = sd.num_morph_targets > 0;

  // Upload skinning texture: RGBA32F, width = num_vertices, height = 2
  // Row 0: joint indices, Row 1: weights
  const nv = sd.num_vertices;
  window._skinTexW = nv;

  // 1. Skinning texture (joint indices + weights) — only for skeletal models
  if (skinningTexture) gl.deleteTexture(skinningTexture);
  if (hasJoints) {
    skinningTexture = gl.createTexture();
    // Tile into rows if num_vertices exceeds max texture width
    const maxW = gl.getParameter(gl.MAX_TEXTURE_SIZE);
    const skinW = Math.min(nv, maxW);
    const skinH = Math.ceil(nv / skinW) * 2; // 2 rows per chunk (indices + weights)
    const texData = new Float32Array(skinW * skinH * 4);
    // Pack: for vertex vi, chunk = floor(vi/skinW), col = vi%skinW
    // Row chunk*2+0 = joint indices, Row chunk*2+1 = joint weights
    for (let vi = 0; vi < nv; vi++) {
      const chunk = Math.floor(vi / skinW), col = vi % skinW;
      const idxRow = chunk * 2, wtRow = chunk * 2 + 1;
      for (let k = 0; k < 4; k++) {
        texData[(idxRow * skinW + col) * 4 + k] = sd.joint_indices[vi * 4 + k];
        texData[(wtRow * skinW + col) * 4 + k] = sd.joint_weights[vi * 4 + k];
      }
    }
    gl.activeTexture(gl.TEXTURE15);
    gl.bindTexture(gl.TEXTURE_2D, skinningTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, skinW, skinH, 0, gl.RGBA, gl.FLOAT, texData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    window._skinTexW = skinW;
    console.log(`Skinning texture uploaded: ${nv} vertices (${skinW}x${skinH}), ${sd.num_joints} joints`);
  } else {
    skinningTexture = null;
  }

  // 2. Morph delta texture — width = nv, height = num_targets
  if (window._morphTex) gl.deleteTexture(window._morphTex);
  if (hasMorph && sd.morph_deltas) {
    const nt = sd.num_morph_targets;
    window._morphTex = gl.createTexture();
    // Pack deltas as RGBA32F: (dx, dy, dz, 0) per texel
    const morphData = new Float32Array(nv * nt * 4);
    for (let t = 0; t < nt; t++) {
      for (let v = 0; v < nv; v++) {
        const srcOff = (t * nv + v) * 3;
        const dstOff = (t * nv + v) * 4;
        morphData[dstOff]   = sd.morph_deltas[srcOff];
        morphData[dstOff+1] = sd.morph_deltas[srcOff+1];
        morphData[dstOff+2] = sd.morph_deltas[srcOff+2];
      }
    }
    gl.activeTexture(gl.TEXTURE14);
    gl.bindTexture(gl.TEXTURE_2D, window._morphTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA32F, nv, nt, 0, gl.RGBA, gl.FLOAT, morphData);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    console.log(`Morph texture uploaded: ${nv} vertices, ${nt} targets`);
  } else {
    window._morphTex = null;
  }

  // 2. Set tess params from current UI state before computing LODs
  const initDensity = parseFloat($('tess-density').value) || 20;
  const initScreenAtten = $('screen-atten-toggle').classList.contains('on');
  const initMinPx = parseFloat($('min-px-sub').value) || 2;
  await workerCall('set_tess_params', { density: initDensity, screenAtten: initScreenAtten, minPx: initMinPx });

  // 3. Get instance data with proper LODs
  const rpResp = await workerCall('get_rest_pose_instances', { lod_time: sd.t_min || 0 });
  const rp = rpResp.data;
  if (!rp || !rp.instances) {
    console.warn('No rest-pose instance data');
    gpuSkinned = false;
    return false;
  }

  // 3. Cache instance data for LOD rebuild
  const nf = rp.num_faces;
  cachedInstances = new Float32Array(rp.instances);
  cachedNumFaces = nf;
  cachedNumVerts = rp.num_vertices;

  const faceLods = rp.face_lods; // 5 floats per face: [canon_a, canon_b, canon_c, perm_idx, parity]

  // Group faces by tessellation key (canonical LOD + permutation)
  const groups = new Map(); // key → { faceIndices: [], parity, permIndex, lod }
  for (let fi = 0; fi < nf; fi++) {
    const lo = fi * 5;
    const ca = faceLods[lo], cb = faceLods[lo+1], cc = faceLods[lo+2];
    const permIdx = faceLods[lo+3];
    const parity = faceLods[lo+4];
    const key = `${ca},${cb},${cc}/${permIdx}`;
    if (!groups.has(key)) {
      groups.set(key, { faces: [], parity, permIndex: permIdx, lod: [ca, cb, cc] });
    }
    groups.get(key).faces.push(fi);
  }

  // Clear old batches
  for (const b of drawBatches) {
    if (b.vaoXform) gl.deleteVertexArray(b.vaoXform);
    if (b.vaoXformTri) gl.deleteVertexArray(b.vaoXformTri);
  }
  drawBatches = [];

  for (const [key, group] of groups) {
    const tess = atlasBuffers.get(key) || tessCache.get(key);
    if (!tess) continue; // skip LODs not in atlas

    // Pack instance data for this group's faces
    const groupData = new Float32Array(group.faces.length * STRIDE);
    for (let gi = 0; gi < group.faces.length; gi++) {
      const fi = group.faces[gi];
      groupData.set(rp.instances.subarray(fi * STRIDE, (fi + 1) * STRIDE), gi * STRIDE);
    }

    const instBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, groupData, gl.STATIC_DRAW);

    const buildSkinVAO = (idxBuf) => {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, tess.baryBuf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
      const S = 160;
      const compactMap = [
        [1,0],[2,16],[3,32],[7,48],[8,64],
        [9,80],[10,96],[11,112],[12,128],[13,144]
      ];
      for (const [loc, off] of compactMap) {
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, S, off);
        gl.vertexAttribDivisor(loc, 1);
      }
      gl.vertexAttrib4f(4, 1, 0, 0, 0);
      gl.vertexAttrib4f(5, 1, 0, 0, 0);
      gl.vertexAttrib4f(6, 1, 0, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
      gl.bindVertexArray(null);
      return vao;
    };

    drawBatches.push({
      vaoXform: buildSkinVAO(tess.lineIdxBuf),
      vaoXformTri: buildSkinVAO(tess.triIdxBuf),
      numLineIdx: tess.numLineIdx,
      numTriIdx: tess.numTriIdx,
      numInst: group.faces.length,
      lod: group.lod, wantedLod: group.lod, usedLod: group.lod,
      color: lodColor(group.lod),
      parity: group.parity, permIndex: group.permIndex, materialIndex: 0,
      instanceData: groupData, xformData: groupData,
      faceIndices: new Uint32Array(group.faces),
    });
  }
  numOrigInst = nf;
  vaoOrigMesh = null;
  // Initialize GPU LOD compute pipeline
  // Extract rest-pose positions + face indices from instance data
  const restPos = new Float32Array(rp.num_vertices * 3);
  const faceIdxF32 = new Float32Array(nf * 3);
  const vertSeen = new Uint8Array(rp.num_vertices);
  for (let fi = 0; fi < nf; fi++) {
    for (let vi = 0; vi < 3; vi++) {
      const off = (fi * STRIDE) + vi * 4;
      const vertIdx = rp.instances[off]; // vertex index in p.x
      faceIdxF32[fi * 3 + vi] = vertIdx;
      const idx = Math.round(vertIdx);
      if (idx < rp.num_vertices && !vertSeen[idx]) {
        vertSeen[idx] = 1;
        restPos[idx*3]   = rp.instances[off+1]; // x
        restPos[idx*3+1] = rp.instances[off+2]; // y
        restPos[idx*3+2] = rp.instances[off+3]; // z
      }
    }
  }
  gpuLodCompute = initGpuLodCompute(nf, faceIdxF32, restPos, rp.num_vertices);
  if (gpuLodCompute) {
    gpuLodCompute.numJoints = sd.num_joints || 0;
    // Build atlas LUT from existing atlas keys
    const keys = [];
    for (const [k] of atlasBuffers) {
      const parts = k.split('/')[0].split(',').map(Number);
      if (parts.length === 3) keys.push(parts);
    }
    uploadLodAtlasLut(gpuLodCompute, keys);
  }

  // Upload model data to worker's GPU compute context for async LOD
  await workerCall('upload_model_to_compute', {});

  console.log(`GPU animation: ${drawBatches.length} LOD batches from ${nf} faces`);

  gpuSkinned = true;
  zoom = 5; // reset to default — positions are in normalized [-1,1] space
  console.log(`GPU skinning ready: ${rp.num_faces} faces, ${sd.num_joints} joints, tessellation [4,4,4], extent=${rp.extent}`);
  return true;
}

// Upload animation pose data (joint matrices + morph weights) for the current frame.
async function uploadAnimationPose(t) {
  const resp = await workerCall('evaluate_animation_frame', { t });
  const pose = resp.pose;
  if (!pose) return;

  // Joint matrices → UBO (clamp to 128 joints max — shader/UBO limit)
  const matrices = pose.matrices;
  if (matrices && matrices.length > 0) {
    const numJoints = Math.min(matrices.length / 16, 128);
    const clampedBytes = numJoints * 16 * 4; // 16 floats * 4 bytes per joint
    const uboData = new ArrayBuffer(16 + clampedBytes);
    const view = new DataView(uboData);
    view.setInt32(0, numJoints, true);
    view.setInt32(4, window._skinTexW || 2048, true);
    new Float32Array(uboData, 16).set(matrices.subarray(0, numJoints * 16));
    gl.bindBuffer(gl.UNIFORM_BUFFER, jointUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(uboData));
  }

  // Morph weights → packed into joint UBO after the matrices
  // UBO layout: 16 bytes header + 128*64 matrices + 16*16 morph weight vec4s
  const morphWeights = pose.morph_weights;
  if (morphWeights && morphWeights.length > 0) {
    const numMorph = Math.min(morphWeights.length, 64);
    // Update num_morph_targets in header (offset 8)
    const headerPatch = new ArrayBuffer(4);
    new DataView(headerPatch).setInt32(0, numMorph, true);
    gl.bindBuffer(gl.UNIFORM_BUFFER, jointUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 8, new Uint8Array(headerPatch));
    // Write morph weights at offset 16 + 128*64 = 8208
    const morphData = new Float32Array(64); // 16 vec4s = 64 floats
    morphData.set(morphWeights.subarray(0, numMorph));
    gl.bufferSubData(gl.UNIFORM_BUFFER, 16 + 128 * 64, new Uint8Array(morphData.buffer));
  }
}

// --- Draw state ---
let drawBatches = [];
let globalMaxLogLod = 1;
let vaoOrigMesh = null, numOrigInst = 0;
const tessCache = new Map();  // fallback for patches not in atlasBuffers
const atlasBuffers = new Map();

// Cached instance data for LOD rebuild (set during setupGpuSkinning)
let cachedInstances = null; // Float32Array, STRIDE floats per face
let cachedNumFaces = 0;
let cachedNumVerts = 0;
const STRIDE = 40;

// Rebuild draw batches from GPU LOD classification results.
// `lodResult`: Float32Array with 2 floats per face [atlas_index, perm_index]
// Rebuild batches from face LOD classification (5 floats per face).
// Same format as setupGpuSkinning uses from get_rest_pose_instances.
function rebuildBatchesFromFaceLods(faceLods) {
  if (!cachedInstances) return;
  const nf = cachedNumFaces;

  const groups = new Map();
  for (let fi = 0; fi < nf; fi++) {
    const lo = fi * 5;
    const ca = faceLods[lo], cb = faceLods[lo+1], cc = faceLods[lo+2];
    const permIdx = faceLods[lo+3];
    const parity = faceLods[lo+4];
    const key = `${ca},${cb},${cc}/${permIdx}`;
    if (!groups.has(key)) {
      groups.set(key, { faces: [], parity, permIndex: permIdx, lod: [ca, cb, cc] });
    }
    groups.get(key).faces.push(fi);
  }

  // Clear old batches
  for (const b of drawBatches) {
    if (b.vaoXform) gl.deleteVertexArray(b.vaoXform);
    if (b.vaoXformTri) gl.deleteVertexArray(b.vaoXformTri);
  }
  drawBatches = [];

  for (const [key, group] of groups) {
    const tess = atlasBuffers.get(key) || tessCache.get(key);
    if (!tess) continue;

    const groupData = new Float32Array(group.faces.length * STRIDE);
    for (let gi = 0; gi < group.faces.length; gi++) {
      const fi = group.faces[gi];
      groupData.set(cachedInstances.subarray(fi * STRIDE, (fi + 1) * STRIDE), gi * STRIDE);
    }

    const instBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
    gl.bufferData(gl.ARRAY_BUFFER, groupData, gl.STATIC_DRAW);

    const buildSkinVAO = (idxBuf) => {
      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);
      gl.bindBuffer(gl.ARRAY_BUFFER, tess.baryBuf);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
      gl.bindBuffer(gl.ARRAY_BUFFER, instBuf);
      const S = 160;
      const compactMap = [
        [1,0],[2,16],[3,32],[7,48],[8,64],
        [9,80],[10,96],[11,112],[12,128],[13,144]
      ];
      for (const [loc, off] of compactMap) {
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 4, gl.FLOAT, false, S, off);
        gl.vertexAttribDivisor(loc, 1);
      }
      gl.vertexAttrib4f(4, 1, 0, 0, 0);
      gl.vertexAttrib4f(5, 1, 0, 0, 0);
      gl.vertexAttrib4f(6, 1, 0, 0, 0);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
      gl.bindVertexArray(null);
      return vao;
    };

    drawBatches.push({
      vaoXform: buildSkinVAO(tess.lineIdxBuf),
      vaoXformTri: buildSkinVAO(tess.triIdxBuf),
      numLineIdx: tess.numLineIdx,
      numTriIdx: tess.numTriIdx,
      numInst: group.faces.length,
      lod: group.lod, wantedLod: group.lod, usedLod: group.lod,
      color: lodColor(group.lod),
      parity: group.parity, permIndex: group.permIndex, materialIndex: 0,
      instanceData: groupData, xformData: groupData,
      faceIndices: new Uint32Array(group.faces),
    });
  }
}

// Run LOD compute asynchronously on the worker (avoids main-thread GL stall).
async function recomputeAndRebuildLods() {
  if (!cachedInstances) return;
  const nf = cachedNumFaces;

  // Resolution override: force uniform LOD
  const resOverride = parseInt($('res').value) || 0;
  if (resOverride > 0) {
    const lod = 1 << resOverride;
    // Uniform LOD override: all faces get [lod, lod, lod] with perm 0, parity 1
    const faceLods = new Float32Array(nf * 5);
    for (let i = 0; i < nf; i++) {
      faceLods[i*5] = lod; faceLods[i*5+1] = lod; faceLods[i*5+2] = lod;
      faceLods[i*5+3] = 0; faceLods[i*5+4] = 1;
    }
    rebuildBatchesFromFaceLods(faceLods);
    return;
  }

  const density = parseFloat($('tess-density').value) || 20;
  const minPx = $('screen-atten-toggle').classList.contains('on') ? parseFloat($('min-px-sub').value) : 0;
  const meshRadius = 1.0;

  // Build VP matrix
  const cx = panX || 0, cy = panY || 0, cz = panZ || 0;
  const ex = zoom * Math.cos(rotX) * Math.sin(rotY) + cx;
  const ey = zoom * Math.sin(rotX) + cy;
  const ez = zoom * Math.cos(rotX) * Math.cos(rotY) + cz;
  const view = lookAt(ex, ey, ez, cx, cy, cz, 0, 1, 0);
  const proj = perspective(Math.PI / 3, canvas.width / canvas.height, 0.01, 10000);
  const vpMatrix = new Float32Array(16);
  for (let i = 0; i < 4; i++)
    for (let j = 0; j < 4; j++) {
      let s = 0;
      for (let k = 0; k < 4; k++) s += proj[k * 4 + i] * view[j * 4 + k];
      vpMatrix[j * 4 + i] = s;
    }

  // GPU LOD recompute on worker via transform feedback (~3ms vs ~250ms CPU)
  const t0 = performance.now();
  const mobArr = [...mob.a, ...mob.b, ...mob.c, ...mob.d];
  const resp = await workerCall('compute_animated_lods', {
    t: frame._animTime != null ? frame._animTime : -1,
    mobius: mobArr,
    density, meshRadius: 1.0, minPx,
    vpMatrix: Array.from(vpMatrix),
    vpWidth: canvas.width, vpHeight: canvas.height,
  });
  const lodResult = resp.lods;
  if (!lodResult) { console.warn('LOD compute returned null'); return; }
  // lodResult: 2 floats per face [atlas_index, perm_index]
  // Map back to face LODs using atlas keys
  const atlasKeys = gpuLodCompute && gpuLodCompute.atlasKeys;
  if (!atlasKeys) return;
  const nf = cachedNumFaces;
  const faceLods = new Float32Array(nf * 5);
  for (let fi = 0; fi < nf; fi++) {
    const atlasIdx = Math.round(lodResult[fi * 2]);
    const permIdx = Math.round(lodResult[fi * 2 + 1]);
    if (atlasIdx >= 0 && atlasIdx < atlasKeys.length && atlasIdx !== 255) {
      const canon = atlasKeys[atlasIdx];
      const parity = (permIdx === 1 || permIdx === 3 || permIdx === 4) ? -1.0 : 1.0;
      faceLods[fi*5] = canon[0]; faceLods[fi*5+1] = canon[1]; faceLods[fi*5+2] = canon[2];
      faceLods[fi*5+3] = permIdx; faceLods[fi*5+4] = parity;
    } else {
      faceLods[fi*5] = 2; faceLods[fi*5+1] = 2; faceLods[fi*5+2] = 2;
      faceLods[fi*5+3] = 0; faceLods[fi*5+4] = 1;
    }
  }
  rebuildBatchesFromFaceLods(faceLods);
  console.log(`LOD recompute: ${(performance.now()-t0).toFixed(1)}ms GPU, ${nf} faces → ${drawBatches.length} batches`);
} // pre-uploaded atlas patches: "a,b,c/perm" → {baryBuf, triIdxBuf, lineIdxBuf, numTriIdx, numLineIdx, rawBary, rawTris}

function uploadAtlasPatches(patches) {
  const t0 = performance.now();
  for (const old of atlasBuffers.values()) {
    gl.deleteBuffer(old.baryBuf);
    gl.deleteBuffer(old.triIdxBuf);
    gl.deleteBuffer(old.lineIdxBuf);
  }
  atlasBuffers.clear();

  for (const p of patches) {
    const key = p.key.join(',') + '/' + p.perm;
    const bary = new Float32Array(p.bary);
    const tris = p.tris;
    const lines = [];
    for (let i = 0; i < tris.length; i += 3) lines.push(tris[i],tris[i+1], tris[i+1],tris[i+2], tris[i+2],tris[i]);

    const baryBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, baryBuf);
    gl.bufferData(gl.ARRAY_BUFFER, bary, gl.STATIC_DRAW);
    const triIdxBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triIdxBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tris), gl.STATIC_DRAW);
    const lineIdxBuf = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIdxBuf);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(lines), gl.STATIC_DRAW);

    atlasBuffers.set(key, {
      baryBuf, triIdxBuf, lineIdxBuf,
      numTriIdx: tris.length, numLineIdx: lines.length,
      rawBary: new Float32Array(bary),
      rawTris: new Uint32Array(tris),
    });
  }
  console.log(`Atlas patches uploaded: ${atlasBuffers.size} buffers in ${(performance.now()-t0).toFixed(0)}ms`);
}

// --- Matrix math ---
function perspective(fov,a,n,f){const t=1/Math.tan(fov*.5),r=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,n*f*r*2,0]);}
function lookAt(ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux,sl=Math.hypot(sx,sy,sz);sx/=sl;sy/=sl;sz/=sl;let ux2=sy*fz-sz*fy,uy2=sz*fx-sx*fz,uz2=sx*fy-sy*fx;return new Float32Array([sx,ux2,-fx,0,sy,uy2,-fy,0,sz,uz2,-fz,0,-(sx*ex+sy*ey+sz*ez),-(ux2*ex+uy2*ey+uz2*ez),fx*ex+fy*ey+fz*ez,1]);}
function mulM4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}

// --- Render ---
function render() {
  const w=$('wrap');
  canvas.width=w.clientWidth; canvas.height=w.clientHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
  if (!shadersLoaded || !drawBatches.length) return;
  gl.clearColor(0.051,0.067,0.090,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const ex=zoom*Math.sin(rotY)*Math.cos(rotX)+panX, ey=zoom*Math.sin(rotX)+panY, ez=zoom*Math.cos(rotY)*Math.cos(rotX)+panZ;
  const camPos = [ex, ey, ez];
  const view = lookAt(ex,ey,ez,panX,panY,panZ,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.01,10000);
  const mvp = mulM4(proj, view);

  // Bind UBOs to their binding points
  bindUBOs();
  // Bind animation textures if GPU animation is active
  if (gpuSkinned) {
    if (skinningTexture) {
      gl.activeTexture(gl.TEXTURE15);
      gl.bindTexture(gl.TEXTURE_2D, skinningTexture);
    }
    if (window._morphTex) {
      gl.activeTexture(gl.TEXTURE14);
      gl.bindTexture(gl.TEXTURE_2D, window._morphTex);
    }
  }

  // Always use QB evaluation — fused Möbius-QB produces smooth conformal surfaces
  const useQB = 1;

  const drawWire = renderMode === 'wire' || renderMode === 'both';
  const drawLod = renderMode === 'lod' || renderMode === 'both';
  const drawMatcap = renderMode === 'matcap';
  const drawNormals = renderMode === 'normals';
  const drawPbr = renderMode === 'pbr';

  // --- Isolated face mode: draw only the picked face ---
  if (isolatedFace && isolateVAO) {
    const iso = isolatedFace;
    // Draw all batches dimmed first
    gl.enable(gl.BLEND);
    gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
    gl.useProgram(progNormals);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
    // Draw isolated face solid (PBR or matcap)
    gl.clear(gl.DEPTH_BUFFER_BIT); // render on top
    const prog = progPbr || progMatcap;
    gl.useProgram(prog);
    uploadVertexUBO(mvp, view, iso.parity, iso.permIndex, useQB, camPos);
    gl.bindVertexArray(isolateVAO);
    gl.drawElementsInstanced(gl.TRIANGLES, iso.numTriIdx, gl.UNSIGNED_INT, 0, 1);
    // Draw wireframe of isolated face
    gl.useProgram(progWire);
    uploadVertexUBO(mvp, view, iso.parity, iso.permIndex, useQB, camPos);
    uploadWireUBO([0, 1, 1], true);
    gl.bindVertexArray(isolateLinVAO);
    gl.drawElementsInstanced(gl.LINES, iso.numLineIdx, gl.UNSIGNED_INT, 0, 1);
    return; // skip normal rendering
  }

  // PBR pass — per-material draw calls
  if (drawPbr && progPbr) {
    gl.useProgram(progPbr);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, PBR_UBO_BINDING, pbrUbo);
    if (!window._pbrPlaceholder) window._pbrPlaceholder = createPlaceholderTexture();
    const placeholder = window._pbrPlaceholder;
    let lastMaterialIndex = -999;
    let lastParity = -999, lastPermIndex = -999;
    for (const b of drawBatches) {
      if (b.materialIndex !== lastMaterialIndex) {
        lastMaterialIndex = b.materialIndex;
        const mat = getMaterialParams(b.materialIndex);

        // Resolve texture objects for each PBR map
        const resolve = (idx) => (idx != null && idx >= 0 && loadedTextures[idx]) ? loadedTextures[idx].glTexture : null;
        const bcTex = resolve(mat.baseColorTextureIndex);
        const mrTex = resolve(mat.metallicRoughnessTextureIndex);
        const nmTex = resolve(mat.normalTextureIndex);
        const emTex = resolve(mat.emissiveTextureIndex);
        const aoTex = resolve(mat.occlusionTextureIndex);

        // Upload expanded UBO
        uploadPbrUBO({
          baseColor: mat.baseColor, metallic: mat.metallic, roughness: mat.roughness,
          hasBaseColorTex: !!bcTex, hasMetallicRoughnessTex: !!mrTex,
          emissiveFactor: mat.emissiveFactor, normalScale: mat.normalScale,
          hasNormalTex: !!nmTex, hasEmissiveTex: !!emTex, hasOcclusionTex: !!aoTex,
          occlusionStrength: mat.occlusionStrength, alphaCutoff: mat.alphaCutoff,
          alphaMode: mat.alphaMode, unlit: mat.unlit,
          sheenColor: mat.sheenColor, sheenRoughness: mat.sheenRoughness,
          specularColor: mat.specularColor,
          normalUvScale: mat.normalUvScale, normalUvOffset: mat.normalUvOffset,
          normalUvRotation: mat.normalUvRotation,
          baseUvScale: mat.baseUvScale, baseUvOffset: mat.baseUvOffset,
          baseUvRotation: mat.baseUvRotation,
        });

        // Face culling disabled globally — Möbius transforms can flip face
        // winding, and the shader already handles two-sided normals.
        // TODO: enable culling for single-sided materials when no conformal
        // transform is active (would need to know current transform type).
        gl.disable(gl.CULL_FACE);

        // Bind material textures to units 0-4 (placeholder for missing maps)
        const texBindings = [bcTex, mrTex, nmTex, emTex, aoTex];
        for (let ti = 0; ti < 5; ti++) {
          gl.activeTexture(gl.TEXTURE0 + ti);
          gl.bindTexture(gl.TEXTURE_2D, texBindings[ti] || placeholder);
        }
        // Bind environment cubemaps to units 5-6, sheen LUT to unit 7
        if (envCubemap) {
          gl.activeTexture(gl.TEXTURE5);
          gl.bindTexture(gl.TEXTURE_CUBE_MAP, envCubemap);
          gl.activeTexture(gl.TEXTURE6);
          gl.bindTexture(gl.TEXTURE_CUBE_MAP, envIrradiance);
        }
        if (sheenELut) {
          gl.activeTexture(gl.TEXTURE7);
          gl.bindTexture(gl.TEXTURE_2D, sheenELut);
        }
      }
      if (b.parity !== lastParity || b.permIndex !== lastPermIndex) {
        lastParity = b.parity; lastPermIndex = b.permIndex;
        uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      }
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Original mesh wireframe (identity Möbius — shows untransformed mesh)
  if (drawWire && vaoOrigMesh) {
    const savedMob = mob;
    mob = { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };
    gl.useProgram(progWire);
    uploadVertexUBO(mvp, view, 1.0, 0, 0, camPos);
    uploadWireUBO([0.25, 0.25, 0.35], false);
    gl.bindVertexArray(vaoOrigMesh);
    gl.drawElementsInstanced(gl.LINES, 6, gl.UNSIGNED_INT, 0, numOrigInst);
    mob = savedMob;
  }

  // Matcap pass
  if (drawMatcap) {
    gl.useProgram(progMatcap);
    // Matcap UBO: has_matcap_tex flag
    matcapUboData[0] = matcapTex ? 1.0 : 0.0;
    gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, matcapUboData);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, MATCAP_UBO_BINDING, matcapUbo);
    // Bind matcap texture
    if (matcapTex) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    }
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // LOD pass (density heatmap — force matcap texture off)
  if (drawLod) {
    gl.useProgram(progLod);
    matcapUboData[0] = 0.0; // has_matcap_tex = false → use heatmap
    gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, matcapUboData);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, MATCAP_UBO_BINDING, matcapUbo);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Wire pass
  if (drawWire) {
    gl.useProgram(progWire);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      uploadWireUBO(b.color, true);
      gl.bindVertexArray(b.vaoXform);
      gl.drawElementsInstanced(gl.LINES, b.numLineIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Normals pass
  if (drawNormals) {
    gl.useProgram(progNormals);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, b.permIndex, useQB, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  gl.bindVertexArray(null);
}

// --- Transform params ---
function getTransformParams() {
  const mx = parseInt($('mx').value)/10;
  const my = parseInt($('my').value)/10;
  const mz = parseInt($('mz').value)/10;
  const mr = parseInt($('mr').value)/10;
  $('mx-v').textContent = mx.toFixed(1);
  $('my-v').textContent = my.toFixed(1);
  $('mz-v').textContent = mz.toFixed(1);
  $('mr-v').textContent = mr.toFixed(1);
  return { mx, my, mz, mr };
}

// Möbius update: recompute uniforms + render immediately, then debounce
// a worker call to recompute LODs for the new Möbius transform.
let mobiusDebounce = null;
function updateMobius() {
  const { mx, my, mz, mr } = getTransformParams();
  const tType = currentXform === 'sphere_reflection' ? 'sphere_reflection' : 'identity';
  mob = computeMobius(tType, mx, my, mz, mr);
  render();
  clearTimeout(mobiusDebounce);
  mobiusDebounce = setTimeout(updateWithLod, 150);
}

let lodDebounce = null;
function update() {
  if (!workerReady || !meshInfo) return;
  const { mx, my, mz, mr } = getTransformParams();
  const tType = currentXform === 'sphere_reflection' ? 'sphere_reflection' : 'identity';
  mob = computeMobius(tType, mx, my, mz, mr);
  render();
}
// Separate function for updates that should trigger LOD recompute
// (density, resolution, Möbius, screen attenuation changes)
function updateWithLod() {
  update();
  clearTimeout(lodDebounce);
  lodDebounce = setTimeout(() => {
    recomputeAndRebuildLods();
    render();
  }, 200);
}

// --- Mouse orbit + pan ---
let drag=false, lx=0, ly=0, panX=0, panY=0, panZ=0;
canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
onmouseup = () => drag=false;
let camDebounce = null;
onmousemove = e => {
  if(!drag)return;
  const dx=e.clientX-lx, dy=e.clientY-ly;
  lx=e.clientX; ly=e.clientY;
  if (e.shiftKey) {
    // Pan in screen plane: compute right and up vectors from camera orientation
    const right = [Math.cos(rotY), 0, -Math.sin(rotY)];
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    const up = [-Math.sin(rotY)*sinX, cosX, -Math.cos(rotY)*sinX];
    const s = 0.003 * zoom;
    panX -= (dx * right[0] + dy * up[0]) * s;
    panY -= (dx * right[1] + dy * up[1]) * s;
    // panZ would need a 3rd component — fold into panX/panY for now
    // Actually use full 3D pan target
    if (typeof panZ === 'undefined') window.panZ = 0;
    panZ -= (dx * right[2] + dy * up[2]) * s;
  } else {
    rotY+=dx*0.01; rotX+=dy*0.01;
  }
  render();
  clearTimeout(camDebounce); camDebounce=setTimeout(update, 150);
};
canvas.onwheel = e => { zoom *= e.deltaY>0 ? 1.1 : 0.9; zoom=Math.max(1,Math.min(100,zoom)); render(); clearTimeout(camDebounce); camDebounce=setTimeout(update, 150); e.preventDefault(); };
// Pick: ctrl+click to inspect face under cursor
canvas.onclick = e => {
  if (!e.ctrlKey && !e.metaKey) {
    // Regular click exits isolation mode
    if (isolatedFace) { isolatedFace = null; if (pickInfoEl) pickInfoEl.style.display = 'none'; const ov = document.getElementById('tess-overlay'); if (ov) ov.style.display = 'none'; render(); }
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width) | 0;
  const y = (e.clientY - rect.top) * (canvas.height / rect.height) | 0;
  // Render pick pass with current camera (must match render's camera including pan)
  const ex=zoom*Math.sin(rotY)*Math.cos(rotX)+panX, ey=zoom*Math.sin(rotX)+panY, ez=zoom*Math.cos(rotY)*Math.cos(rotX)+panZ;
  const camPos = [ex, ey, ez];
  const view = lookAt(ex,ey,ez,panX,panY,panZ,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.01,10000);
  const mvp = mulM4(proj, view);
  renderPickPass(mvp, view, camPos);
  showPickInfo(x, y);
};

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => { if (e.touches.length===1) lastTouch=[e.touches[0].clientX,e.touches[0].clientY]; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===1 && lastTouch) {
    const dx=e.touches[0].clientX-lastTouch[0], dy=e.touches[0].clientY-lastTouch[1];
    lastTouch=[e.touches[0].clientX,e.touches[0].clientY];
    rotY+=dx*0.005; rotX+=dy*0.005;
    rotX=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,rotX));
    render();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouch=null; });
onresize = render;

// --- UI wiring ---
function setupBtnGroup(id, cb) {

    b.onclick = () => { document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('a')); b.classList.add('a'); cb(b.dataset.v); };
}

$('matcap-sel').addEventListener('change', () => loadMatcap($('matcap-sel').value));
$('envmap-sel').addEventListener('change', () => {
  const v = $('envmap-sel').value;
  if (v === 'procedural') {
    if (envCubemap) gl.deleteTexture(envCubemap);
    if (envIrradiance) gl.deleteTexture(envIrradiance);
    envCubemap = createProceduralEnvMap(256);
    envIrradiance = createProceduralEnvMap(32);
    render();
  } else {
    loadEnvMap(`/envmaps/${v}.hdr`);
  }
});
$('variant-sel').addEventListener('change', () => {
  const vi = parseInt($('variant-sel').value);
  if (!window._baseFaceMaterials || !window._variantMappings) return;
  // Build new face material array: start from base, apply variant swaps
  const faceMats = [...window._baseFaceMaterials];
  if (vi >= 0) {
    // Collect which default materials get swapped to what
    const swapMap = new Map();
    for (const m of window._variantMappings) {
      if (m.variants && m.variants.includes(vi)) {
        // This mapping says: for variant vi, use material m.material
        // We need to know which faces to apply this to.
        // The mapping applies to faces whose default material is any of the
        // materials listed in OTHER variant mappings for the same primitive.
        // Simplification: build a set of all materials involved in variant mappings
        swapMap.set(m.material, true);
      }
    }
    // For variant vi, find the target material
    let targetMat = -1;
    for (const m of window._variantMappings) {
      if (m.variants && m.variants.includes(vi)) {
        targetMat = m.material;
        break;
      }
    }
    if (targetMat >= 0) {
      // Collect all materials that are variant alternatives (including the default)
      const allVariantMats = new Set();
      for (const m of window._variantMappings) {
        allVariantMats.add(m.material);
      }
      // Also add the default material for the variant primitive
      // (the one assigned when no variant is selected)
      const defaultMat = window._baseFaceMaterials.find(m => allVariantMats.has(m));
      if (defaultMat !== undefined) allVariantMats.add(defaultMat);
      // Swap all faces using any variant material to the target
      for (let fi = 0; fi < faceMats.length; fi++) {
        if (allVariantMats.has(faceMats[fi])) {
          faceMats[fi] = targetMat;
        }
      }
    }
  }
  // Send updated face materials to worker
  broadcastCall('set_face_materials', { materials: faceMats }).then(() => update());
});

$('anim-sel').addEventListener('change', async () => {

});

    updateMobius();
  });
$('res').addEventListener('input', () => {
  const v = parseInt($('res').value);
  $('res-v').textContent = v === 0 ? 'auto' : (1 << v);
  updateWithLod();
});
$('tess-density').addEventListener('input', () => {
