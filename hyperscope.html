<script type="module">
import init, {
  mr_init, mr_resize, mr_render, mr_setRenderMode, mr_setMobius,
  mr_setInstanceData, mr_setFaceMaterials, mr_buildBatches, mr_setFuzzy, mr_setFuzzyDebug,
  mr_uploadTessPatch, mr_uploadAnimationPose,
  mr_uploadSkinningTexture, mr_uploadMorphTexture,
  mr_setMaterials, mr_uploadImages, mr_uploadEnvMaps,
} from './pkg/quilting_wasm.js';

const $ = id => document.getElementById(id);

// ============================================================
// Signal system with async support.
// signal(value) → sync reactive state
// effect(fn) → runs fn when dependencies change (sync)
// asyncEffect(fn) → like effect but fn can be async; re-runs on dep change
// gate(sig) → returns a promise that resolves when sig becomes truthy
// phase(name, deps, fn) → async lifecycle phase: waits for deps, runs fn, resolves
// ============================================================
let _activeEffect = null;
function signal(value, name) {
  const subs = new Set();
  const s = {
    name,
    get() { if (_activeEffect) subs.add(_activeEffect); return value; },
    set(v) { if (v !== value) { value = v; for (const fn of subs) fn(); } },
    peek() { return value; },
  };
  return s;
}
function computed(fn) {
  const c = signal(undefined);
  effect(() => { c.set(fn()); });
  return { get: () => c.get(), peek: () => c.peek() };
}
function effect(fn) {
  const run = () => { const prev = _activeEffect; _activeEffect = run; try { fn(); } finally { _activeEffect = prev; } };
  run();
}
// Async effect: re-runs when deps change, cancels previous run
function asyncEffect(fn) {
  let cancel = false;
  effect(() => {
    cancel = true; // cancel previous
    cancel = false;
    const token = { cancelled: false };
    const prev = cancel;
    fn(token).catch(e => { if (!token.cancelled) console.warn('asyncEffect error:', e); });
  });
}
// Gate: resolves when signal becomes truthy
function gate(sig) {
  if (sig.peek()) return Promise.resolve(sig.peek());
  return new Promise(resolve => {
    const unsub = effect(() => {
      const v = sig.get();
      if (v) { resolve(v); }
    });
  });
}
// Lifecycle phase: async step that depends on other phases
const phases = {};
function phase(name, depNames, fn) {
  const done = signal(false, `phase:${name}`);
  const result = signal(null, `phase:${name}:result`);
  phases[name] = { done, result };
  (async () => {
    // Wait for all dependency phases
    for (const dep of depNames) {
      if (!phases[dep]) { console.warn(`phase ${name}: unknown dep ${dep}`); continue; }
      await gate(phases[dep].done);
    }
    try {
      const r = await fn();
      result.set(r);
    } catch (e) {
      console.error(`phase ${name} failed:`, e);
    }
    done.set(true);
  })();
  return { done, result };
}
// Check if a phase completed
function phaseReady(name) { return phases[name]?.done?.peek() ?? false; }
// Dedicated readiness signal — defined early so effects can subscribe via .get()
const wasmOk = signal(false, 'wasmOk');
// Bind a signal to a DOM slider (bidirectional)
function bindSlider(id, sig, displayFn) {
  const el = $(id);
  const label = $(id + '-v');
  el.value = sig.peek();
  if (label && displayFn) label.textContent = displayFn(sig.peek());
  el.addEventListener('input', () => {
    sig.set(parseFloat(el.value));
    if (label && displayFn) label.textContent = displayFn(sig.peek());
  });
  // Keep slider in sync if signal is set programmatically
  effect(() => {
    const v = sig.get();
    if (parseFloat(el.value) !== v) el.value = v;
    if (label && displayFn) label.textContent = displayFn(v);
  });
}
// Bind a signal to a toggle (click toggles boolean)
function bindToggle(id, sig) {
  const el = $(id);
  el.classList.toggle('on', sig.peek());
  el.addEventListener('click', () => sig.set(!sig.peek()));
  effect(() => el.classList.toggle('on', sig.get()));
}
// Bind a button group to a signal
function bindBtnGroup(id, sig) {
  const btns = document.querySelectorAll(`#${id} button`);
  btns.forEach(b => {
    b.classList.toggle('a', b.dataset.v === String(sig.peek()));
    b.addEventListener('click', () => sig.set(b.dataset.v));
  });
  effect(() => {
    const v = String(sig.get());
    btns.forEach(b => b.classList.toggle('a', b.dataset.v === v));
  });
}

// ============================================================
// URL Router — bidirectional sync between controls and URL params.
// Reads on load, writes on change (debounced replaceState).
// ============================================================
const PARAM_DEFAULTS = {
  glb: 'horse.glb', mode: 'pbr', xform: 'identity',
  mx: '5', my: '0', mz: '0', mr: '20',
  env: 'rosendal_plains_1_1k', matcap: 'citric-acid',
  res: '0', density: '100', atten: '1', minpx: '2',
  animate: '1', anim: '-1', atlas: '9',
  zoom: '3', rx: '0.3', ry: '0.5',
  fuzzy: '0', fmode: '1', fradius: '32', fstr: '30', ffocus: '62', fbw: '12', fnorm: '0', fqual: '2',
};

function readParams() {
  const p = new URLSearchParams(location.search);
  const get = (k) => p.get(k) ?? PARAM_DEFAULTS[k];
  return {
    glb: get('glb'),
    mode: get('mode'),
    xform: get('xform'),
    mx: get('mx'), my: get('my'), mz: get('mz'), mr: get('mr'),
    env: get('env'),
    matcap: get('matcap'),
    res: get('res'),
    density: get('density'),
    atten: get('atten'),
    minpx: get('minpx'),
    animate: get('animate'),
    anim: get('anim'),
    atlas: get('atlas'),
    zoom: get('zoom'),
    rx: get('rx'),
    ry: get('ry'),
    fuzzy: get('fuzzy'), fmode: get('fmode'), fradius: get('fradius'),
    fstr: get('fstr'), ffocus: get('ffocus'), fbw: get('fbw'), fnorm: get('fnorm'),
  };
}

let syncTimer = null;
function syncURL() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    const p = new URLSearchParams();
    const set = (k, v, def) => { if (v !== def) p.set(k, v); };
    set('glb', currentGlb, PARAM_DEFAULTS.glb);
    // Signal-driven params — wrapped in try/catch to handle TDZ during early syncURL calls
    try {
      const ss = (k, sig, def) => set(k, String(sig.peek()), def);
      ss('mode', renderMode, PARAM_DEFAULTS.mode);
      ss('xform', mob.xform, PARAM_DEFAULTS.xform);
      ss('mx', mob.mx, PARAM_DEFAULTS.mx);
      ss('my', mob.my, PARAM_DEFAULTS.my);
      ss('mz', mob.mz, PARAM_DEFAULTS.mz);
      ss('mr', mob.mr, PARAM_DEFAULTS.mr);
      ss('env', envMap, PARAM_DEFAULTS.env);
      ss('matcap', matcap, PARAM_DEFAULTS.matcap);
      ss('res', lod.res, PARAM_DEFAULTS.res);
      ss('density', lod.density, PARAM_DEFAULTS.density);
      set('atten', lod.screenAtten.peek() ? '1' : '0', PARAM_DEFAULTS.atten);
      ss('minpx', lod.minPx, PARAM_DEFAULTS.minpx);
      ss('atlas', lod.atlas, PARAM_DEFAULTS.atlas);
      set('animate', animating_sig.peek() ? '1' : '0', PARAM_DEFAULTS.animate);
      set('anim', $('anim-sel').value, PARAM_DEFAULTS.anim);
      set('fuzzy', fz.enabled.peek() ? '1' : '0', PARAM_DEFAULTS.fuzzy);
      ss('fmode', fz.mode, PARAM_DEFAULTS.fmode);
      ss('fradius', fz.radius, PARAM_DEFAULTS.fradius);
      ss('fstr', fz.strength, PARAM_DEFAULTS.fstr);
      ss('ffocus', fz.focus, PARAM_DEFAULTS.ffocus);
      ss('fbw', fz.bandwidth, PARAM_DEFAULTS.fbw);
      set('fnorm', fz.normalize.peek() ? '1' : '0', PARAM_DEFAULTS.fnorm);
      ss('fqual', fz.quality, PARAM_DEFAULTS.fqual);
      ss('fkaw', fz.kawase, '0');
      ss('fkoff', fz.kawaseOff, '8');
    } catch { /* signals not yet initialized */ }
    // Camera
    set('zoom', zoom.toFixed(2), parseFloat(PARAM_DEFAULTS.zoom).toFixed(2));
    set('rx', rotX.toFixed(3), parseFloat(PARAM_DEFAULTS.rx).toFixed(3));
    set('ry', rotY.toFixed(3), parseFloat(PARAM_DEFAULTS.ry).toFixed(3));

    const qs = p.toString();
    const url = qs ? `${location.pathname}?${qs}` : location.pathname;
    history.replaceState(null, '', url);
  }, 300);
}

// Apply URL params to controls on load
// applyParams is defined as a late-binding function — actual implementation
// set after all signals are declared (avoids TDZ issues with const)
let applyParams = () => {};

let currentGlb = PARAM_DEFAULTS.glb;

// --- Sidebar toggle ---
$('sidebar-toggle').onclick = () => {
  $('sidebar').classList.toggle('collapsed');
  $('sidebar-toggle').textContent = $('sidebar').classList.contains('collapsed') ? '◀' : '▶';
};

// --- Camera ---
let rotX = 0.3, rotY = 0.5, zoom = 3.0;
let panX = 0, panY = 0, panZ = 0;
let drag = false, lx = 0, ly = 0;

function perspective(fov,a,n,f){const t=1/Math.tan(fov*.5),r=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,n*f*r*2,0]);}
function lookAt(ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux,sl=Math.hypot(sx,sy,sz);sx/=sl;sy/=sl;sz/=sl;let ux2=sy*fz-sz*fy,uy2=sz*fx-sx*fz,uz2=sx*fy-sy*fx;return new Float32Array([sx,ux2,-fx,0,sy,uy2,-fy,0,sz,uz2,-fz,0,-(sx*ex+sy*ey+sz*ez),-(ux2*ex+uy2*ey+uz2*ez),fx*ex+fy*ey+fz*ez,1]);}
function mulM4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}

// --- Worker pool ---
const ATLAS_WORKERS = navigator.hardwareConcurrency || 8;
const RUNTIME_WORKERS = 1;
const workers = [];
const pending = new Map();
let msgId = 0;

function spawnWorker() {
  const w = new Worker('./hyperscope-prototype_worker.js', { type: 'module' });
  w.onmessage = e => {
    const resolve = pending.get(e.data.id);
    if (resolve) { pending.delete(e.data.id); resolve(e.data); }
  };
  workers.push({ worker: w, busy: false });
}
for (let i = 0; i < ATLAS_WORKERS; i++) spawnWorker();

function workerCallN(i, type, data, transfer) {
  const id = ++msgId;
  return new Promise(resolve => {
    pending.set(id, resolve);
    workers[i].worker.postMessage({ type, data, id }, transfer || []);
  });
}
const workerCall = (type, data, transfer) => workerCallN(0, type, data, transfer);
async function broadcastCall(type, data) {
  return (await Promise.all(workers.map((_, i) => workerCallN(i, type, data))))[0];
}
function dropExtraWorkers() {
  while (workers.length > RUNTIME_WORKERS) {
    const w = workers.pop();
    w.worker.terminate();
  }
}

// --- Model state ---
let gpuSkinned = false;
let animating = true;
let meshInfo = null;

// --- Mouse: orbit + shift-pan + wheel zoom ---
const canvas = $('cv');
canvas.addEventListener('mousedown', e => { drag = true; lx = e.clientX; ly = e.clientY; });
window.addEventListener('mouseup', () => drag = false);
let camDebounce = null;
window.addEventListener('mousemove', e => {
  if (!drag) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY;
  if (e.shiftKey) {
    // Pan in screen plane
    const right = [Math.cos(rotY), 0, -Math.sin(rotY)];
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    const up = [-Math.sin(rotY)*sinX, cosX, -Math.cos(rotY)*sinX];
    const s = 0.003 * zoom;
    panX -= (dx * right[0] + dy * up[0]) * s;
    panY -= (dx * right[1] + dy * up[1]) * s;
    panZ -= (dx * right[2] + dy * up[2]) * s;
  } else {
    rotY += dx * 0.005;
    rotX += dy * 0.005;

const mob = {

};

function computeMobius(type, cx, cy, cz, r) {
  if (type === 'sphere_reflection' && r > 0.01) {
    const csq = cx*cx + cy*cy + cz*cz;
    return { a: [0,cx,cy,cz], b: [csq-r*r,0,0,0], c: [1,0,0,0], d: [0,-cx,-cy,-cz] };
  }
  return { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };
}

let currentMobius = null;
let stretchRange = { min: 0.5, max: 0.5 };
let stretchSamplePending = false;

function sampleStretchAsync() {
  if (stretchSamplePending || !currentMobius || !meshInfo) return;
  const instances = meshInfo.instances;
  const numFaces = meshInfo.num_faces;
  if (!instances || !numFaces) return;
  stretchSamplePending = true;
  workerCall('sample_stretch_range', {
    mobius: Array.from(currentMobius),
    instances: Array.from(instances),
    numFaces,
  }).then(resp => {
    stretchSamplePending = false;
    if (resp.min != null && resp.max != null) stretchRange = { min: resp.min, max: resp.max };
  }).catch(() => { stretchSamplePending = false; });
}

// Möbius effect: any param change → recompute + push to WASM

  const type = mob.xform.get();
  const m = computeMobius(type, mob.mx.get()/10, mob.my.get()/10, mob.mz.get()/10, mob.mr.get()/10);
  const flat = new Float32Array([...m.a, ...m.b, ...m.c, ...m.d]);
  currentMobius = flat;
  if (!wasmOk.get()) return;
  mr_setMobius(flat);
  debouncedLodRecompute();
  sampleStretchAsync();
  syncURL();
});

// --- IndexedDB for persisting dropped GLB files ---
const IDB_NAME = 'hyperscope', IDB_STORE = 'glb';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(IDB_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(name, buf) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readwrite');
    tx.objectStore(IDB_STORE).put(buf, name);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGet(name) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, 'readonly');
    const req = tx.objectStore(IDB_STORE).get(name);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// --- Environment maps (IBL) ---
// Generate procedural sky/ground gradient cubemap faces as Float32 RGBA.
function generateProceduralEnvFaces(size) {
  const allFaces = new Float32Array(6 * size * size * 4);
  for (let fi = 0; fi < 6; fi++) {
    const offset = fi * size * size * 4;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = (x + 0.5) / size * 2.0 - 1.0;
        const v = (y + 0.5) / size * 2.0 - 1.0;
        let dx, dy, dz;
        switch (fi) {
          case 0: dx= 1; dy=-v; dz=-u; break;
          case 1: dx=-1; dy=-v; dz= u; break;
          case 2: dx= u; dy= 1; dz= v; break;
          case 3: dx= u; dy=-1; dz=-v; break;
          case 4: dx= u; dy=-v; dz= 1; break;
          case 5: dx=-u; dy=-v; dz=-1; break;
        }
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
        const ndx = dx/len, ndy = dy/len, ndz = dz/len;
        const skyT = Math.max(ndy, 0), groundT = Math.max(-ndy, 0);
        const horizonT = 1.0 - Math.abs(ndy);
        let r = 0.08 + skyT * 0.25 + horizonT * 0.35;
        let g = 0.10 + skyT * 0.35 + horizonT * 0.30;
        let b = 0.18 + skyT * 0.55 + horizonT * 0.25;
        r += groundT * 0.12; g += groundT * 0.10; b += groundT * 0.06;
        const sunDot = Math.max(ndx * 0.5 + ndy * 0.7 + ndz * 0.3, 0);
        const sunGlow = Math.pow(sunDot, 32) * 0.7 + Math.pow(sunDot, 4) * 0.2;
        r += sunGlow * 0.9; g += sunGlow * 0.8; b += sunGlow * 0.6;
        const idx = offset + (y * size + x) * 4;
        allFaces[idx] = r; allFaces[idx+1] = g; allFaces[idx+2] = b; allFaces[idx+3] = 1.0;
      }
    }
  }
  return allFaces;
}

// HDR (Radiance RGBE) loader — ported from prototype
function parseHDR(buffer) {
  const bytes = new Uint8Array(buffer);
  let pos = 0;
  while (pos < bytes.length) {
    let lineEnd = pos;
    while (lineEnd < bytes.length && bytes[lineEnd] !== 10) lineEnd++;
    const line = String.fromCharCode(...bytes.slice(pos, lineEnd));
    pos = lineEnd + 1;
    if (line.trim() === '') break;
  }
  let resEnd = pos;
  while (resEnd < bytes.length && bytes[resEnd] !== 10) resEnd++;
  const resLine = String.fromCharCode(...bytes.slice(pos, resEnd));
  pos = resEnd + 1;
  const m = resLine.match(/-Y\s+(\d+)\s+\+X\s+(\d+)/);
  if (!m) throw new Error('Invalid HDR: ' + resLine);
  const height = parseInt(m[1]), width = parseInt(m[2]);
  const data = new Float32Array(width * height * 3);
  for (let y = 0; y < height; y++) {
    if (bytes[pos] === 2 && bytes[pos+1] === 2) {
      const scanW = (bytes[pos+2] << 8) | bytes[pos+3]; pos += 4;
      const channels = new Uint8Array(width * 4);
      for (let ch = 0; ch < 4; ch++) {
        let x = 0;
        while (x < width) {
          const code = bytes[pos++];
          if (code > 128) { const count = code-128, val = bytes[pos++]; for (let i = 0; i < count; i++) channels[(x+i)*4+ch] = val; x += count; }
          else { for (let i = 0; i < code; i++) channels[(x+i)*4+ch] = bytes[pos++]; x += code; }
        }
      }
      for (let x = 0; x < width; x++) {
        const r = channels[x*4], g = channels[x*4+1], b = channels[x*4+2], e = channels[x*4+3];
        const idx = (y * width + x) * 3;
        if (e === 0) { data[idx] = data[idx+1] = data[idx+2] = 0; }
        else { const s = Math.pow(2, e - 128 - 8); data[idx] = r*s; data[idx+1] = g*s; data[idx+2] = b*s; }
      }
    } else {
      for (let x = 0; x < width; x++) {
        const r = bytes[pos++], g = bytes[pos++], b = bytes[pos++], e = bytes[pos++];
        const idx = (y * width + x) * 3;
        if (e === 0) { data[idx] = data[idx+1] = data[idx+2] = 0; }
        else { const s = Math.pow(2, e - 128 - 8); data[idx] = r*s; data[idx+1] = g*s; data[idx+2] = b*s; }
      }
    }
  }
  return { data, width, height };
}

function sampleEquirect(hdr, dx, dy, dz) {
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  dx /= len; dy /= len; dz /= len;
  const theta = Math.acos(Math.max(-1, Math.min(1, dy)));
  const phi = Math.atan2(dz, dx);
  const u = (phi + Math.PI) / (2 * Math.PI);
  const v = theta / Math.PI;
  const px = Math.min(Math.floor(u * hdr.width), hdr.width - 1);
  const py = Math.min(Math.floor(v * hdr.height), hdr.height - 1);
  const idx = (py * hdr.width + px) * 3;
  return [hdr.data[idx], hdr.data[idx+1], hdr.data[idx+2]];
}

// Convert equirectangular HDR → cubemap faces as Float32 RGBA (linear HDR)
function hdrToCubemapFaces(hdr, size) {
  const allFaces = new Float32Array(6 * size * size * 4);
  for (let fi = 0; fi < 6; fi++) {
    const offset = fi * size * size * 4;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = (x + 0.5) / size * 2.0 - 1.0, v = (y + 0.5) / size * 2.0 - 1.0;
        let dx, dy, dz;
        switch (fi) {
          case 0: dx= 1; dy=-v; dz=-u; break; case 1: dx=-1; dy=-v; dz= u; break;
          case 2: dx= u; dy= 1; dz= v; break; case 3: dx= u; dy=-1; dz=-v; break;
          case 4: dx= u; dy=-v; dz= 1; break; case 5: dx=-u; dy=-v; dz=-1; break;
        }
        let [r, g, b] = sampleEquirect(hdr, dx, dy, dz);
        // Firefly clamp only
        const lum = 0.2126*r + 0.7152*g + 0.0722*b;
        if (lum > 64) { const c = 64/lum; r *= c; g *= c; b *= c; }
        const idx = offset + (y * size + x) * 4;
        allFaces[idx] = r; allFaces[idx+1] = g; allFaces[idx+2] = b; allFaces[idx+3] = 1.0;
      }
    }
  }
  return allFaces;
}

// Diffuse irradiance convolution: cosine-weighted hemisphere sampling
function convolveIrradianceFaces(hdr, size) {
  const allFaces = new Float32Array(6 * size * size * 4);
  const numSamples = 64;
  for (let fi = 0; fi < 6; fi++) {
    const offset = fi * size * size * 4;
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const u = (x + 0.5) / size * 2.0 - 1.0, v = (y + 0.5) / size * 2.0 - 1.0;
        let dx, dy, dz;
        switch (fi) {
          case 0: dx= 1; dy=-v; dz=-u; break; case 1: dx=-1; dy=-v; dz= u; break;
          case 2: dx= u; dy= 1; dz= v; break; case 3: dx= u; dy=-1; dz=-v; break;
          case 4: dx= u; dy=-v; dz= 1; break; case 5: dx=-u; dy=-v; dz=-1; break;
        }
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
        const N = [dx/len, dy/len, dz/len];
        // Build tangent frame
        const up = Math.abs(N[1]) < 0.999 ? [0,1,0] : [1,0,0];
        const T = [up[1]*N[2]-up[2]*N[1], up[2]*N[0]-up[0]*N[2], up[0]*N[1]-up[1]*N[0]];
        const tl = Math.sqrt(T[0]*T[0]+T[1]*T[1]+T[2]*T[2]);
        T[0]/=tl; T[1]/=tl; T[2]/=tl;
        const B = [N[1]*T[2]-N[2]*T[1], N[2]*T[0]-N[0]*T[2], N[0]*T[1]-N[1]*T[0]];
        let r = 0, g = 0, b = 0;
        for (let s = 0; s < numSamples; s++) {
          let bits = s; bits = (bits << 16) | (bits >>> 16);
          bits = ((bits & 0x55555555) << 1) | ((bits & 0xAAAAAAAA) >>> 1);
          bits = ((bits & 0x33333333) << 2) | ((bits & 0xCCCCCCCC) >>> 2);
          bits = ((bits & 0x0F0F0F0F) << 4) | ((bits & 0xF0F0F0F0) >>> 4);
          bits = ((bits & 0x00FF00FF) << 8) | ((bits & 0xFF00FF00) >>> 8);
          const xi1 = (s + 0.5) / numSamples;
          const xi2 = (bits >>> 0) * 2.3283064365386963e-10;
          const phi = 2 * Math.PI * xi1;
          const cosTheta = Math.sqrt(1.0 - xi2), sinTheta = Math.sqrt(xi2);
          const L = [
            T[0]*sinTheta*Math.cos(phi) + B[0]*sinTheta*Math.sin(phi) + N[0]*cosTheta,
            T[1]*sinTheta*Math.cos(phi) + B[1]*sinTheta*Math.sin(phi) + N[1]*cosTheta,
            T[2]*sinTheta*Math.cos(phi) + B[2]*sinTheta*Math.sin(phi) + N[2]*cosTheta,
          ];
          let [sr, sg, sb] = sampleEquirect(hdr, L[0], L[1], L[2]);
          const lum = 0.2126*sr + 0.7152*sg + 0.0722*sb;
          if (lum > 64) { const c = 64/lum; sr *= c; sg *= c; sb *= c; }
          r += sr; g += sg; b += sb;
        }
        r /= numSamples; g /= numSamples; b /= numSamples;
        const idx = offset + (y * size + x) * 4;
        allFaces[idx] = r; allFaces[idx+1] = g; allFaces[idx+2] = b; allFaces[idx+3] = 1.0;
      }
    }
  }
  return allFaces;
}

// GGX importance-sampled prefiltering: generate all mip levels for specular IBL.
// Returns Float32Array with all mips concatenated (mip0 full size, mip1 half, etc.)
function prefilterEnvMips(sourceSampler, faceSize) {
  const numMips = Math.floor(Math.log2(faceSize)) + 1;
  // Calculate total size
  let totalFloats = 0;
  for (let m = 0; m < numMips; m++) {
    const ms = Math.max(1, faceSize >> m);
    totalFloats += 6 * ms * ms * 4;
  }
  const allData = new Float32Array(totalFloats);
  let offset = 0;

  for (let mip = 0; mip < numMips; mip++) {
    const mipSize = Math.max(1, faceSize >> mip);
    const roughness = mip / Math.max(numMips - 1, 1);
    const numSamples = mip === 0 ? 1 : Math.max(16, 64 - mip * 8);

    for (let fi = 0; fi < 6; fi++) {
      for (let y = 0; y < mipSize; y++) {
        for (let x = 0; x < mipSize; x++) {
          const u = (x + 0.5) / mipSize * 2.0 - 1.0;
          const v = (y + 0.5) / mipSize * 2.0 - 1.0;
          let dx, dy, dz;
          switch (fi) {
            case 0: dx= 1; dy=-v; dz=-u; break; case 1: dx=-1; dy=-v; dz= u; break;
            case 2: dx= u; dy= 1; dz= v; break; case 3: dx= u; dy=-1; dz=-v; break;
            case 4: dx= u; dy=-v; dz= 1; break; case 5: dx=-u; dy=-v; dz=-1; break;
          }
          const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
          const N = [dx/len, dy/len, dz/len];

          if (mip === 0) {
            // Mip 0: direct sample
            let [r, g, b] = sourceSampler(N[0], N[1], N[2]);
            const lum = 0.2126*r + 0.7152*g + 0.0722*b;
            if (lum > 64) { const c = 64/lum; r *= c; g *= c; b *= c; }
            allData[offset++] = r; allData[offset++] = g; allData[offset++] = b; allData[offset++] = 1;
          } else {
            // GGX importance sampling
            const up = Math.abs(N[1]) < 0.999 ? [0,1,0] : [1,0,0];
            const T = [up[1]*N[2]-up[2]*N[1], up[2]*N[0]-up[0]*N[2], up[0]*N[1]-up[1]*N[0]];
            const tl = Math.sqrt(T[0]*T[0]+T[1]*T[1]+T[2]*T[2]);
            T[0]/=tl; T[1]/=tl; T[2]/=tl;
            const B = [N[1]*T[2]-N[2]*T[1], N[2]*T[0]-N[0]*T[2], N[0]*T[1]-N[1]*T[0]];
            const a = roughness * roughness;
            let r = 0, g = 0, b = 0, tw = 0;
            for (let s = 0; s < numSamples; s++) {
              let bits = s; bits=(bits<<16)|(bits>>>16);
              bits=((bits&0x55555555)<<1)|((bits&0xAAAAAAAA)>>>1);
              bits=((bits&0x33333333)<<2)|((bits&0xCCCCCCCC)>>>2);
              bits=((bits&0x0F0F0F0F)<<4)|((bits&0xF0F0F0F0)>>>4);
              bits=((bits&0x00FF00FF)<<8)|((bits&0xFF00FF00)>>>8);
              const xi1 = (s+0.5)/numSamples;
              const xi2 = (bits>>>0)*2.3283064365386963e-10;
              const cosT = Math.sqrt((1-xi2)/(1+(a*a-1)*xi2));
              const sinT = Math.sqrt(1-cosT*cosT);
              const phi = 2*Math.PI*xi1;
              const Hw = [
                T[0]*sinT*Math.cos(phi)+B[0]*sinT*Math.sin(phi)+N[0]*cosT,
                T[1]*sinT*Math.cos(phi)+B[1]*sinT*Math.sin(phi)+N[1]*cosT,
                T[2]*sinT*Math.cos(phi)+B[2]*sinT*Math.sin(phi)+N[2]*cosT,
              ];
              const VdH = N[0]*Hw[0]+N[1]*Hw[1]+N[2]*Hw[2];
              const L = [2*VdH*Hw[0]-N[0], 2*VdH*Hw[1]-N[1], 2*VdH*Hw[2]-N[2]];
              const NdL = N[0]*L[0]+N[1]*L[1]+N[2]*L[2];
              if (NdL > 0) {
                let [sr,sg,sb] = sourceSampler(L[0], L[1], L[2]);
                const lum = 0.2126*sr+0.7152*sg+0.0722*sb;
                if (lum > 64) { const c = 64/lum; sr*=c; sg*=c; sb*=c; }
                r += sr*NdL; g += sg*NdL; b += sb*NdL; tw += NdL;
              }
            }
            if (tw > 0) { r/=tw; g/=tw; b/=tw; }
            allData[offset++] = r; allData[offset++] = g; allData[offset++] = b; allData[offset++] = 1;
          }
        }
      }
    }
  }
  return allData;
}

async function loadEnvMap(url) {
  console.log('Loading environment map:', url);
  try {
    const resp = await fetch(url);
    if (!resp.ok) { console.warn('Env map fetch failed:', url); return; }
    const buffer = await resp.arrayBuffer();
    const hdr = parseHDR(buffer);
    console.log(`HDR parsed: ${hdr.width}x${hdr.height}`);
    const sampler = (dx, dy, dz) => sampleEquirect(hdr, dx, dy, dz);
    const pf = prefilterEnvMips(sampler, 256);
    const ir = convolveIrradianceFaces(hdr, 32);
    mr_uploadEnvMaps(pf, 256, ir, 32);
    console.log('HDR env maps uploaded (prefiltered)');
  } catch (e) { console.warn('Env map load error:', e); }
}

// Procedural sky sampler for prefiltering
function proceduralSkySample(dx, dy, dz) {
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  const ndx = dx/len, ndy = dy/len, ndz = dz/len;
  const skyT = Math.max(ndy, 0), groundT = Math.max(-ndy, 0);
  const horizonT = 1.0 - Math.abs(ndy);
  let r = 0.08 + skyT * 0.25 + horizonT * 0.35;
  let g = 0.10 + skyT * 0.35 + horizonT * 0.30;
  let b = 0.18 + skyT * 0.55 + horizonT * 0.25;
  r += groundT * 0.12; g += groundT * 0.10; b += groundT * 0.06;
  const sunDot = Math.max(ndx * 0.5 + ndy * 0.7 + ndz * 0.3, 0);
  const sunGlow = Math.pow(sunDot, 32) * 0.7 + Math.pow(sunDot, 4) * 0.2;
  r += sunGlow * 0.9; g += sunGlow * 0.8; b += sunGlow * 0.6;
  return [r, g, b];
}

function initEnvMaps() {
  // Procedural placeholder with proper GGX prefiltering
  const pf = prefilterEnvMips(proceduralSkySample, 64);
  const ir = generateProceduralEnvFaces(16); // irradiance doesn't need prefiltering
  mr_uploadEnvMaps(pf, 64, ir, 16);
  console.log('Procedural env maps uploaded (prefiltered)');
  // Load HDR async
  const envName = $('envmap-sel').value;
  if (envName !== 'procedural') {
    loadEnvMap(`/envmaps/${envName}.hdr`);
  }
}

// --- Animation + LOD ---
let animTime = 0;
let lodInFlight = false;
let lodDebounceTimer = null;
let skinTexW = 0;
let animInFlight = false;

async function tickAnimation(t) {
  if (!gpuSkinned || !meshInfo || animInFlight) return;
  animInFlight = true;
  try {
    const resp = await workerCall('evaluate_animation_frame', { t });
    if (resp.pose) {
      const matrices = resp.pose.matrices
        ? new Float32Array(resp.pose.matrices.buffer || resp.pose.matrices)
        : new Float32Array(0);
      const morphW = resp.pose.morph_weights
        ? new Float32Array(resp.pose.morph_weights.buffer || resp.pose.morph_weights)
        : new Float32Array(0);
      if (matrices.length > 0 || morphW.length > 0) {
        mr_uploadAnimationPose(matrices, morphW, skinTexW);
      }
    }
  } catch (e) { console.warn('Animation tick error:', e); }
  animInFlight = false;
}

function debouncedLodRecompute() {
  clearTimeout(lodDebounceTimer);
  lodDebounceTimer = setTimeout(recomputeLods, 200);
}

async function recomputeLods() {
  if (lodInFlight || !meshInfo) return;
  lodInFlight = true;
  try {
    let m;
    try { m = computeMobius(mob.xform.peek(), mob.mx.peek()/10, mob.my.peek()/10, mob.mz.peek()/10, mob.mr.peek()/10); }
    catch { m = computeMobius('identity', 0.5, 0, 0, 2); }
    const mob = [...m.a, ...m.b, ...m.c, ...m.d];
    const w = canvas.width, h = canvas.height;
    const ex = zoom*Math.sin(rotY)*Math.cos(rotX)+panX;
    const ey = zoom*Math.sin(rotX)+panY;
    const ez = zoom*Math.cos(rotY)*Math.cos(rotX)+panZ;
    const view = lookAt(ex,ey,ez, panX,panY,panZ, 0,1,0);
    const proj = perspective(Math.PI/3, w/h, 0.01, 10000);
    const vp = mulM4(proj, view);
    const tp = getTessParams();
    const resp = await workerCall('compute_animated_lods', {
      t: animTime, mobius: Array.from(mob), density: tp.density, minPx: tp.minPx,
      vpMatrix: Array.from(vp), vpWidth: w, vpHeight: h,
      tessDensity: tp.density, screenAtten: tp.screen_atten, minPxSub: tp.minPx,
    });
    if (resp.lods) {
      const faceLods = new Float32Array(resp.lods.buffer || resp.lods);
      mr_buildBatches(faceLods);
    }
  } catch (e) { console.warn('LOD recompute error:', e); }
  lodInFlight = false;
}

async function loadModel(buffer, filename) {
  $('stats').textContent = `Loading ${filename}...`;
  const resp = await workerCall('load_gltf_data', { bytes: buffer });
  meshInfo = resp.result;
  await finishModelUpload(resp.result, filename);
}

// --- Render loop ---
function frame(ts) {
  requestAnimationFrame(frame);
  const w = $('wrap');
  canvas.width = w.clientWidth; canvas.height = w.clientHeight;
  mr_resize(canvas.width, canvas.height);

  if (animating && gpuSkinned && meshInfo) {
    animTime += 1/60;
    if (meshInfo.duration > 0) animTime = animTime % meshInfo.duration;
    // Update time slider
    $('time').value = animTime;
    $('time-v').textContent = animTime.toFixed(2);
    tickAnimation(animTime);
  }

  const ex = zoom*Math.sin(rotY)*Math.cos(rotX)+panX;
  const ey = zoom*Math.sin(rotX)+panY;
  const ez = zoom*Math.cos(rotY)*Math.cos(rotX)+panZ;
  const view = lookAt(ex,ey,ez, panX,panY,panZ, 0,1,0);
  const proj = perspective(Math.PI/3, canvas.width/canvas.height, 0.01, 10000);
  const mvp = mulM4(proj, view);

  mr_render(mvp, view, new Float32Array([ex, ey, ez]));
}

// --- Load model ---
async function finishModelUpload(info, filename) {
  if (!info) { $('stats').textContent = 'Failed to load model'; return; }
  meshInfo = info;

  // Populate animation selector
  const animSel = $('anim-sel');
  animSel.innerHTML = '<option value="-1">None</option>';
  if (info.animations && info.animations.length > 0) {
    for (let i = 0; i < info.animations.length; i++) {
      const a = info.animations[i];
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = a.name || `Animation ${i}`;
      animSel.appendChild(opt);
    }
    animSel.value = '0';
  }

  // Set up time slider range
  if (info.animations && info.animations.length > 0) {
    const a = info.animations[0];
    $('time').min = a.time_min || 0;
    $('time').max = a.time_max || a.duration || 2;
    $('time').value = a.time_min || 0;
  }

  if (info.face_material_indices) {
    const fmi = new Int32Array(info.face_material_indices);
    // Log material distribution
    const counts = {};
    for (let i = 0; i < fmi.length; i++) counts[fmi[i]] = (counts[fmi[i]] || 0) + 1;
    console.log('face_material_indices:', fmi.length, 'faces, distribution:', JSON.stringify(counts));
    // Log first/last few to check ordering
    const first20 = Array.from(fmi.slice(0, 20));
    const last20 = Array.from(fmi.slice(-20));
    console.log('first 20 materials:', first20.join(','), 'last 20:', last20.join(','));
    mr_setFaceMaterials(fmi);
  }

  // Upload PBR materials
  if (info.materials && info.materials.length > 0) {
    const stride = 50; // 36 base + 5 tex indices + 7 ior/transmission/volume + 1 transmission_tex + 1 double_sided
    const matData = new Float32Array(info.materials.length * stride);
    for (let i = 0; i < info.materials.length; i++) {
      const m = info.materials[i];
      const o = i * stride;
      const bc = m.base_color || [1,1,1,1];
      console.log(`Mat${i}: rough=${m.roughness} trans=${m.transmission_factor} thick=${m.thickness_factor} ior=${m.ior} mr_tex=${m.metallic_roughness_texture_index} alpha=${m.alpha_mode} ds=${m.double_sided}`);
      const em = m.emissive_factor || [0,0,0];
      const sc = m.sheen_color || [0,0,0];
      const sp = m.specular_color || [1,1,1];
      const nus = m.normal_uv_scale || [1,1];
      const nuo = m.normal_uv_offset || [0,0];
      const bus = m.base_uv_scale || [1,1];
      const am = m.alpha_mode === 'MASK' ? 1 : (m.alpha_mode === 'BLEND' ? 2 : 0);
      matData[o+0] = bc[0]; matData[o+1] = bc[1]; matData[o+2] = bc[2]; matData[o+3] = bc[3];
      matData[o+4] = m.metallic ?? 0; matData[o+5] = m.roughness ?? 1;
      matData[o+6] = m.normal_scale ?? 1; matData[o+7] = m.occlusion_strength ?? 1;
      matData[o+8] = m.alpha_cutoff ?? 0.5; matData[o+9] = am; matData[o+10] = m.unlit ? 1 : 0;
      matData[o+11] = em[0]; matData[o+12] = em[1]; matData[o+13] = em[2];
      matData[o+14] = m.base_color_texture_index != null ? 1 : 0;
      matData[o+15] = m.metallic_roughness_texture_index != null ? 1 : 0;
      matData[o+16] = m.normal_texture_index != null ? 1 : 0;
      matData[o+17] = m.emissive_texture_index != null ? 1 : 0;
      matData[o+18] = m.occlusion_texture_index != null ? 1 : 0;
      matData[o+19] = sc[0]; matData[o+20] = sc[1]; matData[o+21] = sc[2];
      matData[o+22] = (sc[0]+sc[1]+sc[2]) > 0 ? 1 : 0; matData[o+23] = m.sheen_roughness ?? 0;
      matData[o+24] = sp[0]; matData[o+25] = sp[1]; matData[o+26] = sp[2];
      matData[o+27] = (sp[0]+sp[1]+sp[2]) < 3 ? 1 : 0;
      matData[o+28] = nus[0]; matData[o+29] = nus[1]; matData[o+30] = nuo[0]; matData[o+31] = nuo[1];
      matData[o+32] = m.normal_uv_rotation ?? 0;
      matData[o+33] = bus[0]; matData[o+34] = bus[1]; matData[o+35] = m.base_uv_rotation ?? 0;
      // Texture image indices (float-encoded, -1 = none)
      matData[o+36] = m.base_color_texture_index != null ? m.base_color_texture_index : -1;
      matData[o+37] = m.metallic_roughness_texture_index != null ? m.metallic_roughness_texture_index : -1;
      matData[o+38] = m.normal_texture_index != null ? m.normal_texture_index : -1;
      matData[o+39] = m.emissive_texture_index != null ? m.emissive_texture_index : -1;
      matData[o+40] = m.occlusion_texture_index != null ? m.occlusion_texture_index : -1;
      // IOR / transmission / volume
      matData[o+41] = m.ior ?? 1.5;
      matData[o+42] = m.transmission_factor ?? 0;
      matData[o+43] = m.thickness_factor ?? 0;
      const ac = m.attenuation_color || [1,1,1];
      matData[o+44] = ac[0]; matData[o+45] = ac[1]; matData[o+46] = ac[2];
      matData[o+47] = m.attenuation_distance || 1e10;
      matData[o+48] = m.transmission_texture_index != null ? m.transmission_texture_index : -1;
      matData[o+49] = m.double_sided ? 1 : 0;
    }
    mr_setMaterials(matData, info.materials.length);
    console.info('PBR material 0:', {
      base_color: info.materials[0].base_color, metallic: info.materials[0].metallic,
      roughness: info.materials[0].roughness,
      has_bc_tex: info.materials[0].base_color_texture_index != null,
    });
  }

  // Upload glTF images
  if (info.textures && info.textures.length > 0) {
    try {
      let totalSize = 0;
      const widths = new Uint32Array(info.textures.length);
      const heights = new Uint32Array(info.textures.length);
      for (let i = 0; i < info.textures.length; i++) {
        const t = info.textures[i];
        widths[i] = t.width || 0;
        heights[i] = t.height || 0;
        totalSize += widths[i] * heights[i] * 4;
      }
      if (totalSize > 0) {
        const allPixels = new Uint8Array(totalSize);
        const wrapModes = new Uint32Array(info.textures.length * 2);
        let off = 0;
        for (let i = 0; i < info.textures.length; i++) {
          const t = info.textures[i];
          const raw = t.data || t.pixels;
          const pixels = raw ? new Uint8Array(raw.buffer || raw) : new Uint8Array(0);
          allPixels.set(pixels, off);
          off += widths[i] * heights[i] * 4;
          wrapModes[i * 2] = t.wrap_s ?? 0x2901;     // default REPEAT
          wrapModes[i * 2 + 1] = t.wrap_t ?? 0x2901;
        }
        mr_uploadImages(allPixels, widths, heights, wrapModes);
      }
    } catch (e) { console.warn('Texture upload error:', e); }
  }

  // Skinning data
  gpuSkinned = !!(info.animations && info.animations.length > 0);
  const skinResp = await workerCall('get_skinning_data', {});
  const skinData = skinResp.skinData;
  const nv = skinData ? (skinData.num_vertices || 0) : 0;
  skinTexW = Math.min(nv, 4096);

  if (skinData && skinData.joint_indices) {
    mr_uploadSkinningTexture(
      new Float32Array(skinData.joint_indices.buffer || skinData.joint_indices),
      new Float32Array(skinData.joint_weights.buffer || skinData.joint_weights),
      skinData.num_vertices,
    );
  }
  if (skinData && skinData.morph_deltas) {
    mr_uploadMorphTexture(
      new Float32Array(skinData.morph_deltas.buffer || skinData.morph_deltas),
      skinData.num_vertices,
      skinData.num_morph_targets,
    );
  }

  const tp = getTessParams();
  await workerCall('set_tess_params', { density: tp.density, screenAtten: tp.screen_atten, minPx: tp.minPx });

  const rpResp = await workerCall('get_rest_pose_instances', { lod_time: 0 });
  const rp = rpResp.data || rpResp;

  if (!rp || !rp.instances) {
    $('stats').textContent = `${filename}: static model (no animation data path yet)`;
    return;
  }

  const instances = new Float32Array(rp.instances.buffer || rp.instances);
  const faceLods = new Float32Array(rp.face_lods.buffer || rp.face_lods);
  const numFaces = rp.num_faces;

  mr_setInstanceData(instances, numFaces);
  mr_buildBatches(faceLods);
  // Cache for async stretch sampling
  if (meshInfo) { meshInfo.instances = instances; meshInfo.num_faces = numFaces; }

  zoom = 3.0;
  rotX = 0.15; rotY = 0;
  panX = 0; panY = 0; panZ = 0;

  await workerCall('upload_model_to_compute', {});

  animTime = 0;
  if (info.animations && info.animations.length > 0) {
    await workerCall('set_active_animation', { index: 0 });
    meshInfo.duration = info.animations[0].duration || 0;
  } else {
    meshInfo.duration = 0;
  }

  $('stats').innerHTML = `<span class="val">${filename}</span>: ${numFaces} faces`;

  // Trigger GPU LOD recompute with current tess params (screen attenuation, density)
  debouncedLodRecompute();
}

// --- Init ---
// Read URL params — applied in wasm phase after mr_init
const initParams = readParams();
currentGlb = initParams.glb;
// Set camera early (not WASM-dependent)
zoom = parseFloat(initParams.zoom) || 3;
rotX = parseFloat(initParams.rx) || 0.3;
rotY = parseFloat(initParams.ry) || 0.5;

// ============================================================
// Lifecycle phases — explicit async dependency ordering.
// Each phase waits for its deps before running.
// ============================================================

// Phase 1: Initialize WASM + renderer
phase('wasm', [], async () => {
  await init();
  $('stats').textContent = 'Initializing renderer...';
  if (!mr_init('cv')) throw 'renderer init failed';
  applyParams(initParams); // Set signal values first
  wasmOk.set(true); // THEN fire effects with correct values + WASM ready
  initEnvMaps();
});

// Phase 2: Initialize workers (depends on wasm for shader compilation)
phase('workers', ['wasm'], async () => {
  $('stats').textContent = `Starting ${ATLAS_WORKERS} workers...`;
  await Promise.all(workers.map((_, i) => workerCallN(i, 'init', {})));
});

// Phase 3: Build tessellation atlas (depends on workers)
phase('atlas', ['workers'], async () => {
  const ATLAS_EXP = parseInt(initParams.atlas);
  const levels = [];
  for (let i = 0; i <= ATLAS_EXP; i++) levels.push(1 << i);
  const allTriples = [];
  const seen = new Set();
  for (const a of levels)
    for (const b of levels)
      for (const c of levels) {
        const s = [a,b,c].sort((x,y)=>x-y);
        const k = s.join(',');
        if (!seen.has(k)) { seen.add(k); allTriples.push(s); }
      }
  allTriples.sort((a,b) => (b[2]+b[1]+b[0]) - (a[2]+a[1]+a[0]));

  $('stats').textContent = `Building ${allTriples.length} patches across ${ATLAS_WORKERS} workers...`;
  let qi = 0;
  function dispatchNext(wi) {
    if (qi >= allTriples.length) return Promise.resolve();
    const [a, b, c] = allTriples[qi++];
    return workerCallN(wi, 'generate_single', { a, b, c }).then(() => dispatchNext(wi));
  }
  await Promise.all(workers.map((_, i) => dispatchNext(i)));

  // Export patches from all workers in parallel
  const allPatchResps = await Promise.all(
    workers.map((_, i) => workerCallN(i, 'export_patches', {}))
  );
  for (const resp of allPatchResps) {
    for (const p of resp.patches) {
      const key = p.key.join(',') + '/' + p.perm;
      const bary = new Float32Array(p.bary);
      const tris = new Uint32Array(p.tris);
      const lines = [];
      for (let i = 0; i < tris.length; i += 3) {
        lines.push(tris[i], tris[i+1], tris[i+1], tris[i+2], tris[i+2], tris[i]);
      }
      mr_uploadTessPatch(key, bary, tris, new Uint32Array(lines));
    }
  }

  // Merge atlas into worker 0 for runtime
  if (ATLAS_WORKERS > 1) {
    const subExports = await Promise.all(
      workers.slice(1).map((_, i) => workerCallN(i + 1, 'export_atlas_bytes', {}))
    );
    for (const exp of subExports) await workerCallN(0, 'merge_atlas_bytes', { bytes: exp.bytes });
  }
  dropExtraWorkers();
});

// Phase 4: Load model (depends on workers, runs in parallel with atlas)
phase('model', ['workers'], async () => {
  let buf = await idbGet(currentGlb);
  if (!buf) {
    const url = currentGlb.startsWith('/') || currentGlb.startsWith('http') ? currentGlb : '/' + currentGlb;
    const resp = await fetch(url);
    if (resp.ok) buf = await resp.arrayBuffer();
  }
  if (!buf) return null;
  const resp = await workerCall('load_gltf_data', { bytes: buf });
  return { result: resp.result, filename: currentGlb };
});

// Phase 5: Upload model + start rendering (depends on atlas + model + wasm)
phase('render', ['wasm', 'atlas', 'model'], async () => {
  requestAnimationFrame(frame);
  const modelData = phases.model.result.peek();
  if (modelData && modelData.result) {
    meshInfo = modelData.result;
    await finishModelUpload(modelData.result, modelData.filename);
    const animIdx = parseInt(initParams.anim);
    if (animIdx >= 0 && $('anim-sel').querySelector(`option[value="${animIdx}"]`)) {
      $('anim-sel').value = animIdx;
      $('anim-sel').dispatchEvent(new Event('change'));
    }
  } else {
    $('stats').textContent = 'Drop a .glb file to load';
  }
});

// Error handling for all phases
(async () => { try { await gate(phases.render.done); } catch (e) {
  console.warn(`Startup error:`, e);
  $('stats').textContent = 'Drop a .glb file to load';
} })();
</script>
</body>
</html>
