<!DOCTYPE html>

<style>

body{font-family:'SF Mono','Consolas',monospace;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}

input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#30363d;border-radius:2px;outline:none}

.v{font-size:12px;min-width:36px;text-align:right;color:#58a6ff;font-weight:bold}
.btns{display:flex;gap:3px;flex-wrap:wrap}
.btns button{flex:1;padding:4px 6px;font-size:10px;font-family:inherit;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;border-radius:4px;transition:all 0.15s;min-width:40px}

<body>
<div id="sidebar">
  <h1>HYPERSCOPE</h1>
  <div class="sub">Spacetime slicing + Mobius conformal transforms</div>

  <div class="section">
    <label>Shape</label>
    <div class="btns" id="shape-btns">
      <button data-v="galloping_horse" class="a">Horse</button>

      <div class="sr"><span style="font-size:10px;color:#8b949e;width:30px">Y</span><input type="range" id="my" min="-30" max="30" value="0"><span class="v" id="my-v">0.0</span></div>

    </select>
  </div>

  <div class="section">
    <label>Resolution (0=auto)</label>
    <div class="sr"><input type="range" id="res" min="0" max="6" value="0"><span class="v" id="res-v">auto</span></div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <div class="toggle" id="spacetime-toggle"></div>

  <div class="stats" id="stats">Loading WASM...</div>

<div id="wrap"><canvas id="cv"></canvas></div>

<script type="module">
const $=s=>document.getElementById(s);
const canvas=$('cv');
const gl=canvas.getContext('webgl2',{antialias:true});
if(!gl){document.body.innerHTML='<h1 style="color:#f85;padding:40px">WebGL2 not supported</h1>';throw 'no webgl2';}

// --- State ---
let meshInfo = null, workerReady = false;
let rotateNormalOverride = null;  // set by rotate-slice animation
let renderMode = 'matcap';
let rotX = 0.3, rotY = 0.5, zoom = 5;
let animating = false, animDir = 1;
let pendingUpdate = false, updating = false;
let currentShape = 'galloping_horse';
let currentXform = 'identity';

// --- Worker ---
const worker = new Worker('./hyperscope_worker.js', { type: 'module' });
let msgId = 0;
const pending = new Map();

function workerCall(type, data) {
  return new Promise((resolve) => {
    const id = ++msgId;
    pending.set(id, resolve);
    worker.postMessage({ type, data, id });
  });
}
worker.onmessage = (e) => {
  const { id } = e.data;
  const resolve = pending.get(id);
  if (resolve) { pending.delete(id); resolve(e.data); }
};

// --- Shaders (copied from index.html) ---
const VS = `#version 300 es
layout(location=0) in vec3 a_bary;
layout(location=1) in vec4 a_p0;
layout(location=2) in vec4 a_p1;
layout(location=3) in vec4 a_p2;
layout(location=4) in vec4 a_w0;
layout(location=5) in vec4 a_w1;
layout(location=6) in vec4 a_w2;
layout(location=7) in vec4 a_lodInfo;
layout(location=8) in vec4 a_vertLod;
uniform mat4 u_mvp;
uniform mat4 u_mv;
uniform int u_useQB;
uniform float u_permParity;
uniform int u_permIndex;

out vec3 v_normal_vs;
out float v_density;
out vec2 v_matcap_uv;
out float v_fade;

vec3 permBary(vec3 b, int p) {
  if (p <= 0) return b;
  if (p == 1) return b.xzy;
  if (p == 2) return b.yxz;
  if (p == 3) return b.yzx;
  if (p == 4) return b.zxy;
  return b.zyx;
}

vec4 qm(vec4 a, vec4 b) {
  return vec4(
    a.x*b.x-a.y*b.y-a.z*b.z-a.w*b.w,
    a.x*b.y+a.y*b.x+a.z*b.w-a.w*b.z,
    a.x*b.z-a.y*b.w+a.z*b.x+a.w*b.y,
    a.x*b.w+a.y*b.z-a.z*b.y+a.w*b.x);
}
vec4 qinv(vec4 q) { float d=dot(q,q); return d<1e-20 ? vec4(1e10,0,0,0) : vec4(q.x,-q.yzw)/d; }

void evalQBWithNormal(vec3 bary, vec4 p0,vec4 p1,vec4 p2, vec4 w0,vec4 w1,vec4 w2,
                      out vec3 pos, out vec3 nrm) {
  vec4 pw0 = qm(p0,w0), pw1 = qm(p1,w1), pw2 = qm(p2,w2);
  vec4 top = bary.x*pw0 + bary.y*pw1 + bary.z*pw2;
  vec4 bot = bary.x*w0  + bary.y*w1  + bary.z*w2;
  vec4 bi = qinv(bot);
  vec4 X = qm(top, bi);
  pos = X.yzw;
  vec4 dtop_u = pw1 - pw0;
  vec4 dbot_u = w1 - w0;
  vec4 dtop_v = pw2 - pw0;
  vec4 dbot_v = w2 - w0;
  vec4 dXu = qm(dtop_u - qm(X, dbot_u), bi);
  vec4 dXv = qm(dtop_v - qm(X, dbot_v), bi);
  nrm = normalize(cross(dXu.yzw, dXv.yzw));
}

vec3 evalFlat(vec3 bary, vec4 p0,vec4 p1,vec4 p2) {
  return bary.x*p0.yzw + bary.y*p1.yzw + bary.z*p2.yzw;
}

float edgeDensity(vec3 bary, vec3 res) {
  float x = bary.x, y = bary.y, z = bary.z;
  float e0 = y * z, e1 = x * z, e2 = x * y;
  float sum = e0 + e1 + e2;
  if (sum < 1e-10) return max(res.x, max(res.y, res.z));
  float logRes = (e0*log(max(res.x,1.0)) + e1*log(max(res.y,1.0)) + e2*log(max(res.z,1.0))) / sum;
  return exp(logRes);
}

void main(){
  vec3 bary = permBary(a_bary, u_permIndex);
  vec3 p, n;
  if (u_useQB == 1) {
    evalQBWithNormal(bary, a_p0,a_p1,a_p2, a_w0,a_w1,a_w2, p, n);
  } else {
    p = evalFlat(bary, a_p0,a_p1,a_p2);
    n = normalize(cross(a_p1.yzw - a_p0.yzw, a_p2.yzw - a_p0.yzw));
  }
  n *= u_permParity;
  vec3 n_vs = normalize(mat3(u_mv) * n);
  v_normal_vs = n_vs;
  v_matcap_uv = n_vs.xy * 0.5 + 0.5;
  float density = edgeDensity(bary, a_lodInfo.xyz);
  v_density = log2(max(density, 1.0)) / 10.0;
  v_fade = 1.0;
  if (u_useQB == 1) {
    vec4 bot = a_bary.x*a_w0 + a_bary.y*a_w1 + a_bary.z*a_w2;
    float bot_sq = dot(bot, bot);
    v_fade = smoothstep(0.0001, 0.001, bot_sq);
  }
  gl_Position = u_mvp * vec4(p, 1.0);
}`;

const FS_MATCAP = `#version 300 es
precision highp float;
in vec3 v_normal_vs;
in float v_density;
in vec2 v_matcap_uv;
in float v_fade;
uniform sampler2D u_matcapTex;
out vec4 o;
void main(){
  if (v_fade < 0.01) discard;
  vec3 n = normalize(v_normal_vs);
  n = gl_FrontFacing ? n : -n;
  vec2 uv = n.xy * 0.48 + 0.5;
  vec4 col = texture(u_matcapTex, uv);
  col.a *= v_fade;
  o = col;
}`;

const FS_LOD = `#version 300 es
precision mediump float;
in vec3 v_normal_vs;
in float v_density;
in vec2 v_matcap_uv;
in float v_fade;
uniform vec3 u_lodColor;
out vec4 o;
vec3 heatmap(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0=vec3(0.,.0,.5), c1=vec3(0.,.5,1.), c2=vec3(0.,1.,.5), c3=vec3(1.,1.,0.), c4=vec3(1.,0.,0.);
  if(t<.25) return mix(c0,c1,t*4.);
  if(t<.5)  return mix(c1,c2,(t-.25)*4.);
  if(t<.75) return mix(c2,c3,(t-.5)*4.);
  return mix(c3,c4,(t-.75)*4.);
}
void main(){
  vec3 n = normalize(v_normal_vs);
  n = gl_FrontFacing ? n : -n;
  float NdV = max(n.z, 0.0);
  vec3 lightDir = normalize(vec3(0.4, 0.7, 0.9));
  float NdL = dot(n, lightDir);
  float diff = NdL * 0.5 + 0.5;
  vec3 H = normalize(lightDir + vec3(0,0,1));
  float spec = pow(max(dot(n, H), 0.0), 40.0);
  float rim = pow(1.0 - NdV, 3.0);
  if (v_fade < 0.01) discard;
  vec3 base = heatmap(v_density);
  vec3 shadow = base * 0.12 + vec3(0.03, 0.01, 0.08);
  vec3 lit = base * 1.4;
  vec3 col = mix(shadow, lit, diff);
  col += vec3(1.0, 0.95, 0.90) * spec * 0.8;
  col += base * rim * 0.4;
  col += vec3(0.05, 0.02, 0.08);
  o = vec4(col, v_fade);
}`;

const FS_WIRE = `#version 300 es
precision mediump float;
in vec3 v_normal_vs;
in float v_density;
in vec2 v_matcap_uv;
in float v_fade;
uniform vec3 u_lodColor;
uniform int u_showDensity;
out vec4 o;
vec3 heatmap(float t) {
  t = clamp(t, 0.0, 1.0);
  vec3 c0=vec3(0.,.0,.5), c1=vec3(0.,.5,1.), c2=vec3(0.,1.,.5), c3=vec3(1.,1.,0.), c4=vec3(1.,0.,0.);
  if(t<.25) return mix(c0,c1,t*4.);
  if(t<.5)  return mix(c1,c2,(t-.25)*4.);
  if(t<.75) return mix(c2,c3,(t-.5)*4.);
  return mix(c3,c4,(t-.75)*4.);
}
void main(){
  if (v_fade < 0.01) discard;
  if (u_showDensity == 1) {
    o = vec4(heatmap(v_density), v_fade);
  } else {
    o = vec4(u_lodColor, v_fade);
  }
}`;

const FS_NORMALS = `#version 300 es
precision mediump float;
in vec3 v_normal_vs;
in float v_density;
in vec2 v_matcap_uv;
in float v_fade;
out vec4 o;
void main(){
  if (v_fade < 0.01) discard;
  vec3 n = normalize(v_normal_vs);
  n = gl_FrontFacing ? n : -n;
  o = vec4(n * 0.5 + 0.5, v_fade);
}`;

// --- Shader compilation ---
function mkS(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error('SHADER:',gl.getShaderInfoLog(s));return s;}
function mkProg(vs,fs){const p=gl.createProgram();gl.attachShader(p,mkS(vs,gl.VERTEX_SHADER));gl.attachShader(p,mkS(fs,gl.FRAGMENT_SHADER));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error('LINK:',gl.getProgramInfoLog(p));return p;}

const progMatcap = mkProg(VS, FS_MATCAP);
const progLod = mkProg(VS, FS_LOD);
const progWire = mkProg(VS, FS_WIRE);
const progNormals = mkProg(VS, FS_NORMALS);

// --- Matcap texture ---
let matcapTex = gl.createTexture();
function loadMatcap(name) {
  const img = new Image();
  img.onload = () => {
    gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    render();
  };
  img.src = '/matcaps/' + name + '.png';
}

// --- LOD color ---
function lodColor(lod) {
  const maxLod = Math.max(...lod);
  const logLod = Math.log2(Math.max(maxLod, 1));
  const t = Math.min(logLod / 8.0, 1.0);
  const h = (1.0 - t) * 270;
  const s = 0.85, l = 0.55;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60)%2 - 1));
  const m = l - c/2;
  let r,g,b;
  if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else{r=c;g=0;b=x;}
  return [r+m, g+m, b+m];
}

// --- Draw state ---
let drawBatches = [];
let globalMaxLogLod = 1;
let vaoOrigMesh = null, numOrigInst = 0;
const ORIG_BARY = new Float32Array([1,0,0, 0,1,0, 0,0,1]);
const ORIG_LINES = new Uint32Array([0,1, 1,2, 2,0]);
const tessCache = new Map();
const vaoCache = new Map();

function makeVAO(baryData, idxData, instanceData) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const bb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bb);
  gl.bufferData(gl.ARRAY_BUFFER, baryData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);
  for (let i=0;i<8;i++) {
    gl.enableVertexAttribArray(1+i);
    gl.vertexAttribPointer(1+i,4,gl.FLOAT,false,128,i*16);
    gl.vertexAttribDivisor(1+i,1);
  }
  const eb = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxData, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return vao;
}

function getTessBuffers(batch) {
  const key = batch.wanted_lod.join(',') + '/' + (batch.perm_index || 0);
  if (tessCache.has(key)) return tessCache.get(key);
  if (!batch.tess_bary.length) return null;

  const bary = new Float32Array(batch.tess_bary);
  const tris = batch.tess_triangles;
  const lines = [];
  for (let i = 0; i < tris.length; i += 3) lines.push(tris[i],tris[i+1], tris[i+1],tris[i+2], tris[i+2],tris[i]);

  const baryBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, baryBuf);
  gl.bufferData(gl.ARRAY_BUFFER, bary, gl.STATIC_DRAW);
  const lineIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(lines), gl.STATIC_DRAW);
  const triIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tris), gl.STATIC_DRAW);

  const entry = { baryBuf, lineIdxBuf, triIdxBuf, numLineIdx: lines.length, numTriIdx: tris.length };
  tessCache.set(key, entry);
  return entry;
}

function getOrCreateBatchVAOs(tessKey, tessBufs, instanceData, numInstances) {
  let entry = vaoCache.get(tessKey);
  const dataF32 = new Float32Array(instanceData);

  if (entry) {
    gl.bindBuffer(gl.ARRAY_BUFFER, entry.instanceBuf);
    if (dataF32.byteLength <= entry.instanceBufSize) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, dataF32);
    } else {
      gl.bufferData(gl.ARRAY_BUFFER, dataF32, gl.DYNAMIC_DRAW);
      entry.instanceBufSize = dataF32.byteLength;
    }
    entry.numInst = numInstances;
    return entry;
  }

  const instanceBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
  gl.bufferData(gl.ARRAY_BUFFER, dataF32, gl.DYNAMIC_DRAW);

  function makeVAOWithIdx(idxBuf) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, tessBufs.baryBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
    for (let i = 0; i < 8; i++) {
      gl.enableVertexAttribArray(1+i);
      gl.vertexAttribPointer(1+i, 4, gl.FLOAT, false, 128, i*16);
      gl.vertexAttribDivisor(1+i, 1);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    gl.bindVertexArray(null);
    return vao;
  }

  entry = {
    lineVao: makeVAOWithIdx(tessBufs.lineIdxBuf),
    triVao: makeVAOWithIdx(tessBufs.triIdxBuf),
    instanceBuf,
    instanceBufSize: dataF32.byteLength,
    numInst: numInstances,
  };
  vaoCache.set(tessKey, entry);
  return entry;
}

function uploadBatches(data) {
  const usedKeys = new Set();
  drawBatches = [];

  // Original mesh wireframe
  const allOrig = [];
  for (const batch of data.batches) {
    for (let i = 0; i < batch.instances_orig.length; i++) allOrig.push(batch.instances_orig[i]);
  }
  numOrigInst = data.total_faces;
  if (!vaoOrigMesh) {
    vaoOrigMesh = makeVAO(ORIG_BARY, ORIG_LINES, new Float32Array(allOrig));
  } else {
    gl.bindVertexArray(vaoOrigMesh);
    const origBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, origBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(allOrig), gl.DYNAMIC_DRAW);
    for (let i = 0; i < 8; i++) {
      gl.enableVertexAttribArray(1+i);
      gl.vertexAttribPointer(1+i, 4, gl.FLOAT, false, 128, i*16);
      gl.vertexAttribDivisor(1+i, 1);
    }
    gl.bindVertexArray(null);
  }

  globalMaxLogLod = 1;
  for (const batch of data.batches) {
    const m = Math.max(...batch.lod);
    globalMaxLogLod = Math.max(globalMaxLogLod, Math.log2(Math.max(m, 1)));
  }

  let totalRendered = 0, totalSkipped = 0;
  for (const batch of data.batches) {
    const tess = getTessBuffers(batch);
    if (!tess) { totalSkipped += batch.num_faces; continue; }
    totalRendered += batch.num_faces;
    const vaoKey = batch.wanted_lod.join(',') + '/' + batch.perm_index;
    usedKeys.add(vaoKey);
    const cached = getOrCreateBatchVAOs(vaoKey, tess, batch.instances_xform, batch.num_faces);

    drawBatches.push({
      vaoXform: cached.lineVao,
      vaoXformTri: cached.triVao,
      numLineIdx: tess.numLineIdx,
      numTriIdx: tess.numTriIdx,
      numInst: batch.num_faces,
      lod: batch.lod,
      color: lodColor(batch.lod),
      parity: batch.perm_parity || 1,
      permIndex: batch.perm_index || 0,
    });
  }
}

// --- Matrix math ---
function perspective(fov,a,n,f){const t=1/Math.tan(fov*.5),r=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,n*f*r*2,0]);}
function lookAt(ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux,sl=Math.hypot(sx,sy,sz);sx/=sl;sy/=sl;sz/=sl;let ux2=sy*fz-sz*fy,uy2=sz*fx-sx*fz,uz2=sx*fy-sy*fx;return new Float32Array([sx,ux2,-fx,0,sy,uy2,-fy,0,sz,uz2,-fz,0,-(sx*ex+sy*ey+sz*ez),-(ux2*ex+uy2*ey+uz2*ez),fx*ex+fy*ey+fz*ez,1]);}
function mulM4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}

// --- Render ---
function render() {
  const w=$('wrap');
  canvas.width=w.clientWidth; canvas.height=w.clientHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.051,0.067,0.090,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  if (!drawBatches.length) return;

  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const view = lookAt(ex,ey,ez,0,0,0,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.01,10000);
  const mvp = mulM4(proj, view);

  const drawWire = renderMode === 'wire' || renderMode === 'both';
  const drawLod = renderMode === 'lod' || renderMode === 'both';
  const drawMatcap = renderMode === 'matcap';
  const drawNormals = renderMode === 'normals';

  // Original mesh wireframe
  if (drawWire && vaoOrigMesh) {
    gl.useProgram(progWire);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWire,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWire,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progWire,'u_useQB'), 0);
    gl.uniform1i(gl.getUniformLocation(progWire,'u_showDensity'), 0);
    gl.uniform3f(gl.getUniformLocation(progWire,'u_lodColor'), 0.25, 0.25, 0.35);
    gl.uniform1f(gl.getUniformLocation(progWire,'u_permParity'), 1.0);
    gl.uniform1i(gl.getUniformLocation(progWire,'u_permIndex'), 0);
    gl.bindVertexArray(vaoOrigMesh);
    gl.drawElementsInstanced(gl.LINES, 6, gl.UNSIGNED_INT, 0, numOrigInst);
  }

  if (drawMatcap) {
    gl.useProgram(progMatcap);
    gl.uniformMatrix4fv(gl.getUniformLocation(progMatcap,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progMatcap,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progMatcap,'u_useQB'), 1);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    gl.uniform1i(gl.getUniformLocation(progMatcap,'u_matcapTex'), 0);
    for (const b of drawBatches) {
      gl.uniform1f(gl.getUniformLocation(progMatcap,'u_permParity'), b.parity);
      gl.uniform1i(gl.getUniformLocation(progMatcap,'u_permIndex'), 0);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  if (drawLod) {
    gl.useProgram(progLod);
    gl.uniformMatrix4fv(gl.getUniformLocation(progLod,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progLod,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progLod,'u_useQB'), 1);
    for (const b of drawBatches) {
      gl.uniform3fv(gl.getUniformLocation(progLod,'u_lodColor'), b.color);
      gl.uniform1f(gl.getUniformLocation(progLod,'u_permParity'), b.parity);
      gl.uniform1i(gl.getUniformLocation(progLod,'u_permIndex'), 0);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  if (drawWire) {
    gl.useProgram(progWire);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWire,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progWire,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progWire,'u_useQB'), 1);
    gl.uniform1i(gl.getUniformLocation(progWire,'u_showDensity'), 1);
    for (const b of drawBatches) {
      gl.uniform3fv(gl.getUniformLocation(progWire,'u_lodColor'), b.color);
      gl.uniform1f(gl.getUniformLocation(progWire,'u_permParity'), b.parity);
      gl.uniform1i(gl.getUniformLocation(progWire,'u_permIndex'), 0);
      gl.bindVertexArray(b.vaoXform);
      gl.drawElementsInstanced(gl.LINES, b.numLineIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  if (drawNormals) {
    gl.useProgram(progNormals);
    gl.uniformMatrix4fv(gl.getUniformLocation(progNormals,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progNormals,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progNormals,'u_useQB'), 1);
    for (const b of drawBatches) {
      gl.uniform1f(gl.getUniformLocation(progNormals,'u_permParity'), b.parity);
      gl.uniform1i(gl.getUniformLocation(progNormals,'u_permIndex'), 0);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  gl.bindVertexArray(null);
}

// --- Slice + transform ---
function getTransformParams() {
  const mx = parseInt($('mx').value)/10;
  const my = parseInt($('my').value)/10;
  const mz = parseInt($('mz').value)/10;
  const mr = parseInt($('mr').value)/10;
  $('mx-v').textContent = mx.toFixed(1);
  $('my-v').textContent = my.toFixed(1);
  $('mz-v').textContent = mz.toFixed(1);
  $('mr-v').textContent = mr.toFixed(1);
  return { mx, my, mz, mr };
}

function getSliceNormal() {
  const tilt = parseFloat($('tilt').value);
  let dir = 'x';
  document.querySelectorAll('#dir-btns .a').forEach(b => { dir = b.dataset.v; });
  const sinT = Math.sin(tilt), cosT = Math.cos(tilt);
  if (dir === 'x') return [sinT, 0, 0, cosT];
  if (dir === 'y') return [0, sinT, 0, cosT];
  return [0, 0, sinT, cosT];
}

let interactiveRes = 0; // 0 = use slider value, >0 = override during interaction
let lodDebounce = null;

function updateFast() {
  // Quick update with fixed LOD during active interaction
  interactiveRes = 4;
  clearTimeout(lodDebounce);
  lodDebounce = setTimeout(() => { interactiveRes = 0; update(); }, 200);
  update();
}

async function update() {
  if (!workerReady || !meshInfo) return;
  if (updating) { pendingUpdate = true; return; }
  updating = true;

  const timeOffset = parseFloat($('time').value);
  const normal = getSliceNormal();
  const cosT = normal[3];
  const offset = timeOffset * cosT;

  const { mx, my, mz, mr } = getTransformParams();
  const resVal = parseInt($('res').value);
  const baseRes = resVal === 0 ? 0 : (1 << resVal);
  const res = interactiveRes > 0 ? interactiveRes : baseRes;
  $('res-v').textContent = baseRes === 0 ? 'auto' : baseRes;

  // VP matrix for screen-space LOD
  const w=$('wrap');
  const vpW = w.clientWidth || 800, vpH = w.clientHeight || 600;
  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const vpMatrix = mulM4(perspective(Math.PI/3, vpW/vpH, 0.1, 100), lookAt(ex,ey,ez,0,0,0,0,1,0));

  const tType = currentXform === 'identity' ? 'identity' :
                currentXform === 'sphere_reflection' ? (mr > 0.01 ? 'sphere_reflection' : 'identity') :
                currentXform;

  const spacetimeOn = $('spacetime-toggle').classList.contains('on');
  // Use rotate override if active, otherwise slider-derived normal
  const effectiveNormal = rotateNormalOverride || (spacetimeOn ? normal : [0, 0, 0, 1]);
  const effectiveOffset = spacetimeOn ? (rotateNormalOverride ? timeOffset * effectiveNormal[3] : offset) : timeOffset;
  // Clear override after use — it's set each animation frame
  rotateNormalOverride = null;

  const t0 = performance.now();
  const resp = await workerCall('slice_and_transform', {
    normal: Array.from(effectiveNormal),
    offset: effectiveOffset,
    transformType: tType,
    params: [mx, my, mz, mr],
    overrideRes: res,
    vpMatrix: Array.from(vpMatrix),
    vpWidth: vpW,
    vpHeight: vpH,
  });
  const ms = performance.now() - t0;
  const data = resp.result;

  if (data && data.batches) {
    uploadBatches(data);
    render();

    const totalTris = data.batches.reduce((s,b) => s + b.num_faces * b.tris_per_face, 0);
    const totalVerts = data.batches.reduce((s,b) => s + b.num_faces * b.verts_per_face, 0);
    $('stats').innerHTML =
      `Faces: <span class="val">${data.total_faces}</span><br>` +
      `Batches: <span class="val">${data.num_batches}</span><br>` +
      `Tris: <span class="val">${totalTris}</span><br>` +
      `Verts: <span class="val">${totalVerts}</span><br>` +
      `Slice+Xform: <span class="val">${ms.toFixed(0)}ms</span>`;

    // Background generation of missing patches
    const fallbacks = data.batches.filter(b => b.is_fallback);
    if (fallbacks.length > 0) {
      const missing = [...new Set(fallbacks.map(b => b.wanted_lod.join(',')))];
      for (const key of missing) {
        const [a,b,c] = key.split(',').map(Number);
        if (a > 512 || b > 512 || c > 512) continue;
        workerCall('generate_single', { a, b, c }).then(() => {
          if (!updating && !pendingUpdate) update();
        });
      }
    }
  }

  updating = false;
  if (pendingUpdate) { pendingUpdate = false; update(); }
}

// --- Mouse orbit ---
let drag=false, lx=0, ly=0;
canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
onmouseup = () => drag=false;
let camDebounce = null;
onmousemove = e => { if(!drag)return; rotY+=(e.clientX-lx)*0.01; rotX+=(e.clientY-ly)*0.01; lx=e.clientX; ly=e.clientY; render(); clearTimeout(camDebounce); camDebounce=setTimeout(update, 150); };
canvas.onwheel = e => { zoom *= e.deltaY>0 ? 1.1 : 0.9; zoom=Math.max(1,Math.min(100,zoom)); render(); update(); e.preventDefault(); };

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => { if (e.touches.length===1) lastTouch=[e.touches[0].clientX,e.touches[0].clientY]; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===1 && lastTouch) {
    const dx=e.touches[0].clientX-lastTouch[0], dy=e.touches[0].clientY-lastTouch[1];
    lastTouch=[e.touches[0].clientX,e.touches[0].clientY];
    rotY+=dx*0.005; rotX+=dy*0.005;
    rotX=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,rotX));
    render();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouch=null; });
onresize = render;

// --- UI wiring ---
function setupBtnGroup(id, cb) {
  for (const b of document.querySelectorAll(`#${id} button`))
    b.onclick = () => { document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('a')); b.classList.add('a'); cb(b.dataset.v); };
}

setupBtnGroup('shape-btns', async (name) => {
  currentShape = name;
  $('stats').innerHTML = 'Loading shape...';
  const resp = await workerCall('create_hypermesh', { name });
  meshInfo = resp.result;
  const timeSlider = $('time');
  timeSlider.min = meshInfo.time_min;
  timeSlider.max = meshInfo.time_max;
  timeSlider.step = (meshInfo.time_max - meshInfo.time_min) / 200;
  timeSlider.value = (meshInfo.time_min + meshInfo.time_max) / 2;
  $('time-v').textContent = parseFloat(timeSlider.value).toFixed(2);
  // Clear tess cache on shape change since topology changes
  tessCache.clear();
  vaoCache.clear();
  vaoOrigMesh = null;
  animDir = 1;
  update();
});

setupBtnGroup('dir-btns', () => update());
setupBtnGroup('render-btns', (v) => { renderMode = v; render(); });
setupBtnGroup('xform-btns', (v) => { currentXform = v; update(); });

$('matcap-sel').addEventListener('change', () => loadMatcap($('matcap-sel').value));

$('time').addEventListener('input', () => { $('time-v').textContent = parseFloat($('time').value).toFixed(2); updateFast(); });
$('tilt').addEventListener('input', () => { $('tilt-v').textContent = parseFloat($('tilt').value).toFixed(2); updateFast(); });
for (const id of ['mx','my','mz','mr'])
  $(id).addEventListener('input', updateFast);
$('res').addEventListener('input', update);

// Spacetime toggle
$('spacetime-toggle').addEventListener('click', () => {
  $('spacetime-toggle').classList.toggle('on');
  update();
});

// Animate toggle
const animToggle = $('animate-toggle');
animToggle.addEventListener('click', () => {
  animating = !animating;
  animToggle.classList.toggle('on', animating);
});

// Rotate slice mode toggle
$('rotate-mode-toggle').addEventListener('click', () => {
  $('rotate-mode-toggle').classList.toggle('on');
});

// Animation loop — rotates the hyperplane tilt angle instead of sweeping time.
// This keeps the slice centered in the periodic region for clean wrapping.
let animPhase = 0;
function frame() {
  if (animating && meshInfo) {
    const rotateMode = $('rotate-mode-toggle').classList.contains('on');
    if (rotateMode) {
      // 4D double rotation of the hyperplane normal.
      // Two independent rotation rates in orthogonal planes:
      //   plane 1: (x, t) at rate φ₁
      //   plane 2: (y, z) at rate φ₂
      // With different rates, the normal traces a Lissajous on S³.
      animPhase += 0.005;
      const p1 = animPhase;        // (x, t) plane rotation
      const p2 = animPhase * 0.618; // (y, z) plane — golden ratio for non-repeating
      const c1 = Math.cos(p1), s1 = Math.sin(p1);
      const c2 = Math.cos(p2), s2 = Math.sin(p2);
      // Start with pure time normal (0,0,0,1).
      // R1 in (x,t): (sin θ₁, 0, 0, cos θ₁)
      // R2 in (y,z): rotates the y,z of that result
      // But (0,0,0,1) has no y,z, so we tilt into x first, then rotate x,y
      // to spread it across all spatial dimensions.
      // Plane 1: (x, t), Plane 2: (x, y) — creates a filling pattern on S³
      const nx = s1 * c2;
      const ny = s1 * s2;
      const nz = 0;
      const nt = c1;
      // Normalize (should already be unit but just in case)
      const len = Math.sqrt(nx*nx + ny*ny + nz*nz + nt*nt);
      rotateNormalOverride = [nx/len, ny/len, nz/len, nt/len];
    } else {
      // Sweep time forward
      const slider = $('time');
      let val = parseFloat(slider.value);
      const speed = 0.003 * (meshInfo.time_max - meshInfo.time_min);
      val += speed;
      if (val >= meshInfo.time_max) { val = meshInfo.time_min + (val - meshInfo.time_max); }
      slider.value = val;
      $('time-v').textContent = val.toFixed(2);
    }
    updateFast();
  }
  render();
  requestAnimationFrame(frame);
}

// --- Init ---
$('stats').textContent = 'Starting worker...';
await workerCall('init', {});
$('stats').textContent = 'Building atlas...';
const r1 = await workerCall('build_atlas', { maxLodExp: 9, mode: 'hierarchical' });
workerReady = true;
$('stats').textContent = `Atlas built in ${r1.ms.toFixed(0)}ms`;

// Load matcap
loadMatcap($('matcap-sel').value);

// Load default shape (horse)
$('stats').innerHTML = 'Loading horse...';
const initResp = await workerCall('create_hypermesh', { name: 'galloping_horse' });
meshInfo = initResp.result;
const timeSlider = $('time');
timeSlider.min = meshInfo.time_min;
timeSlider.max = meshInfo.time_max;
timeSlider.step = (meshInfo.time_max - meshInfo.time_min) / 200;
timeSlider.value = (meshInfo.time_min + meshInfo.time_max) / 2;
$('time-v').textContent = parseFloat(timeSlider.value).toFixed(2);

update();
requestAnimationFrame(frame);
</script>
