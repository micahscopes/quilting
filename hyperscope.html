<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hyperscope — Spacetime + Conformal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Consolas',monospace;background:#0d1117;color:#c9d1d9;display:flex;height:100vh;overflow:hidden}
#sidebar{width:260px;padding:14px;background:rgba(22,27,34,0.96);border-right:1px solid #30363d;display:flex;flex-direction:column;gap:10px;flex-shrink:0;overflow-y:auto}
h1{font-size:15px;color:#58a6ff;letter-spacing:2px}
.sub{font-size:10px;color:#484f58;margin-top:2px}
label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px;display:block;margin-bottom:3px}
.sr{display:flex;align-items:center;gap:6px}
input[type=range]{flex:1;height:4px;-webkit-appearance:none;background:#30363d;border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#58a6ff;cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#58a6ff;cursor:pointer;border:none}
.v{font-size:12px;min-width:36px;text-align:right;color:#58a6ff;font-weight:bold}
.btns{display:flex;gap:3px;flex-wrap:wrap}
.btns button{flex:1;padding:4px 6px;font-size:10px;font-family:inherit;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;border-radius:4px;transition:all 0.15s;min-width:40px}
.btns button:hover{background:#30363d;border-color:#58a6ff}
.btns button.a{background:#1f6feb;color:#fff;border-color:#58a6ff}
select{width:100%;padding:5px;font-family:inherit;font-size:11px;background:#21262d;color:#c9d1d9;border:1px solid #30363d;border-radius:4px}
.stats{font-size:10px;color:#484f58;line-height:1.6;margin-top:auto;padding-top:10px;border-top:1px solid #30363d}
.stats .val{color:#58a6ff}
.section{border-bottom:1px solid #21262d;padding-bottom:8px}
.toggle-row{display:flex;align-items:center;gap:8px}
.toggle{position:relative;width:36px;height:20px;background:#30363d;border-radius:10px;cursor:pointer;transition:background 0.2s}
.toggle.on{background:#1f6feb}
.toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:#c9d1d9;top:2px;left:2px;transition:left 0.2s}
.toggle.on::after{left:18px}
.toggle-label{font-size:12px}
#wrap{flex:1;position:relative}
#cv{position:absolute;top:0;left:0;width:100%;height:100%}
#drop-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;display:none;z-index:10;border:3px dashed #58a6ff;background:rgba(31,111,235,0.08);align-items:center;justify-content:center}
#drop-overlay.active{display:flex}
#drop-overlay span{font-size:18px;color:#58a6ff;letter-spacing:2px;text-transform:uppercase;pointer-events:none}
.glb-btn{width:100%;padding:6px 8px;font-size:11px;font-family:inherit;border:1px solid #30363d;background:#21262d;color:#8b949e;cursor:pointer;border-radius:4px;transition:all 0.15s;text-align:center}
.glb-btn:hover{background:#30363d;border-color:#58a6ff;color:#c9d1d9}
</style>
</head>
<body>
<div id="sidebar">
  <h1>HYPERSCOPE</h1>
  <div class="sub">Spacetime slicing + Mobius conformal transforms</div>

  <div class="section">
    <label>Shape</label>
    <div class="btns" id="shape-btns">
      <button data-v="galloping_horse" class="a">Horse</button>
      <button data-v="rotating_cube">Cube</button>
      <button data-v="breathing_sphere">Sphere</button>
      <button data-v="colliding_spheres">Collide</button>
      <button data-v="twisting_torus">Torus</button>
    </div>
  </div>

  <div class="section">
    <label>Spacetime</label>
    <div class="sr"><span style="font-size:10px;color:#8b949e;width:50px">Time</span><input type="range" id="time" min="0" max="2" step="any" value="1"><span class="v" id="time-v">1.00</span></div>
    <div class="sr"><span style="font-size:10px;color:#8b949e;width:50px">Tilt</span><input type="range" id="tilt" min="0" max="0.5" step="0.005" value="0"><span class="v" id="tilt-v">0.00</span></div>
    <div style="margin-top:4px">
      <span style="font-size:10px;color:#8b949e">Tilt Dir</span>
      <div class="btns" id="dir-btns" style="margin-top:3px">
        <button class="a" data-v="x">X</button>
        <button data-v="y">Y</button>
        <button data-v="z">Z</button>
      </div>
    </div>
  </div>

  <div class="section">
    <label>Mobius Transform</label>
    <div class="btns" id="xform-btns">
      <button class="a" data-v="identity">None</button>
      <button data-v="sphere_reflection">Inversion</button>
      <button data-v="rotation">Rotation</button>
      <button data-v="translation">Translate</button>
    </div>
    <div style="margin-top:6px">
      <div class="sr"><span style="font-size:10px;color:#8b949e;width:30px">X</span><input type="range" id="mx" min="-30" max="30" value="5"><span class="v" id="mx-v">0.5</span></div>
      <div class="sr"><span style="font-size:10px;color:#8b949e;width:30px">Y</span><input type="range" id="my" min="-30" max="30" value="0"><span class="v" id="my-v">0.0</span></div>
      <div class="sr"><span style="font-size:10px;color:#8b949e;width:30px">Z</span><input type="range" id="mz" min="-30" max="30" value="0"><span class="v" id="mz-v">0.0</span></div>
      <div class="sr"><span style="font-size:10px;color:#8b949e;width:30px">R</span><input type="range" id="mr" min="0" max="50" value="20"><span class="v" id="mr-v">2.0</span></div>
    </div>
  </div>

  <div class="section">
    <label>Render</label>
    <div class="btns" id="render-btns">
      <button data-v="pbr" class="a">PBR</button>
      <button data-v="matcap">Matcap</button>
      <button data-v="lod">LOD</button>
      <button data-v="wire">Wire</button>
      <button data-v="both">Both</button>
      <button data-v="normals">Normals</button>
    </div>
  </div>

  <div class="section">
    <label>Variant</label>
    <select id="variant-sel" style="display:none"><option value="-1">Default</option></select>
  </div>

  <div class="section">
    <label>Environment</label>
    <select id="envmap-sel">
      <option value="rosendal_plains_1_1k" selected>Rosendal Plains</option>
      <option value="rogland_clear_night_2k">Rogland Night</option>
      <option value="ticknock_04_1k">Ticknock</option>
      <option value="procedural">Procedural Sky</option>
    </select>
  </div>

  <div class="section">
    <label>Matcap</label>
    <select id="matcap-sel">
      <option value="aqua">Aqua</option>
      <option value="citric-acid" selected>Citric Acid</option>
      <option value="golden-soft">Golden Soft</option>
      <option value="soft-studio">Soft Studio</option>
    </select>
  </div>

  <div class="section">
    <label>Resolution (0=auto)</label>
    <div class="sr"><input type="range" id="res" min="0" max="6" value="0"><span class="v" id="res-v">auto</span></div>
  </div>

  <div class="section">
    <div class="toggle-row">
      <div class="toggle" id="spacetime-toggle"></div>
      <span class="toggle-label">Spacetime slicing</span>
    </div>
    <div class="toggle-row">
      <div class="toggle" id="toroidal-toggle"></div>
      <span class="toggle-label">Toroidal time</span>
    </div>
    <div class="toggle-row">
      <div class="toggle on" id="animate-toggle"></div>
      <span class="toggle-label">Auto-animate</span>
    </div>
    <div class="toggle-row">
      <div class="toggle" id="rotate-mode-toggle"></div>
      <span class="toggle-label">Rotate slice</span>
    </div>
    <div id="rotation-planes" style="margin-top:4px;display:none">
      <span style="font-size:10px;color:#8b949e">Plane 1</span>
      <div class="btns" id="plane1-btns" style="margin-top:2px">
        <button class="btn active" data-v="xt">XT</button>
        <button class="btn" data-v="yt">YT</button>
        <button class="btn" data-v="zt">ZT</button>
        <button class="btn" data-v="xy">XY</button>
        <button class="btn" data-v="xz">XZ</button>
        <button class="btn" data-v="yz">YZ</button>
      </div>
      <span style="font-size:10px;color:#8b949e;margin-top:3px;display:inline-block">Plane 2</span>
      <div class="btns" id="plane2-btns" style="margin-top:2px">
        <button class="btn" data-v="xt">XT</button>
        <button class="btn active" data-v="yt">YT</button>
        <button class="btn" data-v="zt">ZT</button>
        <button class="btn" data-v="xy">XY</button>
        <button class="btn" data-v="xz">XZ</button>
        <button class="btn" data-v="yz">YZ</button>
      </div>
      <div class="sr" style="margin-top:4px">
        <span style="font-size:10px;color:#8b949e;width:40px">Ratio</span>
        <input type="range" id="rot-ratio" min="1" max="100" value="62">
        <span class="v" id="rot-ratio-v">0.62</span>
      </div>
      <div class="sr" style="margin-top:4px">
        <span style="font-size:10px;color:#8b949e;width:40px">Speed</span>
        <input type="range" id="rot-speed" min="1" max="100" value="10">
        <span class="v" id="rot-speed-v">0.005</span>
      </div>
    </div>
  </div>

  <div class="section">
    <label>Load Model</label>
    <button class="glb-btn" id="glb-btn">Load glTF / GLB</button>
    <input type="file" id="glb-file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json" style="display:none">
  </div>

  <div class="stats" id="stats">Loading WASM...</div>
</div>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="drop-overlay"><span>Drop .glb / .gltf file here</span></div>
</div>

<script type="module">
const $=s=>document.getElementById(s);
const canvas=$('cv');
const gl=canvas.getContext('webgl2',{antialias:true});
if(!gl){document.body.innerHTML='<h1 style="color:#f85;padding:40px">WebGL2 not supported</h1>';throw 'no webgl2';}

// --- State ---
let meshInfo = null, workerReady = false;
let rotateNormalOverride = null;
let animating = true;  // auto-animate on by default
let renderMode = 'pbr';
let rotX = 0.3, rotY = 0.5, zoom = 5;
let animDir = 1;
let pendingUpdate = false, updating = false;
let currentShape = 'galloping_horse';
let currentXform = 'identity';

// --- Material & texture state ---
// Materials array from glTF: [{base_color:[r,g,b,a], metallic, roughness, base_color_texture_index, ...}]
let loadedMaterials = [];
// WebGL textures created from glTF images, indexed by image index
let loadedTextures = [];
// Per-material resolved base_color (factor * texture average if applicable)
let materialColors = [];

function createTexturesFromGltf(textures, materials) {
  // Clean up old textures
  for (const tex of loadedTextures) {
    if (tex && tex.glTexture) gl.deleteTexture(tex.glTexture);
  }
  loadedTextures = [];
  loadedMaterials = materials || [];
  materialColors = [];

  // Create WebGL textures from image data.
  // All textures loaded as RGBA — shader handles sRGB→linear conversion
  // via pow(2.2) for base color and emissive textures.
  const aniso = gl.getExtension('EXT_texture_filter_anisotropic');
  const maxAniso = aniso ? gl.getParameter(aniso.MAX_TEXTURE_MAX_ANISOTROPY_EXT) : 1;
  if (textures) {
    for (let ti = 0; ti < textures.length; ti++) {
      const img = textures[ti];
      const glTex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, glTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, img.width, img.height, 0,
                    gl.RGBA, gl.UNSIGNED_BYTE, img.data);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      if (aniso) gl.texParameterf(gl.TEXTURE_2D, aniso.TEXTURE_MAX_ANISOTROPY_EXT, maxAniso);
      gl.generateMipmap(gl.TEXTURE_2D);
      loadedTextures.push({ glTexture: glTex, width: img.width, height: img.height, avgColor: img.avg_color });
    }
  }

  // Compute per-material resolved colors
  for (const mat of loadedMaterials) {
    const bc = mat.base_color ? [mat.base_color[0], mat.base_color[1], mat.base_color[2], mat.base_color[3]] : [1,1,1,1];
    if (mat.base_color_texture_index != null && mat.base_color_texture_index >= 0) {
      const tex = loadedTextures[mat.base_color_texture_index];
      if (tex && tex.avgColor) {
        // Multiply factor by texture average color
        materialColors.push([
          bc[0] * tex.avgColor[0],
          bc[1] * tex.avgColor[1],
          bc[2] * tex.avgColor[2],
          bc[3] * tex.avgColor[3],
        ]);
        continue;
      }
    }
    materialColors.push(bc);
  }
}

function getMaterialParams(materialIndex) {
  if (materialIndex >= 0 && materialIndex < loadedMaterials.length) {
    const mat = loadedMaterials[materialIndex];
    const bc = materialColors[materialIndex] || mat.base_color || [0.9, 0.75, 0.6, 1.0];
    const alphaStr = mat.alpha_mode || 'OPAQUE';
    return {
      baseColor: bc,
      metallic: mat.metallic ?? 0.0,
      roughness: mat.roughness ?? 0.4,
      baseColorTextureIndex: mat.base_color_texture_index ?? -1,
      metallicRoughnessTextureIndex: mat.metallic_roughness_texture_index ?? -1,
      normalTextureIndex: mat.normal_texture_index ?? -1,
      normalScale: mat.normal_scale ?? 1.0,
      emissiveFactor: mat.emissive_factor || [0, 0, 0],
      emissiveTextureIndex: mat.emissive_texture_index ?? -1,
      occlusionTextureIndex: mat.occlusion_texture_index ?? -1,
      occlusionStrength: mat.occlusion_strength ?? 1.0,
      alphaMode: alphaStr === 'MASK' ? 1 : (alphaStr === 'BLEND' ? 2 : 0),
      alphaCutoff: mat.alpha_cutoff ?? 0.5,
      doubleSided: mat.double_sided ?? false,
      unlit: mat.unlit ?? false,
      sheenColor: mat.sheen_color || [0, 0, 0],
      sheenRoughness: mat.sheen_roughness ?? 0.0,
      specularColor: mat.specular_color || [1, 1, 1],
      normalUvScale: mat.normal_uv_scale || [1, 1],
      normalUvOffset: mat.normal_uv_offset || [0, 0],
      normalUvRotation: mat.normal_uv_rotation ?? 0,
    };
  }
  const bc = meshInfo ? (meshInfo.base_color || [0.9, 0.75, 0.6, 1.0]) : [0.9, 0.75, 0.6, 1.0];
  const met = meshInfo ? (meshInfo.metallic ?? 0.0) : 0.0;
  const rough = meshInfo ? (meshInfo.roughness ?? 0.4) : 0.4;
  return {
    baseColor: bc, metallic: met, roughness: rough,
    baseColorTextureIndex: -1, metallicRoughnessTextureIndex: -1,
    normalTextureIndex: -1, normalScale: 1.0,
    emissiveFactor: [0, 0, 0], emissiveTextureIndex: -1,
    occlusionTextureIndex: -1, occlusionStrength: 1.0,
    alphaMode: 0, alphaCutoff: 0.5,
    doubleSided: false, unlit: false,
  };
}

// --- Worker ---
const worker = new Worker('./hyperscope_worker.js', { type: 'module' });
let msgId = 0;
const pending = new Map();

function workerCall(type, data) {
  return new Promise((resolve) => {
    const id = ++msgId;
    pending.set(id, resolve);
    worker.postMessage({ type, data, id });
  });
}
worker.onmessage = (e) => {
  const { id } = e.data;
  const resolve = pending.get(id);
  if (resolve) { pending.delete(id); resolve(e.data); }
};

// --- Shaders loaded from WASM (compiled from WGSL via naga) ---
// No inline GLSL -- shaders are compiled at runtime by quilting-shaders.
// WGSL source is compiled to GLSL ES 300 via naga in the WASM module.
// The naga-compiled shaders use UBOs instead of individual uniforms:
//   Vertex:   layout(std140) uniform Uniforms_block_0Vertex { ... }
//   Wire FS:  layout(std140) uniform WireUniforms_block_0Fragment { ... }
let shadersLoaded = false;

// --- Shader compilation (deferred until WASM provides GLSL) ---
function mkS(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error('SHADER:',gl.getShaderInfoLog(s),'\n\nSource:\n',src);}return s;}
function mkProg(vs,fs){const p=gl.createProgram();gl.attachShader(p,mkS(vs,gl.VERTEX_SHADER));gl.attachShader(p,mkS(fs,gl.FRAGMENT_SHADER));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error('LINK:',gl.getProgramInfoLog(p));return p;}

let progMatcap = null, progLod = null, progWire = null, progNormals = null, progPbr = null;
let pbrSamplerLocs = {}; // sampler2D uniform locations for PBR textures
const placeholderTex = null; // 1x1 white texture for unbound slots

// --- UBO management ---
// Vertex UBO: Uniforms_block_0Vertex (std140, binding 0)
//   mat4x4 mvp       (offset 0,   64 bytes)
//   mat4x4 mv        (offset 64,  64 bytes)
//   float perm_parity (offset 128,  4 bytes)
//   int perm_index    (offset 132,  4 bytes)
//   int use_qb        (offset 136,  4 bytes)
//   float _pad        (offset 140,  4 bytes)
//   vec4 mob_a        (offset 144, 16 bytes)
//   vec4 mob_b        (offset 160, 16 bytes)
//   vec4 mob_c        (offset 176, 16 bytes)
//   vec4 mob_d        (offset 192, 16 bytes)
//   vec4 camera_pos   (offset 208, 16 bytes)
//   Total: 224 bytes
const VTX_UBO_SIZE = 224;
const VTX_UBO_BINDING = 0;
const vtxUbo = gl.createBuffer();
gl.bindBuffer(gl.UNIFORM_BUFFER, vtxUbo);
gl.bufferData(gl.UNIFORM_BUFFER, VTX_UBO_SIZE, gl.DYNAMIC_DRAW);

// Wire UBO: WireUniforms_block_0Fragment (std140, binding 1)
//   vec3 color       (offset 0,  12 bytes)
//   int show_density (offset 12,  4 bytes)
//   Total: 16 bytes
const WIRE_UBO_SIZE = 16;
const WIRE_UBO_BINDING = 1;
const wireUbo = gl.createBuffer();
gl.bindBuffer(gl.UNIFORM_BUFFER, wireUbo);
gl.bufferData(gl.UNIFORM_BUFFER, WIRE_UBO_SIZE, gl.DYNAMIC_DRAW);

const vtxUboData = new ArrayBuffer(VTX_UBO_SIZE);
const vtxUboF32 = new Float32Array(vtxUboData);
const vtxUboI32 = new Int32Array(vtxUboData);

const wireUboData = new ArrayBuffer(WIRE_UBO_SIZE);
const wireUboF32 = new Float32Array(wireUboData);
const wireUboI32 = new Int32Array(wireUboData);

// PBR UBO: PbrUniforms (std140, binding 2)
// Layout (96 bytes):
//   base_color: vec4         (0-15)
//   metallic: f32            (16)
//   roughness: f32           (20)
//   has_base_color_tex: f32  (24)
//   has_mr_tex: f32          (28)
//   emissive_factor: vec4    (32-47)
//   normal_scale: f32        (48)
//   has_normal_tex: f32      (52)
//   has_emissive_tex: f32    (56)
//   has_occlusion_tex: f32   (60)
//   occlusion_strength: f32  (64)
//   alpha_cutoff: f32        (68)
//   alpha_mode: f32          (72)
//   unlit: f32               (76)
//   has_env_map: f32         (80)
//   env_mip_count: f32       (84)
//   _pad0: f32               (88)
//   _pad1: f32               (92)
const PBR_UBO_SIZE = 192; // + sheen + specular + normal UV transform
const PBR_UBO_BINDING = 2;
const pbrUbo = gl.createBuffer();
gl.bindBuffer(gl.UNIFORM_BUFFER, pbrUbo);
gl.bufferData(gl.UNIFORM_BUFFER, PBR_UBO_SIZE, gl.DYNAMIC_DRAW);
const pbrUboData = new ArrayBuffer(PBR_UBO_SIZE);
const pbrUboF32 = new Float32Array(pbrUboData);

// Base color texture from glTF (null when no texture loaded)
let baseColorTex = null;

// --- Environment cubemap for IBL ---
let envCubemap = null;       // prefiltered specular cubemap
let envIrradiance = null;    // diffuse irradiance cubemap
let envMipCount = 1;

// Generate a procedural environment cubemap (sky/ground gradient).
// Each face is rendered as pixel data with a simple sky model.
function createProceduralEnvMap(size) {
  const cubemap = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, cubemap);

  const faces = [
    gl.TEXTURE_CUBE_MAP_POSITIVE_X, gl.TEXTURE_CUBE_MAP_NEGATIVE_X,
    gl.TEXTURE_CUBE_MAP_POSITIVE_Y, gl.TEXTURE_CUBE_MAP_NEGATIVE_Y,
    gl.TEXTURE_CUBE_MAP_POSITIVE_Z, gl.TEXTURE_CUBE_MAP_NEGATIVE_Z,
  ];

  for (let fi = 0; fi < 6; fi++) {
    const pixels = new Uint8Array(size * size * 4);
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        // Map pixel to cubemap direction
        const u = (x + 0.5) / size * 2.0 - 1.0;
        const v = (y + 0.5) / size * 2.0 - 1.0;
        let dx, dy, dz;
        switch (fi) {
          case 0: dx= 1; dy=-v; dz=-u; break; // +X
          case 1: dx=-1; dy=-v; dz= u; break; // -X
          case 2: dx= u; dy= 1; dz= v; break; // +Y
          case 3: dx= u; dy=-1; dz=-v; break; // -Y
          case 4: dx= u; dy=-v; dz= 1; break; // +Z
          case 5: dx=-u; dy=-v; dz=-1; break; // -Z
        }
        const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
        dy /= len;

        const skyT = Math.max(dy, 0);
        const groundT = Math.max(-dy, 0);
        const horizonT = 1.0 - Math.abs(dy);

        // Sky gradient — kept in 0-1 for RGBA8, shader multiplies by env intensity
        let r = 0.08 + skyT * 0.25 + horizonT * 0.35;
        let g = 0.10 + skyT * 0.35 + horizonT * 0.30;
        let b = 0.18 + skyT * 0.55 + horizonT * 0.25;

        // Ground (warm bounce)
        r += groundT * 0.12;
        g += groundT * 0.10;
        b += groundT * 0.06;

        // Sun glow
        const sunDx = dx/len, sunDy = dy/len, sunDz = dz/len;
        const sunDot = Math.max(sunDx * 0.5 + sunDy * 0.7 + sunDz * 0.3, 0);
        const sunGlow = Math.pow(sunDot, 32) * 0.7 + Math.pow(sunDot, 4) * 0.2;
        r += sunGlow * 0.9;
        g += sunGlow * 0.8;
        b += sunGlow * 0.6;


        const idx = (y * size + x) * 4;
        pixels[idx]   = Math.min(r * 255, 255)|0;
        pixels[idx+1] = Math.min(g * 255, 255)|0;
        pixels[idx+2] = Math.min(b * 255, 255)|0;
        pixels[idx+3] = 255;
      }
    }
    gl.texImage2D(faces[fi], 0, gl.RGBA, size, size, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  }

  gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);

  envMipCount = Math.floor(Math.log2(size));
  return cubemap;
}

// --- HDR (Radiance RGBE) loader ---
function parseHDR(buffer) {
  const bytes = new Uint8Array(buffer);
  let pos = 0;
  // Skip header lines until empty line
  while (pos < bytes.length) {
    let lineEnd = pos;
    while (lineEnd < bytes.length && bytes[lineEnd] !== 10) lineEnd++;
    const line = String.fromCharCode(...bytes.slice(pos, lineEnd));
    pos = lineEnd + 1;
    if (line.trim() === '') break;
  }
  // Resolution line: "-Y height +X width"
  let resEnd = pos;
  while (resEnd < bytes.length && bytes[resEnd] !== 10) resEnd++;
  const resLine = String.fromCharCode(...bytes.slice(pos, resEnd));
  pos = resEnd + 1;
  const m = resLine.match(/-Y\s+(\d+)\s+\+X\s+(\d+)/);
  if (!m) throw new Error('Invalid HDR resolution: ' + resLine);
  const height = parseInt(m[1]), width = parseInt(m[2]);

  const data = new Float32Array(width * height * 3);
  for (let y = 0; y < height; y++) {
    let scanline;
    // Check for new-style RLE
    if (bytes[pos] === 2 && bytes[pos+1] === 2) {
      const scanW = (bytes[pos+2] << 8) | bytes[pos+3];
      pos += 4;
      if (scanW !== width) throw new Error('RLE width mismatch');
      // Decode 4 channels separately (RLE per channel)
      const channels = new Uint8Array(width * 4);
      for (let ch = 0; ch < 4; ch++) {
        let x = 0;
        while (x < width) {
          const code = bytes[pos++];
          if (code > 128) {
            const count = code - 128;
            const val = bytes[pos++];
            for (let i = 0; i < count; i++) channels[(x + i) * 4 + ch] = val;
            x += count;
          } else {
            for (let i = 0; i < code; i++) channels[(x + i) * 4 + ch] = bytes[pos++];
            x += code;
          }
        }
      }
      // Convert RGBE to float
      for (let x = 0; x < width; x++) {
        const r = channels[x*4], g = channels[x*4+1], b = channels[x*4+2], e = channels[x*4+3];
        const idx = (y * width + x) * 3;
        if (e === 0) { data[idx] = data[idx+1] = data[idx+2] = 0; }
        else {
          const scale = Math.pow(2, e - 128 - 8);
          data[idx] = r * scale; data[idx+1] = g * scale; data[idx+2] = b * scale;
        }
      }
    } else {
      // Old-style: 4 bytes per pixel (RGBE), no RLE
      for (let x = 0; x < width; x++) {
        const r = bytes[pos++], g = bytes[pos++], b = bytes[pos++], e = bytes[pos++];
        const idx = (y * width + x) * 3;
        if (e === 0) { data[idx] = data[idx+1] = data[idx+2] = 0; }
        else {
          const scale = Math.pow(2, e - 128 - 8);
          data[idx] = r * scale; data[idx+1] = g * scale; data[idx+2] = b * scale;
        }
      }
    }
  }
  return { data, width, height };
}

// Sample equirectangular HDR map at a direction vector
function sampleEquirect(hdr, dx, dy, dz) {
  const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
  dx /= len; dy /= len; dz /= len;
  const theta = Math.acos(Math.max(-1, Math.min(1, dy)));
  const phi = Math.atan2(dz, dx);
  const u = (phi + Math.PI) / (2 * Math.PI);
  const v = theta / Math.PI;
  const px = Math.min(Math.floor(u * hdr.width), hdr.width - 1);
  const py = Math.min(Math.floor(v * hdr.height), hdr.height - 1);
  const idx = (py * hdr.width + px) * 3;
  return [hdr.data[idx], hdr.data[idx+1], hdr.data[idx+2]];
}

// Convert equirectangular HDR to a cubemap texture
function hdrToCubemap(hdr, faceSize) {
  const cubemap = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, cubemap);
  const faces = [
    gl.TEXTURE_CUBE_MAP_POSITIVE_X, gl.TEXTURE_CUBE_MAP_NEGATIVE_X,
    gl.TEXTURE_CUBE_MAP_POSITIVE_Y, gl.TEXTURE_CUBE_MAP_NEGATIVE_Y,
    gl.TEXTURE_CUBE_MAP_POSITIVE_Z, gl.TEXTURE_CUBE_MAP_NEGATIVE_Z,
  ];
  for (let fi = 0; fi < 6; fi++) {
    const pixels = new Float32Array(faceSize * faceSize * 4);
    for (let y = 0; y < faceSize; y++) {
      for (let x = 0; x < faceSize; x++) {
        const u = (x + 0.5) / faceSize * 2.0 - 1.0;
        const v = (y + 0.5) / faceSize * 2.0 - 1.0;
        let dx, dy, dz;
        switch (fi) {
          case 0: dx= 1; dy=-v; dz=-u; break;
          case 1: dx=-1; dy=-v; dz= u; break;
          case 2: dx= u; dy= 1; dz= v; break;
          case 3: dx= u; dy=-1; dz=-v; break;
          case 4: dx= u; dy=-v; dz= 1; break;
          case 5: dx=-u; dy=-v; dz=-1; break;
        }
        const [r, g, b] = sampleEquirect(hdr, dx, dy, dz);
        const idx = (y * faceSize + x) * 4;
        pixels[idx] = r; pixels[idx+1] = g; pixels[idx+2] = b; pixels[idx+3] = 1;
      }
    }
    // Tone-map to RGBA8 for maximum compatibility (Reinhard per channel)
    const u8 = new Uint8Array(faceSize * faceSize * 4);
    for (let j = 0; j < faceSize * faceSize; j++) {
      for (let ch = 0; ch < 3; ch++) {
        const v = pixels[j * 4 + ch];
        const mapped = v / (v + 1.0); // Reinhard
        u8[j * 4 + ch] = Math.min(Math.pow(mapped, 1/2.2) * 255, 255) | 0; // gamma
      }
      u8[j * 4 + 3] = 255;
    }
    gl.texImage2D(faces[fi], 0, gl.RGBA, faceSize, faceSize, 0, gl.RGBA, gl.UNSIGNED_BYTE, u8);
  }
  // Half-float linear filtering (widely supported in WebGL2)
  gl.generateMipmap(gl.TEXTURE_CUBE_MAP);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);
  envMipCount = Math.floor(Math.log2(faceSize));
  return cubemap;
}

async function loadEnvMap(url) {
  console.log('Loading environment map:', url);
  const resp = await fetch(url);
  const buffer = await resp.arrayBuffer();
  const hdr = parseHDR(buffer);
  // Check HDR data validity
  let minV = Infinity, maxV = -Infinity, nonZero = 0;
  for (let i = 0; i < Math.min(hdr.data.length, 10000); i++) {
    const v = hdr.data[i];
    if (v > 0) nonZero++;
    minV = Math.min(minV, v); maxV = Math.max(maxV, v);
  }
  console.log(`HDR parsed: ${hdr.width}x${hdr.height}, range [${minV.toFixed(4)}, ${maxV.toFixed(4)}], ${nonZero}/10000 non-zero`);

  if (envCubemap) gl.deleteTexture(envCubemap);
  if (envIrradiance) gl.deleteTexture(envIrradiance);

  envCubemap = hdrToCubemap(hdr, 256);
  envIrradiance = hdrToCubemap(hdr, 32); // low-res for diffuse
  console.log('Environment cubemaps created, mips:', envMipCount);
  render();
}

// Generate sheen E LUT — 2D texture indexed by (NdotV, sheenRoughness).
// Stores the directional albedo of the Charlie sheen distribution.
let sheenELut = null;
function generateSheenELut() {
  const size = 64;
  const data = new Uint8Array(size * size);
  for (let y = 0; y < size; y++) {
    const roughness = (y + 0.5) / size;
    const alphaG = roughness * roughness;
    const invAlpha = 1.0 / Math.max(alphaG, 0.0001);
    for (let x = 0; x < size; x++) {
      const NdotV = (x + 0.5) / size;
      // Numerical integration of Charlie BRDF over hemisphere
      // E(NdotV, roughness) = ∫ D_charlie * V_ashikhmin * NdotL dω
      const nSamples = 32;
      let sum = 0;
      for (let i = 0; i < nSamples; i++) {
        for (let j = 0; j < nSamples; j++) {
          const phi = 2 * Math.PI * (i + 0.5) / nSamples;
          const cosTheta = (j + 0.5) / nSamples;
          const sinTheta = Math.sqrt(1 - cosTheta * cosTheta);
          // NdotL for this sample
          const NdotL = cosTheta;
          if (NdotL <= 0) continue;
          // Half vector NdotH (approximation for isotropic)
          // For a given V and L, H = normalize(V+L)
          // V = (sinV, 0, NdotV), L = (sinTheta*cos(phi), sinTheta*sin(phi), cosTheta)
          const sinV = Math.sqrt(1 - NdotV * NdotV);
          const Hx = sinV + sinTheta * Math.cos(phi);
          const Hy = sinTheta * Math.sin(phi);
          const Hz = NdotV + cosTheta;
          const Hlen = Math.sqrt(Hx*Hx + Hy*Hy + Hz*Hz);
          const NdotH = Hz / Math.max(Hlen, 0.0001);
          // Charlie D
          const sin2H = 1 - NdotH * NdotH;
          const D = (2 + invAlpha) / (2 * Math.PI) * Math.pow(Math.max(sin2H, 1e-6), 0.5 * invAlpha);
          // Ashikhmin V
          const V = 1 / (4 * (NdotL + NdotV - NdotL * NdotV) + 0.001);
          sum += D * V * NdotL * sinTheta;
        }
      }
      const E = sum * (2 * Math.PI / (nSamples * nSamples));
      data[y * size + x] = Math.min(Math.max(E * 255, 0), 255) | 0;
    }
  }
  sheenELut = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, sheenELut);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.LUMINANCE, size, size, 0, gl.LUMINANCE, gl.UNSIGNED_BYTE, data);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  console.log('Sheen E LUT generated');
}

function uploadBaseColorTexture(rgba, width, height) {

function uploadPbrUBO(mat) {
  pbrUboF32.fill(0);
  // base_color: vec4 at offset 0
  pbrUboF32[0] = mat.baseColor[0]; pbrUboF32[1] = mat.baseColor[1];
  pbrUboF32[2] = mat.baseColor[2]; pbrUboF32[3] = mat.baseColor[3] || 1.0;
  // metallic, roughness at offset 16, 20
  pbrUboF32[4] = mat.metallic;
  pbrUboF32[5] = mat.roughness;
  // has_base_color_tex, has_mr_tex at offset 24, 28
  pbrUboF32[6] = mat.hasBaseColorTex ? 1.0 : 0.0;
  pbrUboF32[7] = mat.hasMetallicRoughnessTex ? 1.0 : 0.0;
  // emissive_factor: vec4 at offset 32 (rgb, w=0)
  const ef = mat.emissiveFactor || [0, 0, 0];
  pbrUboF32[8] = ef[0]; pbrUboF32[9] = ef[1]; pbrUboF32[10] = ef[2]; pbrUboF32[11] = 0;
  // normal_scale at offset 48
  pbrUboF32[12] = mat.normalScale ?? 1.0;
  // has_normal_tex, has_emissive_tex, has_occlusion_tex at offset 52, 56, 60
  pbrUboF32[13] = mat.hasNormalTex ? 1.0 : 0.0;
  pbrUboF32[14] = mat.hasEmissiveTex ? 1.0 : 0.0;
  pbrUboF32[15] = mat.hasOcclusionTex ? 1.0 : 0.0;
  // occlusion_strength, alpha_cutoff, alpha_mode at offset 64, 68, 72
  pbrUboF32[16] = mat.occlusionStrength ?? 1.0;
  pbrUboF32[17] = mat.alphaCutoff ?? 0.5;
  pbrUboF32[18] = mat.alphaMode ?? 0;
  // unlit at offset 76
  pbrUboF32[19] = mat.unlit ? 1.0 : 0.0;
  // has_env_map at offset 80, env_mip_count at offset 84
  pbrUboF32[20] = envCubemap ? 1.0 : 0.0;
  pbrUboF32[21] = envMipCount;
  // sheen_color: vec4 at offset 96 (f32 index 24), w = has_sheen flag
  const sc = mat.sheenColor || [0,0,0];
  const hasSheen = (sc[0] + sc[1] + sc[2]) > 0.001;
  pbrUboF32[24] = sc[0]; pbrUboF32[25] = sc[1]; pbrUboF32[26] = sc[2];
  pbrUboF32[27] = hasSheen ? 1.0 : 0.0;
  // sheen_roughness at offset 112 (f32 index 28)
  pbrUboF32[28] = mat.sheenRoughness ?? 0.0;
  // specular_color: vec4 at offset 128 (f32 index 32), w = has_specular flag
  const spc = mat.specularColor || [1,1,1];
  const hasSpec = Math.abs(spc[0]-1) + Math.abs(spc[1]-1) + Math.abs(spc[2]-1) > 0.01;
  pbrUboF32[32] = spc[0]; pbrUboF32[33] = spc[1]; pbrUboF32[34] = spc[2];
  pbrUboF32[35] = hasSpec ? 1.0 : 0.0;
  // normal_uv_transform: vec4 at offset 144 (f32 index 36)
  const nuvs = mat.normalUvScale || [1, 1];
  const nuvo = mat.normalUvOffset || [0, 0];
  pbrUboF32[36] = nuvs[0]; pbrUboF32[37] = nuvs[1];
  pbrUboF32[38] = nuvo[0]; pbrUboF32[39] = nuvo[1];
  // normal_uv_rotation: f32 at offset 160 (f32 index 40)
  pbrUboF32[40] = mat.normalUvRotation ?? 0;
  gl.bindBuffer(gl.UNIFORM_BUFFER, pbrUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(pbrUboData));
}

// Current Möbius quaternions — updated from sliders, written into UBO.
// Identity: a=1, b=0, c=0, d=1
let mob = { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };

// Compute Möbius a,b,c,d from transform type and parameters.
function computeMobius(type, cx, cy, cz, r) {
  if (type === 'sphere_reflection' && r > 0.01) {
    const csq = cx*cx + cy*cy + cz*cz;
    return { a: [0,cx,cy,cz], b: [csq-r*r,0,0,0], c: [1,0,0,0], d: [0,-cx,-cy,-cz] };
  }
  return { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };
}

function uploadVertexUBO(mvp, mv, permParity, permIndex, useQB, camPosWS) {
  camPosWS = camPosWS || [0, 0, 5];
  vtxUboF32.set(mvp, 0);        // offset 0
  vtxUboF32.set(mv, 16);        // offset 64
  vtxUboF32[32] = permParity;   // offset 128
  vtxUboI32[33] = permIndex;    // offset 132
  vtxUboI32[34] = useQB;        // offset 136
  // _pad at offset 140 -- leave as 0
  // Möbius quaternions at offset 144 (f32 index 36)
  vtxUboF32.set(mob.a, 36);     // offset 144
  vtxUboF32.set(mob.b, 40);     // offset 160
  vtxUboF32.set(mob.c, 44);     // offset 176
  vtxUboF32.set(mob.d, 48);     // offset 192
  // camera_pos: vec4 at offset 208 (f32 index 52)
  vtxUboF32[52] = camPosWS[0];
  vtxUboF32[53] = camPosWS[1];
  vtxUboF32[54] = camPosWS[2];

  gl.bindBuffer(gl.UNIFORM_BUFFER, vtxUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(vtxUboData));
}

function uploadWireUBO(color, showDensity) {
  wireUboF32[0] = color[0];
  wireUboF32[1] = color[1];
  wireUboF32[2] = color[2];
  wireUboI32[3] = showDensity ? 1 : 0;

  gl.bindBuffer(gl.UNIFORM_BUFFER, wireUbo);
  gl.bufferSubData(gl.UNIFORM_BUFFER, 0, new Uint8Array(wireUboData));
}

function bindUBOs() {
  gl.bindBufferBase(gl.UNIFORM_BUFFER, VTX_UBO_BINDING, vtxUbo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, WIRE_UBO_BINDING, wireUbo);
  gl.bindBufferBase(gl.UNIFORM_BUFFER, PBR_UBO_BINDING, pbrUbo);
}

function bindUniformBlocks(program) {
  const vtxIdx = gl.getUniformBlockIndex(program, 'Uniforms_block_0Vertex');
  if (vtxIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(program, vtxIdx, VTX_UBO_BINDING);
  const wireIdx = gl.getUniformBlockIndex(program, 'WireUniforms_block_0Fragment');
  if (wireIdx !== gl.INVALID_INDEX) gl.uniformBlockBinding(program, wireIdx, WIRE_UBO_BINDING);
}

function initShaderPrograms(vs, fsMatcap, fsWire, fsNormals, fsPbr) {
  progMatcap = mkProg(vs, fsMatcap);
  progLod = progMatcap; // LOD uses matcap (heatmap + procedural lighting)
  progWire = mkProg(vs, fsWire);
  progNormals = mkProg(vs, fsNormals);
  if (fsPbr) {
    console.log('PBR fragment GLSL length:', fsPbr.length);
    console.log('PBR fragment first 200 chars:', fsPbr.substring(0, 200));
    progPbr = mkProg(vs, fsPbr);
    if (!gl.getProgramParameter(progPbr, gl.LINK_STATUS)) {
      console.error('PBR program link failed:', gl.getProgramInfoLog(progPbr));
      progPbr = null;
    } else {
      console.log('PBR program linked OK');
    }
    if (progPbr) bindUniformBlocks(progPbr);
    // Bind PBR UBO block
    const numBlocks = progPbr ? gl.getProgramParameter(progPbr, gl.ACTIVE_UNIFORM_BLOCKS) : 0;
    console.log(`PBR UBO blocks: ${numBlocks}`);
    for (let i = 0; i < numBlocks; i++) {
      const name = gl.getActiveUniformBlockName(progPbr, i);
      if (name && name.includes('Pbr')) {
        gl.uniformBlockBinding(progPbr, i, PBR_UBO_BINDING);
      }
    }
    // Bind all sampler uniforms to texture units.
    // naga generates combined sampler names like "_group_0_binding_N_fs"
    // where N is the WGSL @binding index. Map binding → texture unit:
    //   binding 2 → unit 0 (base_color, 2D)
    //   binding 4 → unit 1 (metallic_roughness, 2D)
    //   binding 6 → unit 2 (normal, 2D)
    //   binding 8 → unit 3 (emissive, 2D)
    //   binding 10 → unit 4 (occlusion, 2D)
    //   binding 12 → unit 5 (env_prefiltered, cubemap)
    //   binding 14 → unit 6 (env_irradiance, cubemap)
    //   binding 16 → unit 7 (sheen_e_lut, 2D)
    const bindingToUnit = { 2: 0, 4: 1, 6: 2, 8: 3, 10: 4, 12: 5, 14: 6, 16: 7 };
    gl.useProgram(progPbr);
    const numUniforms = gl.getProgramParameter(progPbr, gl.ACTIVE_UNIFORMS);
    console.log(`PBR active uniforms: ${numUniforms}`);
    let samplersBound = 0;
    for (let i = 0; i < numUniforms; i++) {
      const info = gl.getActiveUniform(progPbr, i);
      if (info && (info.type === gl.SAMPLER_2D || info.type === gl.SAMPLER_CUBE)) {
        const loc = gl.getUniformLocation(progPbr, info.name);
        const m = info.name.match(/binding_(\d+)/);
        if (m) {
          const binding = parseInt(m[1]);
          const unit = bindingToUnit[binding];
          if (unit !== undefined) {
            gl.uniform1i(loc, unit);
            samplersBound++;
            if (info.type === gl.SAMPLER_CUBE) {
              console.log(`Bound cubemap sampler: ${info.name} → unit ${unit}`);
            }
          }
        }
      }
    }
    console.log(`PBR: ${samplersBound} samplers bound, ${numUniforms} total uniforms`);
  }

  bindUniformBlocks(progMatcap);
  bindUniformBlocks(progWire);
  bindUniformBlocks(progNormals);

  // Bind matcap UBO + sampler
  if (progMatcap) {
    const numBlocks = gl.getProgramParameter(progMatcap, gl.ACTIVE_UNIFORM_BLOCKS);
    for (let i = 0; i < numBlocks; i++) {
      const name = gl.getActiveUniformBlockName(progMatcap, i);
      if (name && name.includes('Matcap')) {
        gl.uniformBlockBinding(progMatcap, i, MATCAP_UBO_BINDING);
      }
    }
    // Bind matcap sampler to texture unit 0
    gl.useProgram(progMatcap);
    const numU = gl.getProgramParameter(progMatcap, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < numU; i++) {
      const info = gl.getActiveUniform(progMatcap, i);
      if (info && info.type === gl.SAMPLER_2D) {
        const loc = gl.getUniformLocation(progMatcap, info.name);
        gl.uniform1i(loc, 0);
      }
    }
  }

  shadersLoaded = true;
  console.log('Shader programs compiled from WGSL pipeline (matcap + wire + normals + pbr)');
}
let matcapTex = null;
const MATCAP_UBO_BINDING = 3;
const matcapUbo = gl.createBuffer();
gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
gl.bufferData(gl.UNIFORM_BUFFER, 16, gl.DYNAMIC_DRAW);
const matcapUboData = new Float32Array(4); // has_matcap_tex + 3 pads

function loadMatcap(name) {
  const img = new Image();
  img.onload = () => {
    if (matcapTex) gl.deleteTexture(matcapTex);
    matcapTex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    console.log('Matcap loaded:', name, img.width + 'x' + img.height);
    render();
  };
  img.src = '/matcaps/' + name + '.png';
}

// --- LOD color ---
function lodColor(lod) {
  const maxLod = Math.max(...lod);
  const logLod = Math.log2(Math.max(maxLod, 1));
  const t = Math.min(logLod / 8.0, 1.0);
  const h = (1.0 - t) * 270;
  const s = 0.85, l = 0.55;
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60)%2 - 1));
  const m = l - c/2;
  let r,g,b;
  if (h<60){r=c;g=x;b=0;} else if(h<120){r=x;g=c;b=0;} else if(h<180){r=0;g=c;b=x;}
  else if(h<240){r=0;g=x;b=c;} else if(h<300){r=x;g=0;b=c;} else{r=c;g=0;b=x;}
  return [r+m, g+m, b+m];
}

// --- Draw state ---
let drawBatches = [];
let globalMaxLogLod = 1;
let vaoOrigMesh = null, numOrigInst = 0;
const ORIG_BARY = new Float32Array([1,0,0, 0,1,0, 0,0,1]);
const ORIG_LINES = new Uint32Array([0,1, 1,2, 2,0]);
const tessCache = new Map();
const vaoCache = new Map();

function makeVAO(baryData, idxData, instanceData) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const bb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bb);
  gl.bufferData(gl.ARRAY_BUFFER, baryData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);
  for (let i=0;i<13;i++) {
    gl.enableVertexAttribArray(1+i);
    gl.vertexAttribPointer(1+i,4,gl.FLOAT,false,208,i*16);
    gl.vertexAttribDivisor(1+i,1);
  }
  const eb = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxData, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return vao;
}

function getTessBuffers(batch) {
  const key = batch.wanted_lod.join(',') + '/' + (batch.perm_index || 0);
  if (tessCache.has(key)) return tessCache.get(key);
  if (!batch.tess_bary.length) return null;

  const bary = new Float32Array(batch.tess_bary);
  const tris = batch.tess_triangles;
  const lines = [];
  for (let i = 0; i < tris.length; i += 3) lines.push(tris[i],tris[i+1], tris[i+1],tris[i+2], tris[i+2],tris[i]);

  const baryBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, baryBuf);
  gl.bufferData(gl.ARRAY_BUFFER, bary, gl.STATIC_DRAW);
  const lineIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, lineIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(lines), gl.STATIC_DRAW);
  const triIdxBuf = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, triIdxBuf);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(tris), gl.STATIC_DRAW);

  const entry = { baryBuf, lineIdxBuf, triIdxBuf, numLineIdx: lines.length, numTriIdx: tris.length };
  tessCache.set(key, entry);
  return entry;
}

function getOrCreateBatchVAOs(tessKey, tessBufs, instanceData, numInstances) {
  let entry = vaoCache.get(tessKey);
  const dataF32 = new Float32Array(instanceData);

  if (entry) {
    gl.bindBuffer(gl.ARRAY_BUFFER, entry.instanceBuf);
    if (dataF32.byteLength <= entry.instanceBufSize) {
      gl.bufferSubData(gl.ARRAY_BUFFER, 0, dataF32);
    } else {
      gl.bufferData(gl.ARRAY_BUFFER, dataF32, gl.DYNAMIC_DRAW);
      entry.instanceBufSize = dataF32.byteLength;
    }
    entry.numInst = numInstances;
    return entry;
  }

  const instanceBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
  gl.bufferData(gl.ARRAY_BUFFER, dataF32, gl.DYNAMIC_DRAW);

  function makeVAOWithIdx(idxBuf) {
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    gl.bindBuffer(gl.ARRAY_BUFFER, tessBufs.baryBuf);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, instanceBuf);
    for (let i = 0; i < 13; i++) {
      gl.enableVertexAttribArray(1+i);
      gl.vertexAttribPointer(1+i, 4, gl.FLOAT, false, 208, i*16);
      gl.vertexAttribDivisor(1+i, 1);
    }
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf);
    gl.bindVertexArray(null);
    return vao;
  }

  entry = {
    lineVao: makeVAOWithIdx(tessBufs.lineIdxBuf),
    triVao: makeVAOWithIdx(tessBufs.triIdxBuf),
    instanceBuf,
    instanceBufSize: dataF32.byteLength,
    numInst: numInstances,
  };
  vaoCache.set(tessKey, entry);
  return entry;
}

function uploadBatches(data) {
  const usedKeys = new Set();
  drawBatches = [];

  // Original mesh wireframe
  const allOrig = [];
  for (const batch of data.batches) {
    for (let i = 0; i < batch.instances_orig.length; i++) allOrig.push(batch.instances_orig[i]);
  }
  numOrigInst = data.total_faces;
  if (!vaoOrigMesh) {
    vaoOrigMesh = makeVAO(ORIG_BARY, ORIG_LINES, new Float32Array(allOrig));
  } else {
    gl.bindVertexArray(vaoOrigMesh);
    const origBuf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, origBuf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(allOrig), gl.DYNAMIC_DRAW);
    for (let i = 0; i < 13; i++) {
      gl.enableVertexAttribArray(1+i);
      gl.vertexAttribPointer(1+i, 4, gl.FLOAT, false, 208, i*16);
      gl.vertexAttribDivisor(1+i, 1);
    }
    gl.bindVertexArray(null);
  }

  globalMaxLogLod = 1;
  for (const batch of data.batches) {
    const m = Math.max(...batch.lod);
    globalMaxLogLod = Math.max(globalMaxLogLod, Math.log2(Math.max(m, 1)));
  }

  let totalRendered = 0, totalSkipped = 0;
  for (const batch of data.batches) {
    const tess = getTessBuffers(batch);
    if (!tess) { totalSkipped += batch.num_faces; continue; }
    totalRendered += batch.num_faces;
    const matSuffix = (batch.material_index != null && batch.material_index >= 0) ? '/m' + batch.material_index : '';
    const vaoKey = batch.wanted_lod.join(',') + '/' + batch.perm_index + matSuffix;
    usedKeys.add(vaoKey);
    // GPU-ready: original positions (GPU applies Möbius), LODs from CPU xform pass
    const gpuData = new Float32Array(batch.instances_orig);
    const xf = batch.instances_xform;
    for (let i = 0; i < batch.num_faces; i++) {
      const base = i * 52;
      for (let j = 24; j < 32; j++) gpuData[base+j] = xf[base+j];
    }
    const cached = getOrCreateBatchVAOs(vaoKey, tess, gpuData, batch.num_faces);

    drawBatches.push({
      vaoXform: cached.lineVao,
      vaoXformTri: cached.triVao,
      numLineIdx: tess.numLineIdx,
      numTriIdx: tess.numTriIdx,
      numInst: batch.num_faces,
      lod: batch.lod,
      color: lodColor(batch.lod),
      parity: batch.perm_parity || 1,
      permIndex: batch.perm_index || 0,
      materialIndex: batch.material_index ?? -1,
    });
  }

  // Sort batches: opaque first, then alpha-mask, then blend.
  // This ensures transparent materials render after opaque ones.
  drawBatches.sort((a, b) => {
    const am = getMaterialParams(a.materialIndex).alphaMode;
    const bm = getMaterialParams(b.materialIndex).alphaMode;
    return am - bm;
  });
}

// --- Matrix math ---
function perspective(fov,a,n,f){const t=1/Math.tan(fov*.5),r=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,n*f*r*2,0]);}
function lookAt(ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux,sl=Math.hypot(sx,sy,sz);sx/=sl;sy/=sl;sz/=sl;let ux2=sy*fz-sz*fy,uy2=sz*fx-sx*fz,uz2=sx*fy-sy*fx;return new Float32Array([sx,ux2,-fx,0,sy,uy2,-fy,0,sz,uz2,-fz,0,-(sx*ex+sy*ey+sz*ez),-(ux2*ex+uy2*ey+uz2*ez),fx*ex+fy*ey+fz*ez,1]);}
function mulM4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}

// --- Render ---
function render() {
  const w=$('wrap');
  canvas.width=w.clientWidth; canvas.height=w.clientHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
  if (!shadersLoaded || !drawBatches.length) return;
  gl.clearColor(0.051,0.067,0.090,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const camPos = [ex, ey, ez];
  const view = lookAt(ex,ey,ez,0,0,0,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.01,10000);
  const mvp = mulM4(proj, view);

  // Bind UBOs to their binding points
  bindUBOs();

  const drawWire = renderMode === 'wire' || renderMode === 'both';
  const drawLod = renderMode === 'lod' || renderMode === 'both';
  const drawMatcap = renderMode === 'matcap';
  const drawNormals = renderMode === 'normals';
  const drawPbr = renderMode === 'pbr';

  // PBR pass — per-material draw calls
  if (drawPbr && progPbr) {
    gl.useProgram(progPbr);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, PBR_UBO_BINDING, pbrUbo);
    if (!window._pbrPlaceholder) window._pbrPlaceholder = createPlaceholderTexture();
    const placeholder = window._pbrPlaceholder;
    let lastMaterialIndex = -999;
    for (const b of drawBatches) {
      if (b.materialIndex !== lastMaterialIndex) {
        lastMaterialIndex = b.materialIndex;
        const mat = getMaterialParams(b.materialIndex);

        // Resolve texture objects for each PBR map
        const resolve = (idx) => (idx != null && idx >= 0 && loadedTextures[idx]) ? loadedTextures[idx].glTexture : null;
        const bcTex = resolve(mat.baseColorTextureIndex);
        const mrTex = resolve(mat.metallicRoughnessTextureIndex);
        const nmTex = resolve(mat.normalTextureIndex);
        const emTex = resolve(mat.emissiveTextureIndex);
        const aoTex = resolve(mat.occlusionTextureIndex);

        // Upload expanded UBO
        uploadPbrUBO({
          baseColor: mat.baseColor, metallic: mat.metallic, roughness: mat.roughness,
          hasBaseColorTex: !!bcTex, hasMetallicRoughnessTex: !!mrTex,
          emissiveFactor: mat.emissiveFactor, normalScale: mat.normalScale,
          hasNormalTex: !!nmTex, hasEmissiveTex: !!emTex, hasOcclusionTex: !!aoTex,
          occlusionStrength: mat.occlusionStrength, alphaCutoff: mat.alphaCutoff,
          alphaMode: mat.alphaMode, unlit: mat.unlit,
          sheenColor: mat.sheenColor, sheenRoughness: mat.sheenRoughness,
          specularColor: mat.specularColor,
          normalUvScale: mat.normalUvScale, normalUvOffset: mat.normalUvOffset,
          normalUvRotation: mat.normalUvRotation,
        });

        // Face culling disabled globally — Möbius transforms can flip face
        // winding, and the shader already handles two-sided normals.
        // TODO: enable culling for single-sided materials when no conformal
        // transform is active (would need to know current transform type).
        gl.disable(gl.CULL_FACE);

        // Bind material textures to units 0-4 (placeholder for missing maps)
        const texBindings = [bcTex, mrTex, nmTex, emTex, aoTex];
        for (let ti = 0; ti < 5; ti++) {
          gl.activeTexture(gl.TEXTURE0 + ti);
          gl.bindTexture(gl.TEXTURE_2D, texBindings[ti] || placeholder);
        }
        // Bind environment cubemaps to units 5-6, sheen LUT to unit 7
        if (envCubemap) {
          gl.activeTexture(gl.TEXTURE5);
          gl.bindTexture(gl.TEXTURE_CUBE_MAP, envCubemap);
          gl.activeTexture(gl.TEXTURE6);
          gl.bindTexture(gl.TEXTURE_CUBE_MAP, envIrradiance);
        }
        if (sheenELut) {
          gl.activeTexture(gl.TEXTURE7);
          gl.bindTexture(gl.TEXTURE_2D, sheenELut);
        }
      }
      uploadVertexUBO(mvp, view, b.parity, 0, 1, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Original mesh wireframe (identity Möbius — shows untransformed mesh)
  if (drawWire && vaoOrigMesh) {
    const savedMob = mob;
    mob = { a: [1,0,0,0], b: [0,0,0,0], c: [0,0,0,0], d: [1,0,0,0] };
    gl.useProgram(progWire);
    uploadVertexUBO(mvp, view, 1.0, 0, 0, camPos);
    uploadWireUBO([0.25, 0.25, 0.35], false);
    gl.bindVertexArray(vaoOrigMesh);
    gl.drawElementsInstanced(gl.LINES, 6, gl.UNSIGNED_INT, 0, numOrigInst);
    mob = savedMob;
  }

  // Matcap pass
  if (drawMatcap) {
    gl.useProgram(progMatcap);
    // Matcap UBO: has_matcap_tex flag
    matcapUboData[0] = matcapTex ? 1.0 : 0.0;
    gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, matcapUboData);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, MATCAP_UBO_BINDING, matcapUbo);
    // Bind matcap texture
    if (matcapTex) {
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, matcapTex);
    }
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, 0, 1, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // LOD pass (density heatmap — force matcap texture off)
  if (drawLod) {
    gl.useProgram(progLod);
    matcapUboData[0] = 0.0; // has_matcap_tex = false → use heatmap
    gl.bindBuffer(gl.UNIFORM_BUFFER, matcapUbo);
    gl.bufferSubData(gl.UNIFORM_BUFFER, 0, matcapUboData);
    gl.bindBufferBase(gl.UNIFORM_BUFFER, MATCAP_UBO_BINDING, matcapUbo);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, 0, 1, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Wire pass
  if (drawWire) {
    gl.useProgram(progWire);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, 0, 1, camPos);
      uploadWireUBO(b.color, true);
      gl.bindVertexArray(b.vaoXform);
      gl.drawElementsInstanced(gl.LINES, b.numLineIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  // Normals pass
  if (drawNormals) {
    gl.useProgram(progNormals);
    for (const b of drawBatches) {
      uploadVertexUBO(mvp, view, b.parity, 0, 1, camPos);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_INT, 0, b.numInst);
    }
  }

  gl.bindVertexArray(null);
}

// --- Slice + transform ---
function getTransformParams() {
  const mx = parseInt($('mx').value)/10;
  const my = parseInt($('my').value)/10;
  const mz = parseInt($('mz').value)/10;
  const mr = parseInt($('mr').value)/10;
  $('mx-v').textContent = mx.toFixed(1);
  $('my-v').textContent = my.toFixed(1);
  $('mz-v').textContent = mz.toFixed(1);
  $('mr-v').textContent = mr.toFixed(1);
  return { mx, my, mz, mr };
}

function getSliceNormal() {
  const tilt = parseFloat($('tilt').value);
  let dir = 'x';
  document.querySelectorAll('#dir-btns .a').forEach(b => { dir = b.dataset.v; });
  const sinT = Math.sin(tilt), cosT = Math.cos(tilt);
  if (dir === 'x') return [sinT, 0, 0, cosT];
  if (dir === 'y') return [0, sinT, 0, cosT];
  return [0, 0, sinT, cosT];
}

let lodDebounce = null;

// Debounced update: render immediately with current data, recompute async.
function updateDebounced() {
  render();
  clearTimeout(lodDebounce);
  lodDebounce = setTimeout(update, 150);
}

// Möbius-only update: just recompute uniforms + render. No worker.
function updateMobius() {
  const { mx, my, mz, mr } = getTransformParams();
  const tType = currentXform === 'sphere_reflection' ? 'sphere_reflection' : 'identity';
  mob = computeMobius(tType, mx, my, mz, mr);
  render();
}

async function update() {
  if (!workerReady || !meshInfo) return;
  if (updating) { pendingUpdate = true; return; }
  updating = true;

  const timeOffset = parseFloat($('time').value);
  const normal = getSliceNormal();
  const cosT = normal[3];
  const offset = timeOffset * cosT;

  const { mx, my, mz, mr } = getTransformParams();
  const resVal = parseInt($('res').value);
  const res = resVal === 0 ? 0 : (1 << resVal);
  $('res-v').textContent = res === 0 ? 'auto' : res;

  // VP matrix for screen-space LOD
  const w=$('wrap');
  const vpW = w.clientWidth || 800, vpH = w.clientHeight || 600;
  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const vpMatrix = mulM4(perspective(Math.PI/3, vpW/vpH, 0.1, 100), lookAt(ex,ey,ez,0,0,0,0,1,0));

  const tType = currentXform === 'identity' ? 'identity' :
                currentXform === 'sphere_reflection' ? (mr > 0.01 ? 'sphere_reflection' : 'identity') :
                currentXform;
  mob = computeMobius(tType, mx, my, mz, mr);

  const spacetimeOn = $('spacetime-toggle').classList.contains('on');

  // The worldsheet is a hypertorus. Time slider controls the angle of the
  // hyperplane in the torus (w,z) plane — like rotating a knife through a donut.
  // θ = 2π·t/period maps the time slider to the torus angle.
  const period = meshInfo ? (meshInfo.time_max - meshInfo.time_min) : 2.0;
  const theta = 2.0 * Math.PI * timeOffset / period;

  const toroidalOn = $('toroidal-toggle').classList.contains('on');
  let effectiveNormal, effectiveOffset;

  if (rotateNormalOverride) {
    effectiveNormal = rotateNormalOverride;
    effectiveOffset = 0;
    rotateNormalOverride = null;
  } else if (toroidalOn) {
    // Toroidal: rotate the hyperplane in the torus (w,z) plane
    if (spacetimeOn) {
      const tilt = parseFloat($('tilt').value);
      let dir = 'x';
      document.querySelectorAll('#dir-btns .a').forEach(b => { dir = b.dataset.v; });
      const sinTilt = Math.sin(tilt), cosTilt = Math.cos(tilt);
      const nw = Math.cos(theta) * cosTilt;
      const nz = Math.sin(theta) * cosTilt;
      const nx = dir === 'x' ? sinTilt : 0;
      const ny = dir === 'y' ? sinTilt : 0;
      effectiveNormal = [nx, ny, nz, nw];
      effectiveOffset = 0;
    } else {
      effectiveNormal = [0, 0, Math.sin(theta), Math.cos(theta)];
      effectiveOffset = 0;
    }
  } else {
    // Linear time: simple time slice or tilted slice
    if (spacetimeOn) {
      effectiveNormal = normal;
      effectiveOffset = offset;
    } else {
      // Classic: pure time slice at the slider value
      effectiveNormal = [0, 0, 0, 1];
      effectiveOffset = timeOffset;
    }
  }


  const t0 = performance.now();
  const resp = await workerCall('slice_and_transform', {
    normal: Array.from(effectiveNormal),
    offset: effectiveOffset,
    transformType: tType,
    toroidal: $('toroidal-toggle').classList.contains('on'),
    params: [mx, my, mz, mr],
    overrideRes: res,
    vpMatrix: Array.from(vpMatrix),
    vpWidth: vpW,
    vpHeight: vpH,
  });
  const ms = performance.now() - t0;
  const data = resp.result;

  if (data && data.batches) {
    uploadBatches(data);
    render();

    const totalTris = data.batches.reduce((s,b) => s + b.num_faces * b.tris_per_face, 0);
    const totalVerts = data.batches.reduce((s,b) => s + b.num_faces * b.verts_per_face, 0);
    const matCount = loadedMaterials.length;
    $('stats').innerHTML =
      `Faces: <span class="val">${data.total_faces}</span><br>` +
      `Batches: <span class="val">${data.num_batches}</span>` +
      (matCount > 1 ? ` (${matCount} mats)` : '') + `<br>` +
      `Tris: <span class="val">${totalTris}</span><br>` +
      `Verts: <span class="val">${totalVerts}</span><br>` +
      `Slice+Xform: <span class="val">${ms.toFixed(0)}ms</span>`;

    // Background generation of missing patches
    const fallbacks = data.batches.filter(b => b.is_fallback);
    if (fallbacks.length > 0) {
      const missing = [...new Set(fallbacks.map(b => b.wanted_lod.join(',')))];
      for (const key of missing) {
        const [a,b,c] = key.split(',').map(Number);
        if (a > 512 || b > 512 || c > 512) continue;
        workerCall('generate_single', { a, b, c }).then(() => {
          if (!updating && !pendingUpdate) update();
        });
      }
    }
  }

  updating = false;
  if (pendingUpdate) { pendingUpdate = false; update(); }
}

// --- Mouse orbit ---
let drag=false, lx=0, ly=0;
canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
onmouseup = () => drag=false;
let camDebounce = null;
onmousemove = e => { if(!drag)return; rotY+=(e.clientX-lx)*0.01; rotX+=(e.clientY-ly)*0.01; lx=e.clientX; ly=e.clientY; render(); clearTimeout(camDebounce); camDebounce=setTimeout(update, 150); };
canvas.onwheel = e => { zoom *= e.deltaY>0 ? 1.1 : 0.9; zoom=Math.max(1,Math.min(100,zoom)); render(); update(); e.preventDefault(); };

// Touch support
let lastTouch = null;
canvas.addEventListener('touchstart', e => { if (e.touches.length===1) lastTouch=[e.touches[0].clientX,e.touches[0].clientY]; });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length===1 && lastTouch) {
    const dx=e.touches[0].clientX-lastTouch[0], dy=e.touches[0].clientY-lastTouch[1];
    lastTouch=[e.touches[0].clientX,e.touches[0].clientY];
    rotY+=dx*0.005; rotX+=dy*0.005;
    rotX=Math.max(-Math.PI/2+0.01,Math.min(Math.PI/2-0.01,rotX));
    render();
  }
}, { passive: false });
canvas.addEventListener('touchend', () => { lastTouch=null; });
onresize = render;

$('variant-sel').addEventListener('change', () => {
  const vi = parseInt($('variant-sel').value);
  if (!window._baseFaceMaterials || !window._variantMappings) return;
  // Build new face material array: start from base, apply variant swaps
  const faceMats = [...window._baseFaceMaterials];
  if (vi >= 0) {
    // Collect which default materials get swapped to what
    const swapMap = new Map();
    for (const m of window._variantMappings) {
      if (m.variants && m.variants.includes(vi)) {
        // This mapping says: for variant vi, use material m.material
        // We need to know which faces to apply this to.
        // The mapping applies to faces whose default material is any of the
        // materials listed in OTHER variant mappings for the same primitive.
        // Simplification: build a set of all materials involved in variant mappings
        swapMap.set(m.material, true);
      }
    }
    // For variant vi, find the target material
    let targetMat = -1;
    for (const m of window._variantMappings) {
      if (m.variants && m.variants.includes(vi)) {
        targetMat = m.material;
        break;
      }
    }
    if (targetMat >= 0) {
      // Collect all materials that are variant alternatives (including the default)
      const allVariantMats = new Set();
      for (const m of window._variantMappings) {
        allVariantMats.add(m.material);
      }
      // Also add the default material for the variant primitive
      // (the one assigned when no variant is selected)
      const defaultMat = window._baseFaceMaterials.find(m => allVariantMats.has(m));
      if (defaultMat !== undefined) allVariantMats.add(defaultMat);
      // Swap all faces using any variant material to the target
      for (let fi = 0; fi < faceMats.length; fi++) {
        if (allVariantMats.has(faceMats[fi])) {
          faceMats[fi] = targetMat;
        }
      }
    }
  }
  // Send updated face materials to worker
  workerCall('set_face_materials', { materials: faceMats }).then(() => update());
});

// Animation loop — rotates the hyperplane tilt angle instead of sweeping time.
// This keeps the slice centered in the periodic region for clean wrapping.
let animPhase = 0;
function frame() {
  if (animating && meshInfo) {
    const rotateMode = $('rotate-mode-toggle').classList.contains('on');
    if (rotateMode) {
      // 4D double rotation: apply two rotations in user-selected planes
      const speed = parseFloat($('rot-speed').value) / 2000;
      animPhase += speed;
      const ratio = parseFloat($('rot-ratio').value) / 100;
      const p1 = animPhase;
      const p2 = animPhase * ratio;

      // Get selected planes
      let plane1 = 'xt', plane2 = 'yt';
      document.querySelectorAll('#plane1-btns .active').forEach(b => { plane1 = b.dataset.v; });
      document.querySelectorAll('#plane2-btns .active').forEach(b => { plane2 = b.dataset.v; });

      // A 2-plane rotation matrix acts on a 4-vector.
      // Start with (0,0,0,1) and apply both rotations.
      function rot4(n, plane, angle) {
        const c = Math.cos(angle), s = Math.sin(angle);
        let [x,y,z,t] = n;
        switch(plane) {
          case 'xt': return [c*x+s*t, y, z, -s*x+c*t];
          case 'yt': return [x, c*y+s*t, z, -s*y+c*t];
          case 'zt': return [x, y, c*z+s*t, -s*z+c*t];
          case 'xy': return [c*x+s*y, -s*x+c*y, z, t];
          case 'xz': return [c*x+s*z, y, -s*x+c*z, t];
          case 'yz': return [x, c*y+s*z, -s*y+c*z, t];
          default: return n;
        }
      }

      let n = [0, 0, 0, 1]; // start with pure time normal
      n = rot4(n, plane1, p1);
      n = rot4(n, plane2, p2);
      rotateNormalOverride = n;
    } else {
      // Sweep time forward
      const slider = $('time');
      let val = parseFloat(slider.value);
      const speed = 0.003 * (meshInfo.time_max - meshInfo.time_min);
      val += speed;
      if (val >= meshInfo.time_max) { val = meshInfo.time_min + (val - meshInfo.time_max) + 0.001; }
      slider.value = val;
      $('time-v').textContent = val.toFixed(2);
    }
    update();
  }
  render();
  requestAnimationFrame(frame);
}

// --- glTF/GLB file loading ---
async function loadGltfFromBuffer(buffer, filename) {
  $('stats').innerHTML = `Loading <span class="val">${filename || 'glTF'}</span>...`;
  // Deselect built-in shape buttons
  document.querySelectorAll('#shape-btns button').forEach(b => b.classList.remove('a'));

  const resp = await workerCall('load_gltf_data', { bytes: buffer });
  const info = resp.result;
  if (!info || info.num_faces === 0) {
    $('stats').innerHTML = 'Failed to load glTF — check console';
    return;
  }
  meshInfo = info;
  currentShape = '__gltf__';
  const timeSlider = $('time');
  timeSlider.min = info.time_min;
  timeSlider.max = info.time_max;
  timeSlider.step = (info.time_max - info.time_min) / 200;
  timeSlider.value = (info.time_min + info.time_max) / 2;
  $('time-v').textContent = parseFloat(timeSlider.value).toFixed(2);

  // Create WebGL textures and resolve materials
  createTexturesFromGltf(info.textures, info.materials);

  const numMats = info.materials ? info.materials.length : 0;
  const numTexs = info.textures ? info.textures.length : 0;
  console.log(`glTF loaded: ${numMats} materials, ${numTexs} textures`);

  // KHR_materials_variants: populate variant selector
  const variantSel = $('variant-sel');
  variantSel.innerHTML = '<option value="-1">Default</option>';
  const variantNames = info.variant_names || [];
  const variantMappings = info.variant_mappings || [];
  if (variantNames.length > 0) {
    for (let i = 0; i < variantNames.length; i++) {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = variantNames[i];
      variantSel.appendChild(opt);
    }
    variantSel.style.display = '';
    // Store mappings + original face materials for variant switching
    window._variantMappings = variantMappings;
    window._baseFaceMaterials = info.face_material_indices ? Array.from(info.face_material_indices) : [];
  } else {
    variantSel.style.display = 'none';
  }

  // Clear GPU caches
  tessCache.clear();
  vaoCache.clear();
  vaoOrigMesh = null;
  animDir = 1;
  $('stats').innerHTML =
    `Loaded <span class="val">${filename || 'glTF'}</span><br>` +
    `Verts: <span class="val">${info.num_vertices}</span> Faces: <span class="val">${info.num_faces}</span>` +
    (numMats > 1 ? `<br>Materials: <span class="val">${numMats}</span>` : '');
  await update();
}

  const file = e.target.files[0];
  if (!file) return;
  const buffer = await file.arrayBuffer();

});

// Drag and drop on the canvas wrap
const wrapEl = $('wrap');
const dropOverlay = $('drop-overlay');
let dragCounter = 0;

wrapEl.addEventListener('dragenter', (e) => {
  e.preventDefault();
  dragCounter++;
  dropOverlay.classList.add('active');
});
wrapEl.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});
wrapEl.addEventListener('dragleave', (e) => {
  e.preventDefault();
  dragCounter--;
  if (dragCounter <= 0) {
    dragCounter = 0;
    dropOverlay.classList.remove('active');
  }
});
wrapEl.addEventListener('drop', async (e) => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  if (!file.name.match(/\.glb$/i) && !file.name.match(/\.gltf$/i)) {
    $('stats').innerHTML = 'Drop a .glb or .gltf file';
    return;
  }
  const buffer = await file.arrayBuffer();
  await loadGltfFromBuffer(buffer, file.name);
});
