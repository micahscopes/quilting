[build]
target = "hyperscope.html"
dist = "dist"

[serve]
port = 8093

[watch]
watch = [
    "hyperscope.html",
    "hyperscope_worker.js",
    "spacemouse.mjs",
    "hyperscope_focus.mjs",
    "local_peer_browser.mjs",
    "asset_effect_host.mjs",
    "horse.glb",
    "ant.glb",
    "envmaps/",
    "examples/polytopes/",
    "examples/hyperscape-blender-demo.glb",
    "crates/hyperscape/fixtures/hacker-night.presentation.json",
    "ASSET_ATTRIBUTION.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
    "Cargo.lock",
    "crates/",
]

# Build WASM before trunk processes the HTML
[[hooks]]
stage = "pre_build"
command = "bash"
command_arguments = ["scripts/build-hyperscope-wasm.sh"]

[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "--quiet", "-p", "hyperscape", "--bin", "hyperscope-build-receipt"]
