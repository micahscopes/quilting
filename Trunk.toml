[build]
target = "hyperscope.html"
dist = "dist"

[serve]
port = 8093

[watch]
watch = [
    "hyperscope.html",
    "hyperscope_worker.js",
    "spacemouse.mjs",
    "hyperscope_focus.mjs",
    "horse.glb",
    "ant.glb",
    "envmaps/",
    "matcaps/",
    "examples/hyperscape-blender-demo.glb",
    "examples/hacker-night.presentation.json",
    "ASSET_ATTRIBUTION.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "crates/quilting-wasm/src/",
    "crates/quilting-core/src/",
    "crates/quilting-renderer/src/",
    "crates/quilting-shaders/shaders/",
]

# Build WASM before trunk processes the HTML
[[hooks]]
stage = "pre_build"
command = "wasm-pack"
command_arguments = ["build", "--target", "web", "--out-dir", "../../pkg", "crates/quilting-wasm"]
