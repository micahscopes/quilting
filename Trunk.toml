[build]
target = "hyperscope.html"
dist = "dist"

[serve]
port = 8093

[watch]
watch = [
    "hyperscope.html",
    "hyperscope_worker.js",
    "spacemouse.mjs",
    "hyperscope_focus.mjs",
    "horse.glb",
    "ant.glb",
    "envmaps/",
    "examples/hyperscape-blender-demo.glb",
    "examples/hacker-night.presentation.json",
    "ASSET_ATTRIBUTION.md",
    "LICENSE-MIT",
    "LICENSE-APACHE",
    "Cargo.toml",
    "Cargo.lock",
    "crates/",
]

# Build WASM before trunk processes the HTML
[[hooks]]
stage = "pre_build"
command = "wasm-pack"
command_arguments = ["build", "--target", "web", "--out-dir", "../../pkg", "crates/quilting-wasm"]

[[hooks]]
stage = "pre_build"
command = "cargo"
command_arguments = ["run", "--quiet", "-p", "hyperscape", "--bin", "hyperscope-build-receipt"]
