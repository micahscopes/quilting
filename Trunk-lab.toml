[build]
target = "remesh-lab.html"
dist = "dist-lab"

[serve]
port = 9090

[watch]
watch = [
    "remesh-lab.html",
    "crates/quilting-wasm/src/",
    "crates/quilting-remesh/src/",
]

[[hooks]]
stage = "pre_build"
command = "wasm-pack"
command_arguments = ["build", "--target", "web", "--out-dir", "../../pkg", "crates/quilting-wasm"]
