<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quilting — Conformal Mesh (WASM)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'SF Mono','Consolas',monospace;background:#1a1a2e;color:#e0e0e0;display:flex;height:100vh;overflow:hidden}
#sidebar{width:240px;padding:16px;background:#16213e;border-right:1px solid #0f3460;display:flex;flex-direction:column;gap:12px;flex-shrink:0;overflow-y:auto}
h1{font-size:16px;color:#e94560;letter-spacing:2px}
label{font-size:11px;color:#8899aa;text-transform:uppercase;letter-spacing:1px}
.sr{display:flex;align-items:center;gap:6px}
input[type=range]{flex:1;accent-color:#e94560}
.v{font-size:13px;min-width:36px;text-align:right;color:#e94560;font-weight:bold}
.btns{display:flex;gap:3px}
.btns button{flex:1;padding:5px;font-size:10px;font-family:inherit;border:1px solid #0f3460;background:transparent;color:#8899aa;cursor:pointer;border-radius:3px}
.btns button.a{background:#e94560;color:#fff;border-color:#e94560}
.stats{font-size:10px;color:#556677;line-height:1.5;margin-top:auto;padding-top:12px;border-top:1px solid #0f3460}
#wrap{flex:1;position:relative}
#cv{position:absolute;top:0;left:0;width:100%;height:100%}
</style>
</head>
<body>
<div id="sidebar">
  <h1>QUILTING</h1>
  <p style="font-size:10px;color:#556677">WASM — all computation in browser</p>
  <div><label>Shape</label>
    <div class="btns" id="shape-btns">
      <button class="a" data-v="cube">Cube</button>
      <button data-v="tetrahedron">Tet</button>
      <button data-v="octahedron">Oct</button>
      <button data-v="icosahedron">Ico</button>
    </div>
  </div>
  <div><label>Render</label>
    <div class="btns" id="render-btns">
      <button class="a" data-v="matcap">Matcap</button>
      <button data-v="wire">Wire</button>
      <button data-v="both">Both</button>
    </div>
  </div>
  <div><label>Resolution (0=auto)</label>
    <div class="sr"><input type="range" id="res" min="0" max="6" value="0"><span class="v" id="res-v">auto</span></div>
  </div>
  <div><label>Sphere X</label>
    <div class="sr"><input type="range" id="sx" min="-30" max="30" value="5"><span class="v" id="sx-v">0.5</span></div>
  </div>
  <div><label>Sphere Y</label>
    <div class="sr"><input type="range" id="sy" min="-30" max="30" value="0"><span class="v" id="sy-v">0.0</span></div>
  </div>
  <div><label>Sphere Z</label>
    <div class="sr"><input type="range" id="sz" min="-30" max="30" value="0"><span class="v" id="sz-v">0.0</span></div>
  </div>
  <div><label>Sphere radius</label>
    <div class="sr"><input type="range" id="sr" min="0" max="50" value="20"><span class="v" id="sr-v">2.0</span></div>
  </div>
  <div class="stats" id="stats">Loading WASM...</div>
</div>
<div id="wrap"><canvas id="cv"></canvas></div>
<script type="module">
import init, { get_shape, compute_mesh_batches } from './pkg/quilting_wasm.js';

const $=s=>document.getElementById(s);
const canvas=$('cv');
const gl=canvas.getContext('webgl2',{antialias:true});

let shape='cube', rotX=0.3, rotY=0.5, zoom=5;
let renderMode = 'matcap';
let shapeData = null, wasmReady = false;

const VS = `#version 300 es
layout(location=0) in vec3 a_bary;
layout(location=1) in vec4 a_p0;
layout(location=2) in vec4 a_p1;
layout(location=3) in vec4 a_p2;
layout(location=4) in vec4 a_w0;
layout(location=5) in vec4 a_w1;
layout(location=6) in vec4 a_w2;
uniform mat4 u_mvp;
uniform mat4 u_mv;
uniform int u_useQB;
uniform vec3 u_edgeLod; // edge resolutions for this batch (a, b, c)

out vec3 v_normal_vs;
out float v_density;  // interpolated density from edge-based formula

vec4 qm(vec4 a, vec4 b) {
  return vec4(
    a.x*b.x-a.y*b.y-a.z*b.z-a.w*b.w,
    a.x*b.y+a.y*b.x+a.z*b.w-a.w*b.z,
    a.x*b.z-a.y*b.w+a.z*b.x+a.w*b.y,
    a.x*b.w+a.y*b.z-a.z*b.y+a.w*b.x);
}
vec4 qinv(vec4 q) { float d=dot(q,q); return d<1e-20 ? vec4(1e10,0,0,0) : vec4(q.x,-q.yzw)/d; }

vec3 evalQB(vec3 bary, vec4 p0,vec4 p1,vec4 p2, vec4 w0,vec4 w1,vec4 w2) {
  vec4 top = bary.x*qm(p0,w0) + bary.y*qm(p1,w1) + bary.z*qm(p2,w2);
  vec4 bot = bary.x*w0 + bary.y*w1 + bary.z*w2;
  return qm(top, qinv(bot)).yzw;
}

vec3 evalFlat(vec3 bary, vec4 p0,vec4 p1,vec4 p2) {
  return bary.x*p0.yzw + bary.y*p1.yzw + bary.z*p2.yzw;
}

// Edge-based density interpolation (product-of-bary-coords weighting)
// Matches the Rust tri_edge_weight with geometric mean
float edgeDensity(vec3 bary, vec3 res) {
  float x = bary.x, y = bary.y, z = bary.z;
  float e0 = y * z; // edge A (between verts y,z)
  float e1 = x * z; // edge B
  float e2 = x * y; // edge C
  float sum = e0 + e1 + e2;
  if (sum < 1e-10) return max(res.x, max(res.y, res.z));
  // Weighted geometric mean in log space
  float logRes = (e0*log(max(res.x,1.0)) + e1*log(max(res.y,1.0)) + e2*log(max(res.z,1.0))) / sum;
  return exp(logRes);
}

void main(){
  vec3 p;
  float eps = 0.001;
  vec3 du, dv;
  if (u_useQB == 1) {
    p  = evalQB(a_bary, a_p0,a_p1,a_p2, a_w0,a_w1,a_w2);
    vec3 pu = evalQB(a_bary+vec3(-eps,eps,0.), a_p0,a_p1,a_p2, a_w0,a_w1,a_w2);
    vec3 pv = evalQB(a_bary+vec3(-eps,0.,eps), a_p0,a_p1,a_p2, a_w0,a_w1,a_w2);
    du = pu - p; dv = pv - p;
  } else {
    p  = evalFlat(a_bary, a_p0,a_p1,a_p2);
    vec3 pu = evalFlat(a_bary+vec3(-eps,eps,0.), a_p0,a_p1,a_p2);
    vec3 pv = evalFlat(a_bary+vec3(-eps,0.,eps), a_p0,a_p1,a_p2);
    du = pu - p; dv = pv - p;
  }
  vec3 n = normalize(cross(du, dv));
  v_normal_vs = normalize(mat3(u_mv) * n);

  // Density heatmap: normalize to 0..1 range
  float maxRes = max(u_edgeLod.x, max(u_edgeLod.y, u_edgeLod.z));
  float density = edgeDensity(a_bary, u_edgeLod);
  v_density = log2(max(density, 1.0)) / max(log2(maxRes), 1.0);

  gl_Position = u_mvp * vec4(p, 1.0);
}`;

// Matcap fragment shader — LOD color tint + matcap lighting from normal
const FS_MATCAP = `#version 300 es
precision mediump float;
in vec3 v_normal_vs;
in float v_density;
uniform vec3 u_lodColor;
out vec4 o;

// Viridis-like colormap for density heatmap
vec3 heatmap(float t) {
  t = clamp(t, 0.0, 1.0);
  // Dark purple → blue → teal → green → yellow
  vec3 c0 = vec3(0.27, 0.00, 0.33);
  vec3 c1 = vec3(0.13, 0.37, 0.73);
  vec3 c2 = vec3(0.12, 0.68, 0.55);
  vec3 c3 = vec3(0.56, 0.85, 0.27);
  vec3 c4 = vec3(0.99, 0.91, 0.15);
  if (t < 0.25) return mix(c0, c1, t*4.0);
  if (t < 0.5)  return mix(c1, c2, (t-0.25)*4.0);
  if (t < 0.75) return mix(c2, c3, (t-0.5)*4.0);
  return mix(c3, c4, (t-0.75)*4.0);
}

void main(){
  vec3 n = normalize(v_normal_vs);
  n = gl_FrontFacing ? n : -n;

  float NdV = max(n.z, 0.0);
  vec3 lightDir = normalize(vec3(0.4, 0.7, 0.9));
  float NdL = dot(n, lightDir);
  float diff = NdL * 0.5 + 0.5;

  vec3 H = normalize(lightDir + vec3(0,0,1));
  float spec = pow(max(dot(n, H), 0.0), 40.0);
  float rim = pow(1.0 - NdV, 3.0);

  // Blend density heatmap with matcap LOD color
  vec3 base = mix(u_lodColor, heatmap(v_density), 0.7);

  vec3 shadow = base * 0.15 + vec3(0.02, 0.02, 0.06);
  vec3 lit = base * 1.2;
  vec3 col = mix(shadow, lit, diff);
  col += vec3(1.0, 0.97, 0.92) * spec * 0.6;
  col += base * rim * 0.3;
  col += vec3(0.04, 0.03, 0.08);

  o = vec4(col, 1.0);
}`;

const FS_FLAT = `#version 300 es
precision mediump float;
in vec3 v_normal_vs;
in float v_density;
uniform vec3 u_lodColor;
out vec4 o;
void main(){ o = vec4(u_lodColor, 1.0); }`;

function mkS(src,t){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error('SHADER:',gl.getShaderInfoLog(s));return s;}
function mkProg(vs,fs){const p=gl.createProgram();gl.attachShader(p,mkS(vs,gl.VERTEX_SHADER));gl.attachShader(p,mkS(fs,gl.FRAGMENT_SHADER));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))console.error('LINK:',gl.getProgramInfoLog(p));return p;}

const progMatcap = mkProg(VS, FS_MATCAP);
const progFlat = mkProg(VS, FS_FLAT);

// LOD → vivid color via HSL rainbow
function lodColor(lod) {
  const maxLod = Math.max(...lod);
  const logLod = Math.log2(Math.max(maxLod, 1));
  const t = Math.min(logLod / 8.0, 1.0);
  // Hue: 240° (blue, low) → 0° (red, high)
  const h = (1.0 - t) * 240;
  const s = 0.85;
  const l = 0.55;
  // HSL to RGB
  const c = (1 - Math.abs(2*l - 1)) * s;
  const x = c * (1 - Math.abs((h/60)%2 - 1));
  const m = l - c/2;
  let r,g,b;
  if (h<60) { r=c;g=x;b=0; }
  else if (h<120) { r=x;g=c;b=0; }
  else if (h<180) { r=0;g=c;b=x; }
  else if (h<240) { r=0;g=x;b=c; }
  else if (h<300) { r=x;g=0;b=c; }
  else { r=c;g=0;b=x; }
  return [r+m, g+m, b+m];
}

let drawBatches = [];

function makeVAO(baryData, idxData, instanceData) {
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  const bb = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, bb);
  gl.bufferData(gl.ARRAY_BUFFER, baryData, gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 0, 0);
  const ib = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, ib);
  gl.bufferData(gl.ARRAY_BUFFER, instanceData, gl.STATIC_DRAW);
  for (let i=0;i<6;i++) {
    gl.enableVertexAttribArray(1+i);
    gl.vertexAttribPointer(1+i,4,gl.FLOAT,false,96,i*16);
    gl.vertexAttribDivisor(1+i,1);
  }
  const eb = gl.createBuffer();
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, eb);
  gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idxData, gl.STATIC_DRAW);
  gl.bindVertexArray(null);
  return vao;
}

function uploadBatches(data) {
  for (const b of drawBatches) { gl.deleteVertexArray(b.vaoOrig); gl.deleteVertexArray(b.vaoXform); if(b.vaoXformTri) gl.deleteVertexArray(b.vaoXformTri); }
  drawBatches = [];
  for (const batch of data.batches) {
    const bary = new Float32Array(batch.tess_bary);
    const tris = batch.tess_triangles;
    // Line indices for wireframe
    const lines = [];
    for (let i=0;i<tris.length;i+=3) lines.push(tris[i],tris[i+1],tris[i+1],tris[i+2],tris[i+2],tris[i]);
    const lineIdx = new Uint16Array(lines);
    const triIdx = new Uint16Array(tris);

    drawBatches.push({
      vaoOrig: makeVAO(bary, lineIdx, new Float32Array(batch.instances_orig)),
      vaoXform: makeVAO(bary, lineIdx, new Float32Array(batch.instances_xform)),
      vaoXformTri: makeVAO(bary, triIdx, new Float32Array(batch.instances_xform)),
      numLineIdx: lines.length,
      numTriIdx: tris.length,
      numInst: batch.num_faces,
      lod: batch.lod,
      color: lodColor(batch.lod),
    });
  }
}

function perspective(fov,a,n,f){const t=1/Math.tan(fov*.5),r=1/(n-f);return new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(n+f)*r,-1,0,0,n*f*r*2,0]);}
function lookAt(ex,ey,ez,tx,ty,tz,ux,uy,uz){let fx=tx-ex,fy=ty-ey,fz=tz-ez,fl=Math.hypot(fx,fy,fz);fx/=fl;fy/=fl;fz/=fl;let sx=fy*uz-fz*uy,sy=fz*ux-fx*uz,sz=fx*uy-fy*ux,sl=Math.hypot(sx,sy,sz);sx/=sl;sy/=sl;sz/=sl;let ux2=sy*fz-sz*fy,uy2=sz*fx-sx*fz,uz2=sx*fy-sy*fx;return new Float32Array([sx,ux2,-fx,0,sy,uy2,-fy,0,sz,uz2,-fz,0,-(sx*ex+sy*ey+sz*ez),-(ux2*ex+uy2*ey+uz2*ez),fx*ex+fy*ey+fz*ez,1]);}
function mulM4(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o;}

function render() {
  const w=$('wrap');
  canvas.width=w.clientWidth; canvas.height=w.clientHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.06,0.06,0.14,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  gl.enable(gl.DEPTH_TEST);
  if (!drawBatches.length) return;

  const ex=zoom*Math.sin(rotY)*Math.cos(rotX), ey=zoom*Math.sin(rotX), ez=zoom*Math.cos(rotY)*Math.cos(rotX);
  const view = lookAt(ex,ey,ez,0,0,0,0,1,0);
  const proj = perspective(Math.PI/3,canvas.width/canvas.height,0.1,100);
  const mvp = mulM4(proj, view);

  const drawWire = renderMode === 'wire' || renderMode === 'both';
  const drawSolid = renderMode === 'matcap' || renderMode === 'both';

  // Original wireframe (always dim)
  if (drawWire) {
    gl.useProgram(progFlat);
    gl.uniformMatrix4fv(gl.getUniformLocation(progFlat,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progFlat,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progFlat,'u_useQB'), 0);
    gl.uniform3f(gl.getUniformLocation(progFlat,'u_lodColor'), 0.25, 0.25, 0.35);
    gl.uniform3f(gl.getUniformLocation(progFlat,'u_edgeLod'), 1, 1, 1);
    for (const b of drawBatches) {
      gl.bindVertexArray(b.vaoOrig);
      gl.drawElementsInstanced(gl.LINES, b.numLineIdx, gl.UNSIGNED_SHORT, 0, b.numInst);
    }
  }

  // Transformed — matcap solid
  if (drawSolid) {
    gl.useProgram(progMatcap);
    gl.uniformMatrix4fv(gl.getUniformLocation(progMatcap,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progMatcap,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progMatcap,'u_useQB'), 1);
    for (const b of drawBatches) {
      gl.uniform3fv(gl.getUniformLocation(progMatcap,'u_lodColor'), b.color);
      gl.uniform3f(gl.getUniformLocation(progMatcap,'u_edgeLod'), b.lod[0], b.lod[1], b.lod[2]);
      gl.bindVertexArray(b.vaoXformTri);
      gl.drawElementsInstanced(gl.TRIANGLES, b.numTriIdx, gl.UNSIGNED_SHORT, 0, b.numInst);
    }
  }

  // Transformed — wireframe overlay
  if (drawWire) {
    gl.useProgram(progFlat);
    gl.uniformMatrix4fv(gl.getUniformLocation(progFlat,'u_mvp'), false, mvp);
    gl.uniformMatrix4fv(gl.getUniformLocation(progFlat,'u_mv'), false, view);
    gl.uniform1i(gl.getUniformLocation(progFlat,'u_useQB'), 1);
    for (const b of drawBatches) {
      gl.uniform3fv(gl.getUniformLocation(progFlat,'u_lodColor'), b.color);
      gl.uniform3f(gl.getUniformLocation(progFlat,'u_edgeLod'), b.lod[0], b.lod[1], b.lod[2]);
      gl.bindVertexArray(b.vaoXform);
      gl.drawElementsInstanced(gl.LINES, b.numLineIdx, gl.UNSIGNED_SHORT, 0, b.numInst);
    }
  }

  gl.bindVertexArray(null);
}

function update() {
  if (!wasmReady || !shapeData) return;
  const resVal = parseInt($('res').value);
  const res = resVal === 0 ? 0 : (1 << resVal);
  const sx = parseInt($('sx').value)/10;
  const sy = parseInt($('sy').value)/10;
  const sz = parseInt($('sz').value)/10;
  const sr = parseInt($('sr').value)/10;
  $('res-v').textContent = res === 0 ? 'auto' : res;
  $('sx-v').textContent = sx.toFixed(1);
  $('sy-v').textContent = sy.toFixed(1);
  $('sz-v').textContent = sz.toFixed(1);
  $('sr-v').textContent = sr.toFixed(1);

  const t0 = performance.now();
  const tType = sr > 0.01 ? 'sphere_reflection' : 'identity';
  const data = compute_mesh_batches(
    new Float64Array(shapeData.positions),
    new Uint32Array(shapeData.faces),
    tType, new Float64Array([sx, sy, sz, sr]), res,
  );
  const ms = performance.now() - t0;
  uploadBatches(data);
  render();
  const lods = data.batches.map(b => `[${b.lod}]`).join(' ');
  $('stats').innerHTML = `Faces: ${data.total_faces}<br>Batches: ${data.num_batches}<br>LODs: ${lods}<br>WASM: ${ms.toFixed(1)}ms`;
}

function loadShape(name) { shape=name; shapeData=get_shape(name); update(); }

for (const b of document.querySelectorAll('#shape-btns button'))
  b.onclick = () => { document.querySelectorAll('#shape-btns button').forEach(x=>x.classList.remove('a')); b.classList.add('a'); loadShape(b.dataset.v); };
for (const b of document.querySelectorAll('#render-btns button'))
  b.onclick = () => { renderMode=b.dataset.v; document.querySelectorAll('#render-btns button').forEach(x=>x.classList.remove('a')); b.classList.add('a'); render(); };
for (const id of ['res','sx','sy','sz','sr'])
  $(id).addEventListener('input', update);

let drag=false, lx=0, ly=0;
canvas.onmousedown = e => { drag=true; lx=e.clientX; ly=e.clientY; };
onmouseup = () => drag=false;
onmousemove = e => { if(!drag)return; rotY+=(e.clientX-lx)*0.01; rotX+=(e.clientY-ly)*0.01; lx=e.clientX; ly=e.clientY; render(); };
canvas.onwheel = e => { zoom *= e.deltaY>0 ? 1.1 : 0.9; zoom=Math.max(1,Math.min(100,zoom)); render(); e.preventDefault(); };
onresize = render;

await init();
wasmReady = true;
$('stats').textContent = 'WASM loaded';
loadShape('cube');
</script>
</body>
</html>
