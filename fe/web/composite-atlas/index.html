    <header><strong>composed tessellations + patches</strong><span title="Choose flat composition, curved triangle or curved quad. Drag blue corners or the on-arc midpoint; drag empty space to orbit. Wheel moves a selected handle in depth, otherwise zooms. Arc edge chooses the edited boundary; the other arcs follow through a common pole. Triangle uses bottom/right/left LoDs (top is inactive). Patch valid = 0 marks an unsupported or degenerate finite-pole construction, not a tessellation-quality score. Automatic density requests surface arc-length spacing on supported outer boundaries. Free weights leaves the circular-edge family and withdraws that spacing. Highlight folds colors reversed or degenerate parameter triangles magenta in both flat and curved views; hidden folds still need a mesh audit.">atlas → surface · geometric handles · measured arc-length spacing</span></header>
    <section class="stage" aria-label="Composed primary triangle tessellations" title="For same-state A/B, keep the geometry and LoDs fixed and toggle interior area correction with automatic density and compensate density enabled. This keeps the boundary maps and counts; neither placement is guaranteed fold-free. Color view separates triangle shape from sampled surface error. Error scale is in world units; warm means at or above that value. Error is sampled at each triangle's UV centroid, not a guaranteed accuracy bound.">
      <fe-surface src="../../ingots/demos/composite_atlas" state="live"></fe-surface>
    </section>
  </main>
