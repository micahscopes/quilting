[package]
name = "rust-atlas-baseline"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
quilting-core = { path = "../../../crates/quilting-core" }
getrandom = { version = "0.2", features = ["custom"] }

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
